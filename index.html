<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Music</title>
  <style>
    /* 用 unicode-range 强制：汉字/中文标点=宋体；数字/英文=Times New Roman */
    @font-face {
      font-family: "MusicMixed";
      src: local("Times New Roman");
      unicode-range:
        U+0000-024F,
        U+1E00-1EFF,
        U+2000-206F,
        U+20A0-20CF;
    }
    @font-face {
      font-family: "MusicMixed";
      src: local("SimSun"), local("宋体"), local("Songti SC"), local("STSong");
      unicode-range:
        U+2E80-2EFF,
        U+2F00-2FDF,
        U+3000-303F,
        U+31C0-31EF,
        U+3400-4DBF,
        U+4E00-9FFF,
        U+F900-FAFF,
        U+FF00-FFEF;
    }

    :root {
      --bg: #ffffff;
      --text: #000000;
      --muted: #000000;
      --line: #e9e9e7;
      --line-dark: #dadad7;
      --hover: #f7f7f5;
      --header: rgba(255, 255, 255, 0.97);
      --blue: #0067ff;
      --shadow: 0 6px 24px rgba(15, 15, 15, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: auto;
      background: var(--bg);
    }

    body {
      margin: 0;
      color: var(--text);
      background: var(--bg);
      font-family: "MusicMixed", "Times New Roman", SimSun, serif;
      font-size: 14px;
      line-height: 1.45;
    }

    button,
    input,
    select {
      font: inherit;
    }

    .page {
      width: 100%;
      min-height: 100vh;
      padding: 28px 34px 120px;
    }

    .title {
      margin: 0 0 18px;
      font-size: 34px;
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .database {
      width: 100%;
      min-width: 720px;
    }

    .toolbar {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 42px;
      padding: 4px 0 8px;
      border-bottom: 1px solid var(--line);
    }

    .toolbar-left,
    .toolbar-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .toolbar-btn,
    .sort-btn,
    .mini-btn {
      appearance: none;
      border: 1px solid transparent;
      border-radius: 6px;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      padding: 6px 9px;
      transition: background .12s ease, border-color .12s ease;
    }

    .toolbar-btn:hover,
    .sort-btn:hover,
    .mini-btn:hover {
      background: var(--hover);
    }

    .sort-btn.active {
      background: #eef5ff;
      color: #000000;
    }

    .save-state {
      color: var(--muted);
      font-size: 12px;
      padding-right: 2px;
      white-space: nowrap;
    }

    .table-shell {
      width: 100%;
      overflow-x: auto;
      border-bottom: 1px solid var(--line);
    }

    table {
      width: 100%;
      min-width: max-content;
      border-collapse: separate;
      border-spacing: 0;
      table-layout: fixed;
    }

    th,
    td {
      width: 210px;
      min-width: 120px;
      max-width: 440px;
      height: 39px;
      padding: 7px 10px;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      vertical-align: middle;
      text-align: left;
      background: #fff;
      overflow-wrap: anywhere;
    }

    th:first-child,
    td:first-child {
      border-left: 1px solid var(--line);
    }

    thead th {
      position: sticky;
      top: 0;
      z-index: 20;
      height: 38px;
      color: var(--muted);
      background: var(--header);
      backdrop-filter: blur(8px);
      font-weight: 700;
      box-shadow: 0 1px 0 var(--line);
    }

    th .header-inner {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .header-name {
      flex: 1;
      min-width: 40px;
      outline: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: text;
    }

    .header-name:focus,
    td[contenteditable="true"]:focus {
      outline: 2px solid rgba(0, 103, 255, 0.28);
      outline-offset: -2px;
      background: #fff;
    }

    .sort-mark {
      color: #000000;
      font-size: 12px;
      min-width: 12px;
      text-align: center;
    }

    .col-menu-btn {
      flex: 0 0 auto;
      width: 22px;
      height: 22px;
      padding: 0;
      border-radius: 5px;
      border: 0;
      background: transparent;
      color: #000000;
      cursor: pointer;
      opacity: 0;
    }

    th:hover .col-menu-btn,
    .col-menu-btn:focus {
      opacity: 1;
    }

    .col-menu-btn:hover {
      background: var(--hover);
      color: var(--text);
    }

    tbody tr:hover td {
      background: #fbfbfa;
    }

    td {
      outline: none;
      cursor: text;
    }


    body.resizing-columns {
      cursor: col-resize !important;
      user-select: none !important;
    }

    th[data-column-id],
    td[data-column-id] {
      position: relative;
    }

    .resize-handle {
      position: absolute;
      top: 0;
      right: -3px;
      z-index: 35;
      width: 7px;
      height: 100%;
      cursor: col-resize;
      background: transparent;
      touch-action: none;
    }

    .resize-handle::after {
      content: "";
      position: absolute;
      top: 5px;
      bottom: 5px;
      left: 3px;
      width: 1px;
      background: transparent;
    }

    th:hover .resize-handle::after,
    body.resizing-columns .resize-handle::after {
      background: #b7b7b3;
    }

    .select-cell {
      padding: 4px 7px;
      cursor: text;
    }

    td.nav-cell {
      outline: 2px solid #0067ff;
      outline-offset: -2px;
      background: #ffffff !important;
      cursor: default;
    }

    .combo-wrap {
      position: relative;
      width: 100%;
      min-height: 29px;
      display: flex;
      align-items: center;
    }

    .combo-input {
      width: 100%;
      height: 29px;
      padding: 4px 26px 4px 5px;
      border: 1px solid transparent;
      border-radius: 5px;
      outline: none;
      background: transparent;
      color: var(--text);
      font: inherit;
    }

    .combo-input:focus {
      border-color: rgba(0, 103, 255, 0.35);
      background: #fff;
      box-shadow: 0 0 0 1px rgba(0, 103, 255, 0.12);
    }

    .combo-arrow {
      position: absolute;
      right: 3px;
      top: 50%;
      transform: translateY(-50%);
      width: 21px;
      height: 21px;
      padding: 0;
      border: 0;
      border-radius: 4px;
      background: transparent;
      color: #000000;
      cursor: pointer;
      line-height: 21px;
      text-align: center;
    }

    .combo-arrow:hover {
      background: var(--hover);
      color: var(--text);
    }

    .combo-menu {
      position: fixed;
      z-index: 140;
      display: none;
      max-height: min(60vh, 520px);
      overflow-y: auto;
      padding: 5px;
      border: 1px solid var(--line-dark);
      border-radius: 9px;
      background: #fff;
      box-shadow: var(--shadow);
    }

    .combo-menu.show {
      display: block;
    }

    .combo-option {
      width: 100%;
      min-height: 31px;
      padding: 6px 8px;
      border: 0;
      border-radius: 5px;
      background: transparent;
      color: var(--text);
      text-align: left;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .combo-option:hover,
    .combo-option.active {
      background: var(--hover);
    }

    .combo-empty {
      padding: 7px 8px;
      color: var(--muted);
      font-size: 12px;
    }

    .row-number,
    .row-number-head {
      width: 54px !important;
      min-width: 54px !important;
      max-width: 54px !important;
      text-align: center;
      color: #000000;
      user-select: none;
    }

    .row-number {
      cursor: default;
      font-variant-numeric: tabular-nums;
    }

    .row-actions {
      position: sticky;
      right: 0;
      z-index: 8;
      width: 48px !important;
      min-width: 48px !important;
      max-width: 48px !important;
      text-align: center;
      padding: 0;
      background: #fff;
    }

    thead .row-actions {
      z-index: 25;
      background: var(--header);
    }

    tbody tr:hover .row-actions {
      background: #fbfbfa;
    }

    .delete-row {
      border: 0;
      background: transparent;
      color: #000000;
      cursor: pointer;
      width: 28px;
      height: 28px;
      border-radius: 5px;
      font-size: 17px;
      line-height: 1;
    }

    .delete-row:hover {
      color: #c73737;
      background: #fff0f0;
    }

    .new-row {
      width: 100%;
      border: 0;
      border-left: 1px solid var(--line);
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      background: #fff;
      color: var(--muted);
      text-align: left;
      padding: 10px 12px;
      cursor: pointer;
    }

    .new-row:hover {
      background: var(--hover);
      color: var(--text);
    }

    .sort-panel,
    .column-menu {
      position: fixed;
      z-index: 100;
      min-width: 330px;
      padding: 10px;
      border: 1px solid var(--line-dark);
      border-radius: 10px;
      background: #fff;
      box-shadow: var(--shadow);
      display: none;
    }

    .sort-panel.show,
    .column-menu.show {
      display: block;
    }

    .sort-panel {
      top: 78px;
      right: 34px;
    }

    .sort-title {
      font-weight: 600;
      margin-bottom: 8px;
    }

    .sort-rule {
      display: grid;
      grid-template-columns: 1fr 104px 32px;
      gap: 6px;
      margin: 6px 0;
      align-items: center;
    }

    .sort-rule select {
      min-width: 0;
      border: 1px solid var(--line-dark);
      border-radius: 6px;
      background: #fff;
      padding: 6px 8px;
      color: var(--text);
      outline: none;
    }

    .sort-rule button,
    .sort-footer button,
    .column-menu button {
      border: 0;
      border-radius: 6px;
      background: transparent;
      cursor: pointer;
      color: var(--text);
      padding: 7px 8px;
    }

    .sort-rule button:hover,
    .sort-footer button:hover,
    .column-menu button:hover {
      background: var(--hover);
    }

    .sort-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid var(--line);
    }

    .column-menu {
      min-width: 180px;
      padding: 6px;
    }

    .column-menu button {
      width: 100%;
      text-align: left;
    }

    .danger {
      color: #c73737 !important;
    }

    #backToTop {
      position: fixed;
      right: 22px;
      top: 65vh;
      z-index: 90;
      width: 28px;
      height: 28px;
      border: 0;
      border-radius: 50%;
      background: #0067ff;
      color: transparent;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 103, 255, .28);
      opacity: 0;
      pointer-events: none;
      transition: opacity .15s ease, transform .15s ease;
    }

    #backToTop::before,
    #backToTop::after {
      content: "";
      position: absolute;
      top: 10px;
      width: 8px;
      height: 2px;
      background: #fff;
      border-radius: 2px;
    }

    #backToTop::before {
      left: 7px;
      transform: rotate(-45deg);
    }

    #backToTop::after {
      right: 7px;
      transform: rotate(45deg);
    }

    #backToTop.visible {
      opacity: 1;
      pointer-events: auto;
    }

    #backToTop:hover {
      transform: scale(1.08);
    }

    .hint {
      color: var(--muted);
      font-size: 12px;
    }

    @media (max-width: 760px) {
      .page {
        padding: 20px 14px 100px;
      }

      .title {
        font-size: 30px;
      }

      .sort-panel {
        top: 72px;
        right: 14px;
        left: 14px;
        min-width: auto;
      }

      #backToTop {
        right: 12px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <h1 class="title">Music</h1>

    <section class="database" aria-label="Music database">
      <div class="toolbar">
        <div class="toolbar-left">
          <button class="toolbar-btn" id="addRowTop" type="button">＋ 新增行</button>
          <button class="toolbar-btn" id="addColumn" type="button">＋ 新增列</button>
          <button class="sort-btn" id="sortToggle" type="button">⇅ 排序</button>
        </div>
        <div class="toolbar-right">
          <span class="save-state" id="saveState">已自动保存</span>
        </div>
      </div>

      <div class="table-shell">
        <table id="musicTable">
          <thead id="tableHead"></thead>
          <tbody id="tableBody"></tbody>
        </table>
        <button class="new-row" id="addRowBottom" type="button">＋ 新建</button>
      </div>
    </section>
  </main>

  <div class="sort-panel" id="sortPanel" role="dialog" aria-label="排序设置">
    <div class="sort-title">排序标准</div>
    <div class="hint">可添加多条规则，按从上到下的优先级排序。</div>
    <div id="sortRules"></div>
    <div class="sort-footer">
      <button type="button" id="addSortRule">＋ 添加排序</button>
      <button type="button" id="clearSort">清除排序</button>
    </div>
  </div>

  <div class="combo-menu" id="comboMenu" role="listbox" aria-label="下拉选项"></div>

  <div class="column-menu" id="columnMenu">
    <button type="button" id="sortAsc">升序排列</button>
    <button type="button" id="sortDesc">降序排列</button>
    <button type="button" id="renameColumn">重命名</button>
    <button type="button" id="deleteColumn" class="danger">删除该列</button>
  </div>

  <button id="backToTop" type="button" aria-label="回到顶部" title="回到顶部"></button>

  <script>
    (() => {
      const STORAGE_KEY = "music-notion-database-v1";
      const SELECT_IDS = new Set(["artist", "album", "website"]);
      const SELECT_NAMES = new Set(["歌手", "专辑", "网站"]);

      const defaultState = {
        columns: [
          { id: "title", name: "曲名", width: 240 },
          { id: "artist", name: "歌手", width: 200 },
          { id: "album", name: "专辑", width: 220 },
          { id: "website", name: "网站", width: 260 },
          { id: "year", name: "年份", width: 120 },
          { id: "rating", name: "评分", width: 120 }
        ],
        rows: [
          {
            id: crypto.randomUUID(),
            cells: {
              title: "示例歌曲",
              artist: "Artist",
              album: "Album",
              website: "",
              year: "2026",
              rating: "9.0"
            }
          },
          { id: crypto.randomUUID(), cells: { title: "", artist: "", album: "", website: "", year: "", rating: "" } },
          { id: crypto.randomUUID(), cells: { title: "", artist: "", album: "", website: "", year: "", rating: "" } }
        ],
        sortRules: [],
        selectOptions: {
          artist: ["Artist"],
          album: ["Album"],
          website: []
        }
      };

      let state = loadState();
      let activeColumnId = null;
      let saveTimer = null;
      let comboContext = null;
      let navCell = null;

      const tableHead = document.getElementById("tableHead");
      const tableBody = document.getElementById("tableBody");
      const saveState = document.getElementById("saveState");
      const sortPanel = document.getElementById("sortPanel");
      const sortRules = document.getElementById("sortRules");
      const sortToggle = document.getElementById("sortToggle");
      const columnMenu = document.getElementById("columnMenu");
      const comboMenu = document.getElementById("comboMenu");

      function cloneDefault() {
        return JSON.parse(JSON.stringify(defaultState));
      }

      function migrateState(parsed) {
        parsed.sortRules = Array.isArray(parsed.sortRules) ? parsed.sortRules : [];
        parsed.selectOptions = parsed.selectOptions && typeof parsed.selectOptions === "object"
          ? parsed.selectOptions
          : {};

        // 兼容上一版：若没有“网站”列，则自动插入，不清除已有数据。
        const hasWebsite = parsed.columns.some(col => col.id === "website" || col.name === "网站");
        if (!hasWebsite) {
          const albumIndex = parsed.columns.findIndex(col => col.id === "album" || col.name === "专辑");
          const insertAt = albumIndex >= 0 ? albumIndex + 1 : parsed.columns.length;
          parsed.columns.splice(insertAt, 0, { id: "website", name: "网站", width: 260 });
          parsed.rows.forEach(row => {
            row.cells = row.cells || {};
            if (!("website" in row.cells)) row.cells.website = "";
          });
        }

        return parsed;
      }

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return cloneDefault();
          const parsed = JSON.parse(raw);
          if (!Array.isArray(parsed.columns) || !Array.isArray(parsed.rows)) return cloneDefault();
          return migrateState(parsed);
        } catch {
          return cloneDefault();
        }
      }

      function scheduleSave() {
        saveState.textContent = "保存中…";
        clearTimeout(saveTimer);
        saveTimer = setTimeout(() => {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
          saveState.textContent = "已自动保存";
        }, 180);
      }

      function makeColumnId() {
        return "col_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 7);
      }

      function isSelectColumn(col) {
        return SELECT_IDS.has(col.id) || SELECT_NAMES.has((col.name || "").trim());
      }

      function getDefaultWidth(col) {
        if (col.id === "title") return 240;
        if (col.id === "website" || col.name === "网站") return 260;
        if (col.id === "year" || col.id === "rating") return 120;
        return 210;
      }

      function normalizeState() {
        state.selectOptions = state.selectOptions && typeof state.selectOptions === "object"
          ? state.selectOptions
          : {};

        const validIds = new Set(state.columns.map(c => c.id));

        state.columns.forEach(col => {
          const n = Number(col.width);
          col.width = Number.isFinite(n) ? Math.max(80, Math.round(n)) : getDefaultWidth(col);
          if (isSelectColumn(col) && !Array.isArray(state.selectOptions[col.id])) {
            state.selectOptions[col.id] = [];
          }
        });

        state.rows.forEach(row => {
          row.cells = row.cells || {};
          state.columns.forEach(col => {
            if (!(col.id in row.cells)) row.cells[col.id] = "";
            if (isSelectColumn(col)) {
              const value = String(row.cells[col.id] ?? "").trim();
              if (value) addOption(col, value, false);
            }
          });

          Object.keys(row.cells).forEach(id => {
            if (!validIds.has(id)) delete row.cells[id];
          });
        });

        state.sortRules = state.sortRules.filter(r => validIds.has(r.columnId));
      }

      function render() {
        normalizeState();
        closeCombo();
        renderHead();
        renderBody();
        renderSortRules();
        updateSortButton();
        scheduleSave();
      }

      function setCellWidth(el, col) {
        const width = Math.max(80, Number(col.width) || 210);
        el.style.width = width + "px";
        el.style.minWidth = width + "px";
        el.style.maxWidth = width + "px";
      }

      function updateColumnWidth(col) {
        document.querySelectorAll(`[data-column-id="${CSS.escape(col.id)}"]`).forEach(el => {
          setCellWidth(el, col);
        });
      }

      function beginColumnResize(event, col, th) {
        event.preventDefault();
        event.stopPropagation();

        const startX = event.clientX;
        const startWidth = th.getBoundingClientRect().width;
        document.body.classList.add("resizing-columns");

        const onMove = (moveEvent) => {
          const next = Math.max(80, Math.round(startWidth + moveEvent.clientX - startX));
          col.width = next;
          updateColumnWidth(col);
        };

        const onUp = () => {
          document.body.classList.remove("resizing-columns");
          document.removeEventListener("mousemove", onMove);
          document.removeEventListener("mouseup", onUp);
          scheduleSave();
        };

        document.addEventListener("mousemove", onMove);
        document.addEventListener("mouseup", onUp);
      }

      function renderHead() {
        const tr = document.createElement("tr");

        const numberHead = document.createElement("th");
        numberHead.className = "row-number-head";
        numberHead.textContent = "#";
        tr.appendChild(numberHead);

        state.columns.forEach(col => {
          const th = document.createElement("th");
          th.dataset.columnId = col.id;
          setCellWidth(th, col);

          const wrap = document.createElement("div");
          wrap.className = "header-inner";

          const name = document.createElement("div");
          name.className = "header-name";
          name.contentEditable = "true";
          name.spellcheck = false;
          name.textContent = col.name;
          name.title = "点击编辑列名";
          name.addEventListener("input", () => {
            col.name = name.textContent.trim() || "未命名";
            if (isSelectColumn(col) && !Array.isArray(state.selectOptions[col.id])) {
              state.selectOptions[col.id] = [];
            }
            renderSortRules();
            scheduleSave();
          });
          name.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
              e.preventDefault();
              name.blur();
            }
          });

          name.addEventListener("blur", () => {
            if (!name.textContent.trim()) {
              name.textContent = "未命名";
              col.name = "未命名";
            }
            renderSortRules();
            scheduleSave();
          });

          const mark = document.createElement("span");
          mark.className = "sort-mark";
          const index = state.sortRules.findIndex(r => r.columnId === col.id);
          if (index !== -1) {
            const rule = state.sortRules[index];
            mark.textContent = rule.direction === "asc" ? "↑" : "↓";
          }

          const menu = document.createElement("button");
          menu.className = "col-menu-btn";
          menu.type = "button";
          menu.textContent = "•••";
          menu.title = "列选项";
          menu.addEventListener("click", (e) => {
            e.stopPropagation();
            activeColumnId = col.id;
            openColumnMenu(menu);
          });

          const resize = document.createElement("div");
          resize.className = "resize-handle";
          resize.title = "拖动调整列宽";
          resize.addEventListener("mousedown", e => beginColumnResize(e, col, th));

          wrap.append(name, mark, menu);
          th.append(wrap, resize);
          tr.appendChild(th);
        });

        const actionHead = document.createElement("th");
        actionHead.className = "row-actions";
        tr.appendChild(actionHead);

        tableHead.replaceChildren(tr);
      }

      function handleTabAtEnd(event, tr, editor) {
        if (event.key !== "Tab" || event.shiftKey) return false;
        const editors = Array.from(tr.querySelectorAll('[data-cell-editor="true"]'));
        if (editor !== editors[editors.length - 1]) return false;

        event.preventDefault();
        const newRow = addRow(false);
        render();
        requestAnimationFrame(() => focusFirstEditor(newRow.id));
        return true;
      }

      function focusFirstEditor(rowId) {
        const tr = document.querySelector(`tr[data-row-id="${CSS.escape(rowId)}"]`);
        const editor = tr?.querySelector('[data-cell-editor="true"]');
        if (!editor) return;
        clearNavigationMode();
        editor.focus();
        if (editor.isContentEditable) {
          placeCaretAtEnd(editor);
        }
      }

      function placeCaretAtEnd(el) {
        const range = document.createRange();
        range.selectNodeContents(el);
        range.collapse(false);
        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
      }

      function clearNavigationMode() {
        if (!navCell) return;
        if (navCell.dataset.editorKind === "text") {
          navCell.contentEditable = "true";
        }
        navCell.classList.remove("nav-cell");
        navCell = null;
      }

      function enterNavigationMode(td) {
        if (!td) return;

        closeCombo();

        if (navCell && navCell !== td) {
          clearNavigationMode();
        }

        navCell = td;
        td.classList.add("nav-cell");
        td.tabIndex = 0;

        if (td.dataset.editorKind === "text") {
          td.contentEditable = "false";
        } else {
          const input = td.querySelector(".combo-input");
          if (input && document.activeElement === input) input.blur();
        }

        td.focus({ preventScroll: true });
        td.scrollIntoView({ block: "nearest", inline: "nearest" });
      }

      function moveNavigationCell(td, key) {
        const rows = Array.from(tableBody.querySelectorAll("tr[data-row-id]"));
        const tr = td.closest("tr[data-row-id]");
        if (!tr) return;

        const rowIndex = rows.indexOf(tr);
        const colIndex = state.columns.findIndex(col => col.id === td.dataset.columnId);
        if (rowIndex < 0 || colIndex < 0) return;

        let nextRow = rowIndex;
        let nextCol = colIndex;

        if (key === "ArrowUp") nextRow--;
        if (key === "ArrowDown") nextRow++;
        if (key === "ArrowLeft") nextCol--;
        if (key === "ArrowRight") nextCol++;

        nextRow = Math.max(0, Math.min(rows.length - 1, nextRow));
        nextCol = Math.max(0, Math.min(state.columns.length - 1, nextCol));

        const nextColumnId = state.columns[nextCol].id;
        const target = rows[nextRow].querySelector(
          `td[data-column-id="${CSS.escape(nextColumnId)}"]`
        );

        if (target) enterNavigationMode(target);
      }

      function renderBody() {
        const rows = getSortedRows();
        const fragment = document.createDocumentFragment();

        rows.forEach((row, visibleIndex) => {
          const tr = document.createElement("tr");
          tr.dataset.rowId = row.id;

          const num = document.createElement("td");
          num.className = "row-number";
          num.textContent = String(visibleIndex + 1);
          tr.appendChild(num);

          state.columns.forEach(col => {
            const td = document.createElement("td");
            td.dataset.columnId = col.id;
            td.tabIndex = -1;
            setCellWidth(td, col);

            if (isSelectColumn(col)) {
              td.className = "select-cell";
              td.dataset.editorKind = "combo";

              const wrap = document.createElement("div");
              wrap.className = "combo-wrap";

              const input = document.createElement("input");
              input.className = "combo-input";
              input.type = "text";
              input.autocomplete = "off";
              input.spellcheck = false;
              input.value = row.cells[col.id] ?? "";
              input.dataset.cellEditor = "true";
              input.setAttribute("role", "combobox");
              input.setAttribute("aria-autocomplete", "list");
              input.setAttribute("aria-expanded", "false");

              const arrow = document.createElement("button");
              arrow.type = "button";
              arrow.className = "combo-arrow";
              arrow.tabIndex = -1;
              arrow.textContent = "▾";
              arrow.title = "显示选项";

              input.addEventListener("focus", () => {
                if (navCell === td) clearNavigationMode();
                openCombo(input, row, col, true);
              });

              input.addEventListener("input", () => {
                row.cells[col.id] = input.value;
                scheduleSave();
                openCombo(input, row, col, true);
              });

              input.addEventListener("keydown", (e) => {
                if (e.key === "ArrowDown") {
                  e.preventDefault();
                  if (!comboContext || comboContext.input !== input) {
                    openCombo(input, row, col, true);
                  } else {
                    moveComboHighlight(1);
                  }
                  return;
                }

                if (e.key === "ArrowUp") {
                  e.preventDefault();
                  if (!comboContext || comboContext.input !== input) {
                    openCombo(input, row, col, true);
                  } else {
                    moveComboHighlight(-1);
                  }
                  return;
                }

                if (e.key === "Enter") {
                  e.preventDefault();
                  if (
                    comboContext &&
                    comboContext.input === input &&
                    comboContext.matches.length
                  ) {
                    selectComboOption(comboContext.matches[comboContext.activeIndex], true);
                  } else {
                    commitComboValue(input, row, col);
                    enterNavigationMode(td);
                  }
                  return;
                }

                if (e.key === "Escape") {
                  closeCombo();
                  input.select();
                  return;
                }

                if (e.key === "Tab") {
                  commitComboValue(input, row, col, false);
                  handleTabAtEnd(e, tr, input);
                }
              });

              input.addEventListener("blur", () => {
                setTimeout(() => {
                  commitComboValue(input, row, col, false);
                  if (comboContext?.input === input) closeCombo();
                }, 80);
              });

              arrow.addEventListener("mousedown", e => e.preventDefault());
              arrow.addEventListener("click", e => {
                e.stopPropagation();
                input.focus();
                openCombo(input, row, col, true, true);
              });

              wrap.append(input, arrow);
              td.appendChild(wrap);
            } else {
              td.dataset.editorKind = "text";
              td.contentEditable = "true";
              td.spellcheck = false;
              td.dataset.cellEditor = "true";
              td.textContent = row.cells[col.id] ?? "";

              td.addEventListener("input", () => {
                row.cells[col.id] = td.textContent;
                scheduleSave();
              });

              td.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                  e.preventDefault();
                  row.cells[col.id] = td.textContent;
                  scheduleSave();
                  enterNavigationMode(td);
                  return;
                }
                handleTabAtEnd(e, tr, td);
              });

              td.addEventListener("click", () => {
                if (navCell !== td) return;
                clearNavigationMode();
                requestAnimationFrame(() => {
                  td.focus();
                  placeCaretAtEnd(td);
                });
              });
            }

            tr.appendChild(td);
          });

          const actions = document.createElement("td");
          actions.className = "row-actions";

          const del = document.createElement("button");
          del.type = "button";
          del.className = "delete-row";
          del.title = "删除本行";
          del.textContent = "×";
          del.addEventListener("click", () => {
            state.rows = state.rows.filter(r => r.id !== row.id);
            render();
          });

          actions.appendChild(del);
          tr.appendChild(actions);
          fragment.appendChild(tr);
        });

        tableBody.replaceChildren(fragment);
      }

      function getOptions(col) {
        if (!Array.isArray(state.selectOptions[col.id])) {
          state.selectOptions[col.id] = [];
        }
        return state.selectOptions[col.id];
      }

      function addOption(col, value, shouldSave = true) {
        const clean = String(value ?? "").trim();
        if (!clean) return;

        const options = getOptions(col);
        const exists = options.some(option =>
          String(option).localeCompare(clean, "zh-CN", { sensitivity: "base" }) === 0
        );

        if (!exists) {
          options.push(clean);
          options.sort((a, b) => String(a).localeCompare(String(b), "zh-CN", {
            numeric: true,
            sensitivity: "base"
          }));
          if (shouldSave) scheduleSave();
        }
      }

      function filteredOptions(col, query) {
        const q = String(query ?? "").trim().toLocaleLowerCase();
        const options = [...getOptions(col)];

        if (!q) return options;

        return options
          .filter(option => String(option).toLocaleLowerCase().includes(q))
          .sort((a, b) => {
            const aa = String(a).toLocaleLowerCase();
            const bb = String(b).toLocaleLowerCase();
            const aStarts = aa.startsWith(q) ? 0 : 1;
            const bStarts = bb.startsWith(q) ? 0 : 1;
            return aStarts - bStarts || aa.localeCompare(bb, "zh-CN", { numeric: true });
          });
      }

      function openCombo(input, row, col, showEmptyState = true, showAll = false) {
        const matches = showAll ? [...getOptions(col)] : filteredOptions(col, input.value);
        comboContext = {
          input,
          row,
          col,
          matches,
          activeIndex: matches.length ? 0 : -1
        };

        input.setAttribute("aria-expanded", "true");
        renderComboMenu(showEmptyState);
        positionComboMenu(input);
      }

      function renderComboMenu(showEmptyState = true) {
        comboMenu.replaceChildren();
        if (!comboContext) {
          comboMenu.classList.remove("show");
          return;
        }

        const { matches, activeIndex } = comboContext;

        if (!matches.length) {
          if (!showEmptyState) {
            closeCombo();
            return;
          }
          const empty = document.createElement("div");
          empty.className = "combo-empty";
          empty.textContent = "没有匹配项；按 Enter 保存为新选项";
          comboMenu.appendChild(empty);
        } else {
          matches.forEach((value, index) => {
            const option = document.createElement("button");
            option.type = "button";
            option.className = "combo-option" + (index === activeIndex ? " active" : "");
            option.textContent = value;
            option.setAttribute("role", "option");
            option.setAttribute("aria-selected", index === activeIndex ? "true" : "false");

            option.addEventListener("mousedown", e => {
              e.preventDefault();
              selectComboOption(value, true);
            });

            comboMenu.appendChild(option);
          });
        }

        comboMenu.classList.add("show");
      }

      function positionComboMenu(input) {
        if (!comboContext) return;
        const rect = input.getBoundingClientRect();
        const width = Math.max(180, rect.width);
        comboMenu.style.width = width + "px";

        const maxMenuHeight = Math.min(window.innerHeight * 0.6, 520);
        const menuHeight = Math.min(comboMenu.scrollHeight || 220, maxMenuHeight);
        let top = rect.bottom + 4;

        if (top + menuHeight > window.innerHeight - 8) {
          top = Math.max(8, rect.top - menuHeight - 4);
        }

        comboMenu.style.left =
          Math.max(8, Math.min(rect.left, window.innerWidth - width - 8)) + "px";
        comboMenu.style.top = top + "px";
      }

      function moveComboHighlight(direction) {
        if (!comboContext?.matches.length) return;
        const length = comboContext.matches.length;
        comboContext.activeIndex =
          (comboContext.activeIndex + direction + length) % length;
        renderComboMenu(true);
        positionComboMenu(comboContext.input);

        const active = comboMenu.querySelector(".combo-option.active");
        active?.scrollIntoView({ block: "nearest" });
      }

      function selectComboOption(value, finishInput = false) {
        if (!comboContext) return;
        const { input, row, col } = comboContext;
        const td = input.closest('td[data-column-id]');
        input.value = value;
        row.cells[col.id] = value;
        addOption(col, value, false);
        scheduleSave();
        closeCombo();

        if (finishInput) {
          enterNavigationMode(td);
        } else {
          input.focus();
        }
      }

      function commitComboValue(input, row, col, close = true) {
        const value = input.value.trim();
        input.value = value;
        row.cells[col.id] = value;
        if (value) addOption(col, value, false);
        scheduleSave();
        if (close) closeCombo();
      }

      function closeCombo() {
        if (comboContext?.input) {
          comboContext.input.setAttribute("aria-expanded", "false");
        }
        comboContext = null;
        comboMenu.classList.remove("show");
        comboMenu.replaceChildren();
      }

      function addRow(shouldRender = true) {
        const row = { id: crypto.randomUUID(), cells: {} };
        state.columns.forEach(col => row.cells[col.id] = "");
        state.rows.push(row);
        if (shouldRender) render();
        return row;
      }

      function addColumn() {
        const id = makeColumnId();
        const index = state.columns.length + 1;
        state.columns.push({ id, name: "新列 " + index, width: 210 });
        state.rows.forEach(row => row.cells[id] = "");
        render();

        requestAnimationFrame(() => {
          const el = document.querySelector(`th[data-column-id="${CSS.escape(id)}"] .header-name`);
          if (el) {
            el.focus();
            const range = document.createRange();
            range.selectNodeContents(el);
            const selection = window.getSelection();
            selection.removeAllRanges();
            selection.addRange(range);
          }
        });
      }

      function compareValues(a, b) {
        const av = String(a ?? "").trim();
        const bv = String(b ?? "").trim();

        if (av === "" && bv === "") return 0;
        if (av === "") return 1;
        if (bv === "") return -1;

        const an = Number(av.replace(/,/g, ""));
        const bn = Number(bv.replace(/,/g, ""));
        const bothNumeric = Number.isFinite(an) && Number.isFinite(bn);

        if (bothNumeric) return an - bn;

        return av.localeCompare(bv, "zh-CN", {
          numeric: true,
          sensitivity: "base"
        });
      }

      function getSortedRows() {
        const rows = [...state.rows];
        if (!state.sortRules.length) return rows;

        return rows.sort((a, b) => {
          for (const rule of state.sortRules) {
            const cmp = compareValues(a.cells[rule.columnId], b.cells[rule.columnId]);
            if (cmp !== 0) return rule.direction === "desc" ? -cmp : cmp;
          }
          return 0;
        });
      }

      function addSortRule(columnId = state.columns[0]?.id, direction = "asc") {
        if (!columnId) return;
        state.sortRules.push({ id: crypto.randomUUID(), columnId, direction });
        render();
      }

      function renderSortRules() {
        sortRules.replaceChildren();

        if (!state.sortRules.length) {
          const empty = document.createElement("div");
          empty.className = "hint";
          empty.style.padding = "8px 0 2px";
          empty.textContent = "当前没有排序规则。";
          sortRules.appendChild(empty);
          return;
        }

        state.sortRules.forEach(rule => {
          const row = document.createElement("div");
          row.className = "sort-rule";

          const colSelect = document.createElement("select");
          state.columns.forEach(col => {
            const option = document.createElement("option");
            option.value = col.id;
            option.textContent = col.name;
            option.selected = col.id === rule.columnId;
            colSelect.appendChild(option);
          });

          colSelect.addEventListener("change", () => {
            rule.columnId = colSelect.value;
            render();
          });

          const dirSelect = document.createElement("select");
          [["asc", "升序"], ["desc", "降序"]].forEach(([value, label]) => {
            const option = document.createElement("option");
            option.value = value;
            option.textContent = label;
            option.selected = value === rule.direction;
            dirSelect.appendChild(option);
          });

          dirSelect.addEventListener("change", () => {
            rule.direction = dirSelect.value;
            render();
          });

          const del = document.createElement("button");
          del.type = "button";
          del.title = "移除此规则";
          del.textContent = "×";
          del.addEventListener("click", () => {
            state.sortRules = state.sortRules.filter(r => r.id !== rule.id);
            render();
          });

          row.append(colSelect, dirSelect, del);
          sortRules.appendChild(row);
        });
      }

      function updateSortButton() {
        sortToggle.classList.toggle("active", state.sortRules.length > 0);
        sortToggle.textContent = state.sortRules.length
          ? `⇅ 排序 ${state.sortRules.length}`
          : "⇅ 排序";
      }

      function openColumnMenu(anchor) {
        closeCombo();
        const rect = anchor.getBoundingClientRect();
        columnMenu.classList.add("show");

        const menuWidth = 180;
        const left = Math.min(rect.left, window.innerWidth - menuWidth - 12);
        let top = rect.bottom + 6;

        if (top + 170 > window.innerHeight) {
          top = Math.max(8, rect.top - 170);
        }

        columnMenu.style.left = Math.max(8, left) + "px";
        columnMenu.style.top = top + "px";
      }

      function closePopovers(except = null) {
        if (except !== "sort") sortPanel.classList.remove("show");
        if (except !== "column") columnMenu.classList.remove("show");
      }

      function sortSingleColumn(direction) {
        if (!activeColumnId) return;
        state.sortRules = [{
          id: crypto.randomUUID(),
          columnId: activeColumnId,
          direction
        }];
        closePopovers();
        render();
      }

      function renameActiveColumn() {
        if (!activeColumnId) return;
        closePopovers();
        const el = document.querySelector(
          `th[data-column-id="${CSS.escape(activeColumnId)}"] .header-name`
        );
        if (el) {
          el.focus();
          const range = document.createRange();
          range.selectNodeContents(el);
          const selection = window.getSelection();
          selection.removeAllRanges();
          selection.addRange(range);
        }
      }

      function deleteActiveColumn() {
        if (!activeColumnId) return;
        if (state.columns.length <= 1) {
          alert("至少保留一列。");
          return;
        }

        state.columns = state.columns.filter(c => c.id !== activeColumnId);
        state.rows.forEach(row => delete row.cells[activeColumnId]);
        state.sortRules = state.sortRules.filter(r => r.columnId !== activeColumnId);
        delete state.selectOptions[activeColumnId];
        activeColumnId = null;
        closePopovers();
        render();
      }

      document.getElementById("addRowTop").addEventListener("click", () => addRow());
      document.getElementById("addRowBottom").addEventListener("click", () => addRow());
      document.getElementById("addColumn").addEventListener("click", addColumn);

      sortToggle.addEventListener("click", e => {
        e.stopPropagation();
        const willShow = !sortPanel.classList.contains("show");
        closeCombo();
        closePopovers();
        if (willShow) sortPanel.classList.add("show");
      });

      document.getElementById("addSortRule").addEventListener("click", () => addSortRule());

      document.getElementById("clearSort").addEventListener("click", () => {
        state.sortRules = [];
        render();
      });

      document.getElementById("sortAsc").addEventListener("click", () => sortSingleColumn("asc"));
      document.getElementById("sortDesc").addEventListener("click", () => sortSingleColumn("desc"));
      document.getElementById("renameColumn").addEventListener("click", renameActiveColumn);
      document.getElementById("deleteColumn").addEventListener("click", deleteActiveColumn);

      document.addEventListener("keydown", e => {
        if (!navCell || document.activeElement !== navCell) return;
        if (!["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.key)) return;

        e.preventDefault();
        moveNavigationCell(navCell, e.key);
      });

      document.addEventListener("pointerdown", e => {
        if (!navCell) return;
        if (navCell.contains(e.target)) return;
        clearNavigationMode();
      }, true);

      document.addEventListener("click", e => {
        if (!sortPanel.contains(e.target) && e.target !== sortToggle) {
          sortPanel.classList.remove("show");
        }

        if (!columnMenu.contains(e.target) && !e.target.closest(".col-menu-btn")) {
          columnMenu.classList.remove("show");
        }

        if (!comboMenu.contains(e.target) && !e.target.closest(".combo-wrap")) {
          closeCombo();
        }
      });

      window.addEventListener("resize", () => {
        columnMenu.classList.remove("show");
        closeCombo();
      });

      const backToTop = document.getElementById("backToTop");
      let topTimer = null;

      window.addEventListener("scroll", () => {
        backToTop.classList.toggle("visible", window.scrollY > 320);
        if (comboContext) closeCombo();
      }, { passive: true });

      backToTop.addEventListener("click", () => {
        if (topTimer) clearInterval(topTimer);

        topTimer = setInterval(() => {
          const current = window.scrollY || document.documentElement.scrollTop;

          if (current <= 0) {
            clearInterval(topTimer);
            topTimer = null;
            window.scrollTo(0, 0);
            return;
          }

          const next = Math.max(0, current - Math.max(18, current * 0.12));
          window.scrollTo(0, next);
        }, 10);
      });

      render();
    })();
  </script>
</body>
</html>
