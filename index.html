<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Music</title>
  <style>
    /* 用 unicode-range 强制：汉字/中文标点=宋体；数字/英文=Times New Roman */
    @font-face {
      font-family: "MusicMixed";
      src: local("Times New Roman");
      unicode-range:
        U+0000-024F,
        U+1E00-1EFF,
        U+2000-206F,
        U+20A0-20CF;
    }
    @font-face {
      font-family: "MusicMixed";
      src: local("SimSun"), local("宋体"), local("Songti SC"), local("STSong");
      unicode-range:
        U+2E80-2EFF,
        U+2F00-2FDF,
        U+3000-303F,
        U+31C0-31EF,
        U+3400-4DBF,
        U+4E00-9FFF,
        U+F900-FAFF,
        U+FF00-FFEF;
    }

    :root {
      --bg: #ffffff;
      --text: #000000;
      --muted: #000000;
      --line: #e9e9e7;
      --line-dark: #dadad7;
      --hover: #f7f7f5;
      --header: rgba(255, 255, 255, 0.97);
      --blue: #0067ff;
      --shadow: 0 6px 24px rgba(15, 15, 15, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: auto;
      background: var(--bg);
    }

    body {
      margin: 0;
      color: var(--text);
      background: var(--bg);
      font-family: "MusicMixed", "Times New Roman", SimSun, serif;
      font-size: 14px;
      line-height: 1.45;
    }

    button,
    input,
    select {
      font: inherit;
    }

    .page {
      width: 100%;
      min-height: 100vh;
      padding: 28px 34px 120px;
    }

    .title {
      margin: 0 0 18px;
      font-size: 34px;
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .database {
      width: 100%;
      min-width: 720px;
    }


    #musicTable *,
    #musicTable input,
    #musicTable button,
    #musicTable [contenteditable="true"] {
      font-family: "MusicMixed", "Times New Roman", SimSun, serif !important;
      font-size: inherit !important;
      font-style: normal;
    }

    .toolbar {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 42px;
      padding: 4px 0 8px;
      border-bottom: 1px solid var(--line);
    }

    .toolbar-left,
    .toolbar-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .toolbar-btn,
    .sort-btn,
    .mini-btn {
      appearance: none;
      border: 1px solid transparent;
      border-radius: 6px;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      padding: 6px 9px;
      transition: background .12s ease, border-color .12s ease;
    }

    .toolbar-btn:hover,
    .sort-btn:hover,
    .mini-btn:hover {
      background: var(--hover);
    }

    .sort-btn.active {
      background: #eef5ff;
      color: #000000;
    }

    .save-state {
      color: var(--muted);
      font-size: 12px;
      padding-right: 2px;
      white-space: nowrap;
    }

    .table-shell {
      width: 100%;
      overflow-x: auto;
      border-bottom: 1px solid var(--line);
    }

    table {
      width: 100%;
      min-width: max-content;
      border-collapse: separate;
      border-spacing: 0;
      table-layout: fixed;
    }

    th,
    td {
      font-size: 15px;
      font-family: "MusicMixed", "Times New Roman", SimSun, serif !important;
      width: 210px;
      min-width: 120px;
      max-width: 440px;
      height: 39px;
      padding: 7px 10px;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      vertical-align: top;
      text-align: left;
      background: #fff;
      overflow-wrap: anywhere;
    }

    th:first-child,
    td:first-child {
      border-left: 1px solid var(--line);
    }

    thead th {
      position: sticky;
      top: 0;
      z-index: 20;
      height: 38px;
      color: var(--muted);
      background: var(--header);
      backdrop-filter: blur(8px);
      font-weight: 700;
      box-shadow: 0 1px 0 var(--line);
    }

    th .header-inner {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      min-width: 0;
    }

    .header-name {
      flex: 1;
      min-width: 40px;
      outline: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: text;
    }

    .header-name:focus,
    td[contenteditable="true"]:focus {
      outline: 2px solid rgba(0, 103, 255, 0.28);
      outline-offset: -2px;
      background: #fff;
    }

    .sort-mark {
      color: #000000;
      font-size: 12px;
      min-width: 12px;
      text-align: center;
    }

    .col-menu-btn {
      flex: 0 0 auto;
      width: 22px;
      height: 22px;
      padding: 0;
      border-radius: 5px;
      border: 0;
      background: transparent;
      color: #000000;
      cursor: pointer;
      opacity: 0;
    }

    th:hover .col-menu-btn,
    .col-menu-btn:focus {
      opacity: 1;
    }

    .col-menu-btn:hover {
      background: var(--hover);
      color: var(--text);
    }

    tbody tr:hover td {
      background: #fbfbfa;
    }

    td {
      outline: none;
      cursor: text;
    }


    body.resizing-columns {
      cursor: col-resize !important;
      user-select: none !important;
    }

    th[data-column-id],
    td[data-column-id] {
      position: relative;
    }

    .resize-handle {
      position: absolute;
      top: 0;
      right: -3px;
      z-index: 35;
      width: 7px;
      height: 100%;
      cursor: col-resize;
      background: transparent;
      touch-action: none;
    }

    .resize-handle::after {
      content: "";
      position: absolute;
      top: 5px;
      bottom: 5px;
      left: 3px;
      width: 1px;
      background: transparent;
    }

    th:hover .resize-handle::after,
    body.resizing-columns .resize-handle::after {
      background: #b7b7b3;
    }

    .select-cell {
      padding: 4px 7px;
      cursor: text;
    }


    .multi-select-cell {
      padding: 4px 7px;
      vertical-align: top;
      cursor: text;
    }

    .multi-wrap {
      display: flex;
      flex-direction: column;
      gap: 0;
      width: 100%;
      min-height: 29px;
    }

    .multi-value-row {
      display: block;
      width: 100%;
      min-height: 29px;
      border-radius: 4px;
    }

    .multi-value-text {
      width: 100%;
      min-width: 0;
      padding: 4px 5px;
      color: #000000;
      white-space: normal;
      overflow-wrap: anywhere;
    }

    .multi-entry {
      position: relative;
      width: 100%;
      min-height: 29px;
      display: flex;
      align-items: flex-start;
    }

    td.nav-cell {
      outline: 2px solid #0067ff;
      outline-offset: -2px;
      background: #ffffff !important;
      cursor: default;
    }

    .combo-wrap {
      position: relative;
      width: 100%;
      min-height: 29px;
      display: flex;
      align-items: center;
    }

    .combo-input {
      width: 100%;
      height: 29px;
      padding: 4px 26px 4px 5px;
      border: 1px solid transparent;
      border-radius: 5px;
      outline: none;
      background: transparent;
      color: var(--text);
      font: inherit;
    }

    .combo-input:focus {
      border-color: rgba(0, 103, 255, 0.35);
      background: #fff;
      box-shadow: 0 0 0 1px rgba(0, 103, 255, 0.12);
    }

    .combo-arrow {
      position: absolute;
      right: 3px;
      top: 50%;
      transform: translateY(-50%);
      width: 21px;
      height: 21px;
      padding: 0;
      border: 0;
      border-radius: 4px;
      background: transparent;
      color: #000000;
      cursor: pointer;
      line-height: 21px;
      text-align: center;
    }

    .combo-arrow:hover {
      background: var(--hover);
      color: var(--text);
    }

    .combo-menu {
      position: fixed;
      z-index: 140;
      display: none;
      max-height: min(60vh, 520px);
      overflow-y: auto;
      padding: 5px;
      border: 1px solid var(--line-dark);
      border-radius: 9px;
      background: #fff;
      box-shadow: var(--shadow);
    }

    .combo-menu.show {
      display: block;
    }

    .combo-option-row {
      display: flex;
      align-items: center;
      gap: 4px;
      width: 100%;
      border-radius: 5px;
    }

    .combo-option {
      flex: 1 1 auto;
      min-width: 0;
      min-height: 31px;
      padding: 6px 8px;
      border: 0;
      border-radius: 5px;
      background: transparent;
      color: var(--text);
      text-align: left;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .combo-option:hover,
    .combo-option.active {
      background: var(--hover);
    }

    .combo-delete-option {
      flex: 0 0 28px;
      width: 28px;
      height: 28px;
      padding: 0;
      border: 0;
      border-radius: 5px;
      background: transparent;
      color: #000000;
      cursor: pointer;
      font-size: 17px;
      line-height: 28px;
      text-align: center;
    }

    .combo-delete-option:hover {
      background: #f3f3f1;
    }

    .combo-empty {
      padding: 7px 8px;
      color: var(--muted);
      font-size: 12px;
    }

    .row-number,
    .row-number-head {
      width: 54px !important;
      min-width: 54px !important;
      max-width: 54px !important;
      text-align: center;
      color: #000000;
      user-select: none;
    }

    .row-number {
      cursor: default;
      font-variant-numeric: tabular-nums;
    }

    .row-actions {
      position: sticky;
      right: 0;
      z-index: 8;
      width: 48px !important;
      min-width: 48px !important;
      max-width: 48px !important;
      text-align: center;
      padding: 0;
      background: #fff;
    }

    thead .row-actions {
      z-index: 25;
      background: var(--header);
    }

    tbody tr:hover .row-actions {
      background: #fbfbfa;
    }

    .delete-row {
      border: 0;
      background: transparent;
      color: #000000;
      cursor: pointer;
      width: 28px;
      height: 28px;
      border-radius: 5px;
      font-size: 17px;
      line-height: 1;
    }

    .delete-row:hover {
      color: #c73737;
      background: #fff0f0;
    }

    .new-row {
      width: 100%;
      border: 0;
      border-left: 1px solid var(--line);
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      background: #fff;
      color: var(--muted);
      text-align: left;
      padding: 10px 12px;
      cursor: pointer;
    }

    .new-row:hover {
      background: var(--hover);
      color: var(--text);
    }


    .sync-panel {
      position: fixed;
      z-index: 180;
      top: 74px;
      right: 34px;
      width: min(420px, calc(100vw - 28px));
      padding: 14px;
      border: 1px solid var(--line-dark);
      border-radius: 10px;
      background: #ffffff;
      box-shadow: var(--shadow);
      display: none;
    }

    .sync-panel.show {
      display: block;
    }

    .sync-panel-title {
      margin: 0 0 10px;
      font-weight: 700;
      font-size: 15px;
    }

    .sync-field {
      display: grid;
      grid-template-columns: 78px 1fr;
      gap: 8px;
      align-items: center;
      margin: 8px 0;
    }

    .sync-field label {
      font-weight: 700;
    }

    .sync-field input {
      width: 100%;
      min-width: 0;
      padding: 7px 8px;
      border: 1px solid var(--line-dark);
      border-radius: 6px;
      background: #ffffff;
      color: #000000;
      outline: none;
    }

    .sync-field input:focus {
      border-color: #0067ff;
    }

    .sync-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--line);
    }

    .sync-actions button {
      border: 0;
      border-radius: 6px;
      background: var(--hover);
      color: #000000;
      cursor: pointer;
      padding: 7px 10px;
    }

    .sync-actions button:hover {
      background: #eeeeeb;
    }

    .sync-status {
      margin-top: 9px;
      font-size: 12px;
      line-height: 1.5;
      color: #000000;
    }

    .sync-note {
      margin-top: 8px;
      font-size: 12px;
      line-height: 1.5;
      color: #000000;
    }

    @media (max-width: 760px) {
      .sync-panel {
        top: 68px;
        right: 14px;
        left: 14px;
        width: auto;
      }
    }

    .sort-panel,
    .column-menu {
      position: fixed;
      z-index: 100;
      min-width: 330px;
      padding: 10px;
      border: 1px solid var(--line-dark);
      border-radius: 10px;
      background: #fff;
      box-shadow: var(--shadow);
      display: none;
    }

    .sort-panel.show,
    .column-menu.show {
      display: block;
    }

    .sort-panel {
      top: 78px;
      right: 34px;
    }

    .sort-title {
      font-weight: 600;
      margin-bottom: 8px;
    }

    .sort-rule {
      display: grid;
      grid-template-columns: 1fr 104px 32px;
      gap: 6px;
      margin: 6px 0;
      align-items: center;
    }

    .sort-rule select {
      min-width: 0;
      border: 1px solid var(--line-dark);
      border-radius: 6px;
      background: #fff;
      padding: 6px 8px;
      color: var(--text);
      outline: none;
    }

    .sort-rule button,
    .sort-footer button,
    .column-menu button {
      border: 0;
      border-radius: 6px;
      background: transparent;
      cursor: pointer;
      color: var(--text);
      padding: 7px 8px;
    }

    .sort-rule button:hover,
    .sort-footer button:hover,
    .column-menu button:hover {
      background: var(--hover);
    }

    .sort-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid var(--line);
    }

    .column-menu {
      min-width: 180px;
      padding: 6px;
    }

    .column-menu button {
      width: 100%;
      text-align: left;
    }

    .danger {
      color: #c73737 !important;
    }

    #backToTop {
      position: fixed;
      right: 22px;
      top: 65vh;
      z-index: 90;
      width: 28px;
      height: 28px;
      border: 0;
      border-radius: 50%;
      background: #0067ff;
      color: transparent;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 103, 255, .28);
      opacity: 0;
      pointer-events: none;
      transition: opacity .15s ease, transform .15s ease;
    }

    #backToTop::before,
    #backToTop::after {
      content: "";
      position: absolute;
      top: 10px;
      width: 8px;
      height: 2px;
      background: #fff;
      border-radius: 2px;
    }

    #backToTop::before {
      left: 7px;
      transform: rotate(-45deg);
    }

    #backToTop::after {
      right: 7px;
      transform: rotate(45deg);
    }

    #backToTop.visible {
      opacity: 1;
      pointer-events: auto;
    }

    #backToTop:hover {
      transform: scale(1.08);
    }

    .hint {
      color: var(--muted);
      font-size: 12px;
    }

    @media (max-width: 760px) {
      .page {
        padding: 20px 14px 100px;
      }

      .title {
        font-size: 30px;
      }

      .sort-panel {
        top: 72px;
        right: 14px;
        left: 14px;
        min-width: auto;
      }

      #backToTop {
        right: 12px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <h1 class="title">Music</h1>

    <section class="database" aria-label="Music database">
      <div class="toolbar">
        <div class="toolbar-left">
          <button class="toolbar-btn" id="addRowTop" type="button">＋ 新增行</button>
          <button class="toolbar-btn" id="addColumn" type="button">＋ 新增列</button>
          <button class="sort-btn" id="sortToggle" type="button">⇅ 排序</button>
        </div>
        <div class="toolbar-right">
          <button class="toolbar-btn" id="syncSettings" type="button">GitHub 同步</button>
          <span class="save-state" id="saveState">本地已保存 · GitHub 未连接</span>
        </div>
      </div>

      <div class="table-shell">
        <table id="musicTable">
          <thead id="tableHead"></thead>
          <tbody id="tableBody"></tbody>
        </table>
        <button class="new-row" id="addRowBottom" type="button">＋ 新建</button>
      </div>
    </section>
  </main>


  <div class="sync-panel" id="syncPanel" role="dialog" aria-label="GitHub 同步设置">
    <div class="sync-panel-title">GitHub 同步</div>

    <div class="sync-field">
      <label for="syncOwner">Owner</label>
      <input id="syncOwner" type="text" autocomplete="off" spellcheck="false" />
    </div>

    <div class="sync-field">
      <label for="syncRepo">仓库</label>
      <input id="syncRepo" type="text" autocomplete="off" spellcheck="false" />
    </div>

    <div class="sync-field">
      <label for="syncBranch">分支</label>
      <input id="syncBranch" type="text" value="main" autocomplete="off" spellcheck="false" />
    </div>

    <div class="sync-field">
      <label for="syncToken">Token</label>
      <input id="syncToken" type="password" autocomplete="off" spellcheck="false"
             placeholder="Fine-grained token（Contents: Read and write）" />
    </div>

    <div class="sync-actions">
      <button type="button" id="connectSync">连接并同步</button>
      <button type="button" id="syncNow">立即同步</button>
      <button type="button" id="disconnectSync">断开</button>
    </div>

    <div class="sync-status" id="syncStatus">尚未连接。</div>
    <div class="sync-note">
      访客无需 Token：页面会直接读取已发布的 music-data.json，并自动检查公开更新。
      Token 仅用于编辑者向 GitHub 写入数据。
      Token 只保存在当前浏览器标签页的 sessionStorage 中，不会写入 HTML、JSON 或 localStorage。
      编辑者连接后会先读取 GitHub，再双向合并；页面处于前台时每 15 秒检查一次更新。
      仓库没有 music-data.json 时，首次同步会自动创建。
    </div>
  </div>

  <div class="sort-panel" id="sortPanel" role="dialog" aria-label="排序设置">
    <div class="sort-title">排序标准</div>
    <div class="hint">可添加多条规则，按从上到下的优先级排序。</div>
    <div id="sortRules"></div>
    <div class="sort-footer">
      <button type="button" id="addSortRule">＋ 添加排序</button>
      <button type="button" id="clearSort">清除排序</button>
    </div>
  </div>

  <div class="combo-menu" id="comboMenu" role="listbox" aria-label="下拉选项"></div>

  <div class="column-menu" id="columnMenu">
    <button type="button" id="sortAsc">升序排列</button>
    <button type="button" id="sortDesc">降序排列</button>
    <button type="button" id="renameColumn">重命名</button>
    <button type="button" id="deleteColumn" class="danger">删除该列</button>
  </div>

  <button id="backToTop" type="button" aria-label="回到顶部" title="回到顶部"></button>

  <script>
    (() => {
      const STORAGE_KEY = "music-notion-database-v1";
      const SYNC_CONFIG_KEY = "music-github-sync-config-v1";
      const SYNC_TOKEN_KEY = "music-github-sync-token-v1";
      const SYNC_BASE_KEY = "music-github-sync-base-v2";
      const PUBLIC_CACHE_KEY = "music-public-content-cache-v1";
      const REMOTE_DATA_PATH = "music-data.json";

      const MULTI_IDS = new Set(["artist", "lyricist", "composer"]);
      const MULTI_NAMES = new Set(["歌手", "作词", "作曲"]);
      const SINGLE_SELECT_IDS = new Set(["album"]);
      const SINGLE_SELECT_NAMES = new Set(["专辑"]);

      const defaultState = {
        columns: [
          { id: "title", name: "曲名", width: 240 },
          { id: "artist", name: "歌手", width: 210 },
          { id: "lyricist", name: "作词", width: 210 },
          { id: "composer", name: "作曲", width: 210 },
          { id: "album", name: "专辑", width: 220 },
          { id: "year", name: "年份", width: 120 },
          { id: "rating", name: "评分", width: 120 }
        ],
        rows: [
          {
            id: crypto.randomUUID(),
            cells: {
              title: "示例歌曲",
              artist: ["Artist"],
              lyricist: [],
              composer: [],
              album: "Album",
              year: "2026",
              rating: "9.0"
            }
          },
          {
            id: crypto.randomUUID(),
            cells: {
              title: "", artist: [], lyricist: [], composer: [],
              album: "", year: "", rating: ""
            }
          },
          {
            id: crypto.randomUUID(),
            cells: {
              title: "", artist: [], lyricist: [], composer: [],
              album: "", year: "", rating: ""
            }
          }
        ],
        sortRules: [],
        selectOptions: {
          artist: ["Artist"],
          lyricist: [],
          composer: [],
          album: ["Album"]
        }
      };

      let state = null;
      let activeColumnId = null;
      let saveTimer = null;
      let comboContext = null;
      let navCell = null;
      let remoteSyncTimer = null;
      let syncInFlight = false;
      let syncQueued = false;
      let lastRemoteSha = null;
      let pendingOptionDeletes = {};
      let remotePollTimer = null;
      let publicContentLoaded = false;
      let activeSyncConfig = null;
      let memorySyncToken = "";

      const tableHead = document.getElementById("tableHead");
      const tableBody = document.getElementById("tableBody");
      const saveState = document.getElementById("saveState");
      const sortPanel = document.getElementById("sortPanel");
      const sortRules = document.getElementById("sortRules");
      const sortToggle = document.getElementById("sortToggle");
      const columnMenu = document.getElementById("columnMenu");
      const comboMenu = document.getElementById("comboMenu");
      const syncPanel = document.getElementById("syncPanel");
      const syncStatus = document.getElementById("syncStatus");
      const syncOwner = document.getElementById("syncOwner");
      const syncRepo = document.getElementById("syncRepo");
      const syncBranch = document.getElementById("syncBranch");
      const syncToken = document.getElementById("syncToken");

      function cloneDefault() {
        return JSON.parse(JSON.stringify(defaultState));
      }

      function clone(value) {
        if (value === undefined) return undefined;
        return JSON.parse(JSON.stringify(value));
      }

      function stableStringify(value) {
        if (Array.isArray(value)) {
          return `[${value.map(stableStringify).join(",")}]`;
        }

        if (value && typeof value === "object") {
          return `{${Object.keys(value).sort().map(key =>
            `${JSON.stringify(key)}:${stableStringify(value[key])}`
          ).join(",")}}`;
        }

        return JSON.stringify(value);
      }

      function sameValue(left, right) {
        return stableStringify(left) === stableStringify(right);
      }

      function stateForComparison(value) {
        const copy = clone(value || {});
        delete copy.meta;
        return copy;
      }

      function sameState(left, right) {
        return sameValue(stateForComparison(left), stateForComparison(right));
      }

      function safeSetLocalStorage(key, value) {
        try {
          localStorage.setItem(key, value);
          return true;
        } catch {
          return false;
        }
      }

      function withTimeout(promise, milliseconds = 8000) {
        let timer = null;
        const timeout = new Promise((_, reject) => {
          timer = setTimeout(() => reject(new Error("读取公开内容超时")), milliseconds);
        });

        return Promise.race([promise, timeout]).finally(() => clearTimeout(timer));
      }

      function normalizeMultiValue(value) {
        if (Array.isArray(value)) {
          return uniqueValues(value);
        }

        const clean = String(value ?? "").trim();
        if (!clean) return [];

        return uniqueValues(
          clean
            .split(/\r?\n|、|；|;/)
            .map(item => item.trim())
            .filter(Boolean)
        );
      }

      function uniqueValues(values) {
        const output = [];
        values.forEach(value => {
          const clean = String(value ?? "").trim();
          if (!clean) return;

          const exists = output.some(item =>
            String(item).localeCompare(clean, "zh-CN", { sensitivity: "base" }) === 0
          );

          if (!exists) output.push(clean);
        });
        return output;
      }

      function ensureColumn(parsed, id, name, width, beforeId = null, afterId = null) {
        if (parsed.columns.some(col => col.id === id || col.name === name)) return;

        let index = parsed.columns.length;

        if (beforeId) {
          const beforeIndex = parsed.columns.findIndex(col => col.id === beforeId);
          if (beforeIndex >= 0) index = beforeIndex;
        } else if (afterId) {
          const afterIndex = parsed.columns.findIndex(col => col.id === afterId);
          if (afterIndex >= 0) index = afterIndex + 1;
        }

        parsed.columns.splice(index, 0, { id, name, width });
        parsed.rows.forEach(row => {
          row.cells = row.cells || {};
          row.cells[id] = MULTI_IDS.has(id) ? [] : "";
        });
      }

      function migrateState(parsed) {
        parsed.sortRules = Array.isArray(parsed.sortRules) ? parsed.sortRules : [];
        parsed.selectOptions =
          parsed.selectOptions && typeof parsed.selectOptions === "object"
            ? parsed.selectOptions
            : {};

        parsed.columns = parsed.columns.filter(col => col.id !== "website");
        parsed.rows.forEach(row => {
          row.cells = row.cells || {};
          delete row.cells.website;
        });
        parsed.sortRules = parsed.sortRules.filter(rule => rule.columnId !== "website");
        delete parsed.selectOptions.website;

        ensureColumn(parsed, "lyricist", "作词", 210, "album");
        ensureColumn(parsed, "composer", "作曲", 210, "album");

        // 强制“作词、作曲”位于“专辑”左侧，并保持顺序为：歌手、作词、作曲、专辑。
        const byId = id => parsed.columns.find(col => col.id === id);
        const lyricist = byId("lyricist");
        const composer = byId("composer");
        const albumIndex = parsed.columns.findIndex(col => col.id === "album");

        if (albumIndex >= 0 && lyricist && composer) {
          parsed.columns = parsed.columns.filter(
            col => col.id !== "lyricist" && col.id !== "composer"
          );
          const newAlbumIndex = parsed.columns.findIndex(col => col.id === "album");
          parsed.columns.splice(newAlbumIndex, 0, lyricist, composer);
        }

        parsed.rows.forEach(row => {
          row.cells = row.cells || {};
          row.cells.artist = normalizeMultiValue(row.cells.artist);
          row.cells.lyricist = normalizeMultiValue(row.cells.lyricist);
          row.cells.composer = normalizeMultiValue(row.cells.composer);

          if (Array.isArray(row.cells.album)) {
            row.cells.album = row.cells.album[0] ?? "";
          }
        });

        ["artist", "lyricist", "composer", "album"].forEach(id => {
          if (!Array.isArray(parsed.selectOptions[id])) {
            const values = [];
            parsed.rows.forEach(row => {
              const cellValue = row.cells?.[id];
              const cellValues = MULTI_IDS.has(id)
                ? normalizeMultiValue(cellValue)
                : [String(cellValue ?? "").trim()].filter(Boolean);

              cellValues.forEach(value => {
                if (!values.some(item =>
                  item.localeCompare(value, "zh-CN", { sensitivity: "base" }) === 0
                )) {
                  values.push(value);
                }
              });
            });

            parsed.selectOptions[id] = values.sort((a, b) =>
              a.localeCompare(b, "zh-CN", { numeric: true, sensitivity: "base" })
            );
          }
        });

        return parsed;
      }

      function readStoredState(key) {
        try {
          const raw = localStorage.getItem(key);

          if (raw) {
            const parsed = JSON.parse(raw);
            if (Array.isArray(parsed.columns) && Array.isArray(parsed.rows)) {
              return migrateState(parsed);
            }
          }
        } catch {
          // 缓存损坏时忽略，继续尝试其他数据源。
        }

        return null;
      }

      async function fetchPublishedFile() {
        const url = new URL(REMOTE_DATA_PATH, document.baseURI);
        url.searchParams.set("t", Date.now());

        const response = await withTimeout(
          fetch(url.href, { cache: "no-store" })
        );
        if (!response.ok) return null;

        const parsed = await response.json();
        if (!Array.isArray(parsed.columns) || !Array.isArray(parsed.rows)) {
          return null;
        }

        return {
          sha: response.headers.get("etag") || null,
          state: migrateState(parsed),
          source: "published"
        };
      }

      async function fetchPublicContent(includeGitHub = true) {
        const published = await fetchPublishedFile().catch(() => null);
        if (published?.state) return published;

        const inferred = inferGitHubConfig();

        // 发布文件不可用时，GitHub Pages 可匿名读取公开仓库 API 作为备用。
        if (includeGitHub && inferred.owner && inferred.repo) {
          const githubResult = await withTimeout(fetchRemoteFile(inferred)).catch(() => null);
          return githubResult ? { ...githubResult, source: "github" } : null;
        }

        return null;
      }

      async function loadState() {
        const localState = readStoredState(STORAGE_KEY);
        const cachedPublicState = readStoredState(PUBLIC_CACHE_KEY);
        const publicResult = await fetchPublicContent();

        if (publicResult?.state) {
          const publicState = migrateState(clone(publicResult.state));
          safeSetLocalStorage(PUBLIC_CACHE_KEY, JSON.stringify(publicState));
          publicContentLoaded = true;

          // 访客始终从公开数据开始，不能被本机旧 localStorage 挡住。
          if (!getSyncToken()) {
            safeSetLocalStorage(STORAGE_KEY, JSON.stringify(publicState));
            return publicState;
          }

          // 编辑者若没有未同步修改，也直接使用较新的公开数据。
          const syncBase = loadSyncBase(getSyncConfig());
          if (!localState || (syncBase?.state && sameState(localState, syncBase.state))) {
            return publicState;
          }
        }

        if (localState) return localState;

        if (cachedPublicState) {
          publicContentLoaded = true;
          return cachedPublicState;
        }

        return cloneDefault();
      }

      function insertPlainTextAtCursor(text) {
        const selection = window.getSelection();
        if (!selection || !selection.rangeCount) return;

        const range = selection.getRangeAt(0);
        range.deleteContents();

        const normalized = String(text ?? "")
          .replace(/\r\n?/g, "\n")
          .replace(/\n+/g, " ");

        const node = document.createTextNode(normalized);
        range.insertNode(node);
        range.setStartAfter(node);
        range.collapse(true);

        selection.removeAllRanges();
        selection.addRange(range);
      }

      function handlePlainTextPaste(event) {
        const target = event.currentTarget;
        if (!target?.isContentEditable) return;

        event.preventDefault();

        const clipboard = event.clipboardData || window.clipboardData;
        const plainText = clipboard?.getData("text/plain") ?? "";

        insertPlainTextAtCursor(plainText);

        target.dispatchEvent(new InputEvent("input", {
          bubbles: true,
          inputType: "insertText",
          data: plainText
        }));
      }

      function inferGitHubConfig() {
        const hostname = window.location.hostname;
        const parts = window.location.pathname.split("/").filter(Boolean);

        if (!hostname.endsWith(".github.io")) {
          return { owner: "", repo: "", branch: "main" };
        }

        const owner = hostname.split(".")[0];
        const repo = parts[0] || `${owner}.github.io`;

        return { owner, repo, branch: "main" };
      }

      function getSyncConfig() {
        const inferred = inferGitHubConfig();

        if (activeSyncConfig) return { ...activeSyncConfig };

        try {
          const saved = JSON.parse(localStorage.getItem(SYNC_CONFIG_KEY) || "{}");
          return {
            owner: saved.owner || inferred.owner || "",
            repo: saved.repo || inferred.repo || "",
            branch: saved.branch || "main"
          };
        } catch {
          return inferred;
        }
      }

      function getSyncToken() {
        try {
          return sessionStorage.getItem(SYNC_TOKEN_KEY) || memorySyncToken;
        } catch {
          return memorySyncToken;
        }
      }

      function saveSyncConfig(config, token) {
        activeSyncConfig = {
          owner: config.owner,
          repo: config.repo,
          branch: config.branch || "main"
        };

        safeSetLocalStorage(
          SYNC_CONFIG_KEY,
          JSON.stringify(activeSyncConfig)
        );

        if (token) {
          memorySyncToken = token;
          try { sessionStorage.setItem(SYNC_TOKEN_KEY, token); } catch {}
        } else {
          memorySyncToken = "";
          try { sessionStorage.removeItem(SYNC_TOKEN_KEY); } catch {}
        }
      }

      function syncTargetKey(config) {
        return [config.owner, config.repo, config.branch || "main", REMOTE_DATA_PATH]
          .map(value => String(value || "").trim().toLowerCase())
          .join("/");
      }

      function loadSyncBase(config) {
        try {
          const all = JSON.parse(localStorage.getItem(SYNC_BASE_KEY) || "{}");
          const saved = all[syncTargetKey(config)];
          return saved?.state ? saved : null;
        } catch {
          return null;
        }
      }

      function saveSyncBase(config, syncedState, sha) {
        let all = {};

        try {
          all = JSON.parse(localStorage.getItem(SYNC_BASE_KEY) || "{}");
        } catch {
          all = {};
        }

        all[syncTargetKey(config)] = {
          sha: sha || null,
          state: clone(syncedState),
          savedAt: new Date().toISOString()
        };

        safeSetLocalStorage(SYNC_BASE_KEY, JSON.stringify(all));
      }

      function markStateEdited() {
        state.meta = {
          ...(state.meta || {}),
          updatedAt: new Date().toISOString(),
          source: "Music Web"
        };
      }

      function populateSyncPanel() {
        const config = getSyncConfig();
        syncOwner.value = config.owner || "";
        syncRepo.value = config.repo || "";
        syncBranch.value = config.branch || "main";
        syncToken.value = getSyncToken();
      }

      function setSyncStatus(message) {
        syncStatus.textContent = message;
      }

      function updateSaveState(remoteText = null) {
        if (remoteText) {
          saveState.textContent = remoteText;
          return;
        }

        saveState.textContent = getSyncToken()
          ? "本地已保存 · 等待 GitHub 同步"
          : "本地已保存 · GitHub 未连接";
      }

      function utf8ToBase64(value) {
        const bytes = new TextEncoder().encode(value);
        let binary = "";

        for (let i = 0; i < bytes.length; i++) {
          binary += String.fromCharCode(bytes[i]);
        }

        return btoa(binary);
      }

      function base64ToUtf8(value) {
        const binary = atob(String(value).replace(/\n/g, ""));
        const bytes = Uint8Array.from(binary, char => char.charCodeAt(0));
        return new TextDecoder().decode(bytes);
      }

      async function githubRequest(url, options = {}) {
        const token = getSyncToken();
        const headers = {
          "Accept": "application/vnd.github+json",
          "X-GitHub-Api-Version": "2022-11-28",
          ...(options.headers || {})
        };

        if (token) {
          headers.Authorization = `Bearer ${token}`;
        }

        return fetch(url, {
          ...options,
          headers
        });
      }

      function githubContentsUrl(config) {
        const owner = encodeURIComponent(config.owner);
        const repo = encodeURIComponent(config.repo);
        const path = REMOTE_DATA_PATH
          .split("/")
          .map(encodeURIComponent)
          .join("/");

        return `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;
      }

      async function fetchRemoteFile(config) {
        const url =
          `${githubContentsUrl(config)}?ref=${encodeURIComponent(config.branch || "main")}`;

        const response = await githubRequest(url, {
          method: "GET",
          cache: "no-store"
        });

        if (response.status === 404) {
          return null;
        }

        if (!response.ok) {
          const detail = await response.text();
          throw new Error(`GitHub 读取失败（${response.status}）${detail ? "：" + detail.slice(0, 180) : ""}`);
        }

        const payload = await response.json();
        let parsed = null;

        if (payload.content) {
          parsed = JSON.parse(base64ToUtf8(payload.content));
        }

        return {
          sha: payload.sha || null,
          state: parsed
        };
      }

      function mergeUniqueStrings(...groups) {
        const output = [];

        groups.flat().forEach(value => {
          const clean = String(value ?? "").trim();
          if (!clean) return;

          if (!output.some(item =>
            item.localeCompare(clean, "zh-CN", { sensitivity: "base" }) === 0
          )) {
            output.push(clean);
          }
        });

        return output.sort((a, b) =>
          a.localeCompare(b, "zh-CN", {
            numeric: true,
            sensitivity: "base"
          })
        );
      }

      function getPendingDeletes(columnId) {
        return Array.isArray(pendingOptionDeletes[columnId])
          ? pendingOptionDeletes[columnId]
          : [];
      }

      function mergeRemoteOptionsIntoLocal(remoteState) {
        if (!remoteState?.selectOptions) return;

        state.selectOptions = state.selectOptions || {};

        const keys = new Set([
          ...Object.keys(remoteState.selectOptions || {}),
          ...Object.keys(state.selectOptions || {})
        ]);

        keys.forEach(columnId => {
          const deleted = getPendingDeletes(columnId);

          state.selectOptions[columnId] = mergeUniqueStrings(
            remoteState.selectOptions?.[columnId] || [],
            state.selectOptions?.[columnId] || []
          ).filter(value =>
            !deleted.some(item =>
              item.localeCompare(value, "zh-CN", { sensitivity: "base" }) === 0
            )
          );
        });
      }

      function resolveThreeWay(baseValue, localValue, remoteValue, onConflict) {
        if (sameValue(localValue, remoteValue)) return clone(localValue);
        if (sameValue(localValue, baseValue)) return clone(remoteValue);
        if (sameValue(remoteValue, baseValue)) return clone(localValue);
        onConflict();
        return clone(localValue);
      }

      function mergeObjectFields(baseObject, localObject, remoteObject, onConflict) {
        const output = {};
        const keys = new Set([
          ...Object.keys(baseObject || {}),
          ...Object.keys(localObject || {}),
          ...Object.keys(remoteObject || {})
        ]);

        keys.forEach(key => {
          output[key] = resolveThreeWay(
            baseObject?.[key],
            localObject?.[key],
            remoteObject?.[key],
            onConflict
          );
        });

        return output;
      }

      function mergeRecordsById(baseItems, localItems, remoteItems, mergeItem, onConflict) {
        const baseMap = new Map((baseItems || []).map(item => [item.id, item]));
        const localMap = new Map((localItems || []).map(item => [item.id, item]));
        const remoteMap = new Map((remoteItems || []).map(item => [item.id, item]));
        const order = [];

        [...(remoteItems || []), ...(localItems || [])].forEach(item => {
          if (item?.id && !order.includes(item.id)) order.push(item.id);
        });

        return order.flatMap(id => {
          const baseItem = baseMap.get(id);
          const localItem = localMap.get(id);
          const remoteItem = remoteMap.get(id);

          if (!localItem && !remoteItem) return [];
          if (!baseItem) {
            if (localItem && remoteItem) {
              return [mergeItem(undefined, localItem, remoteItem, onConflict)];
            }
            return [clone(localItem || remoteItem)];
          }

          if (!localItem) {
            if (sameValue(remoteItem, baseItem)) return [];
            onConflict();
            return [clone(remoteItem)];
          }

          if (!remoteItem) {
            if (sameValue(localItem, baseItem)) return [];
            onConflict();
            return [clone(localItem)];
          }

          return [mergeItem(baseItem, localItem, remoteItem, onConflict)];
        });
      }

      function mergeStates(baseState, localState, remoteState) {
        let conflicts = 0;
        const onConflict = () => { conflicts += 1; };
        const base = baseState || { columns: [], rows: [], sortRules: [], selectOptions: {} };

        const columns = mergeRecordsById(
          base.columns,
          localState.columns,
          remoteState.columns,
          (baseItem, localItem, remoteItem) => mergeObjectFields(
            baseItem,
            localItem,
            remoteItem,
            onConflict
          ),
          onConflict
        );

        const rows = mergeRecordsById(
          base.rows,
          localState.rows,
          remoteState.rows,
          (baseItem, localItem, remoteItem) => ({
            id: localItem.id,
            cells: mergeObjectFields(
              baseItem?.cells,
              localItem.cells,
              remoteItem.cells,
              onConflict
            )
          }),
          onConflict
        );

        const selectOptions = {};
        const optionKeys = new Set([
          ...Object.keys(base.selectOptions || {}),
          ...Object.keys(localState.selectOptions || {}),
          ...Object.keys(remoteState.selectOptions || {})
        ]);

        optionKeys.forEach(columnId => {
          const baseOptions = base.selectOptions?.[columnId] || [];
          const localOptions = localState.selectOptions?.[columnId] || [];
          const remoteOptions = remoteState.selectOptions?.[columnId] || [];

          if (sameValue(localOptions, baseOptions)) {
            selectOptions[columnId] = clone(remoteOptions);
          } else if (sameValue(remoteOptions, baseOptions)) {
            selectOptions[columnId] = clone(localOptions);
          } else {
            const deleted = getPendingDeletes(columnId);
            selectOptions[columnId] = mergeUniqueStrings(localOptions, remoteOptions)
              .filter(value => !deleted.some(item =>
                item.localeCompare(value, "zh-CN", { sensitivity: "base" }) === 0
              ));
          }
        });

        const sortRules = resolveThreeWay(
          base.sortRules || [],
          localState.sortRules || [],
          remoteState.sortRules || [],
          onConflict
        );

        const merged = migrateState({
          columns,
          rows,
          sortRules,
          selectOptions,
          meta: {
            updatedAt: new Date().toISOString(),
            source: "Music GitHub Sync"
          }
        });

        return { state: merged, conflicts };
      }

      async function putRemoteFile(config, currentSha = null) {
        const payloadState = JSON.parse(JSON.stringify(state));
        payloadState.meta = {
          ...(payloadState.meta || {}),
          updatedAt: new Date().toISOString(),
          source: "Music GitHub Sync"
        };

        const body = {
          message: currentSha
            ? "Update Music database"
            : "Create Music database",
          content: utf8ToBase64(JSON.stringify(payloadState, null, 2)),
          branch: config.branch || "main"
        };

        if (currentSha) body.sha = currentSha;

        const response = await githubRequest(githubContentsUrl(config), {
          method: "PUT",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(body)
        });

        if (!response.ok) {
          const detail = await response.text();
          const error = new Error(`GitHub 写入失败（${response.status}）${detail ? "：" + detail.slice(0, 180) : ""}`);
          error.status = response.status;
          throw error;
        }

        const payload = await response.json();
        return {
          sha: payload.content?.sha || payload.commit?.sha || null,
          uploadedState: payloadState
        };
      }

      async function syncToGitHub(manual = false) {
        const config = getSyncConfig();
        const token = getSyncToken();

        if (!config.owner || !config.repo || !config.branch) {
          if (manual) setSyncStatus("请填写 Owner、仓库和分支。");
          return false;
        }

        if (!token) {
          if (manual) setSyncStatus("请填写具有 Contents: Read and write 权限的 GitHub Token。");
          updateSaveState();
          return false;
        }

        if (syncInFlight) {
          syncQueued = true;
          return false;
        }

        syncInFlight = true;
        syncQueued = false;
        updateSaveState("正在同步 GitHub…");
        setSyncStatus("正在读取仓库中的最新数据…");

        try {
          for (let attempt = 0; attempt < 3; attempt += 1) {
            const remote = await fetchRemoteFile(config);
            const syncBase = loadSyncBase(config);
            const localSnapshot = migrateState(clone(state));
            let nextState = localSnapshot;
            let conflicts = 0;
            let needsUpload = !remote;

            if (remote?.state) {
              const remoteState = migrateState(clone(remote.state));

              if (syncBase?.state) {
                const localChanged = !sameState(localSnapshot, syncBase.state);
                const remoteChanged = !sameState(remoteState, syncBase.state);

                if (!localChanged) {
                  nextState = remoteState;
                  needsUpload = false;
                } else if (!remoteChanged) {
                  nextState = localSnapshot;
                  needsUpload = true;
                } else {
                  const merged = mergeStates(syncBase.state, localSnapshot, remoteState);
                  nextState = merged.state;
                  conflicts = merged.conflicts;
                  needsUpload = !sameState(nextState, remoteState);
                }
              } else {
                const localTime = Date.parse(localSnapshot.meta?.updatedAt || "") || 0;
                const remoteTime = Date.parse(remoteState.meta?.updatedAt || "") || 0;

                if (!localTime || remoteTime >= localTime) {
                  nextState = remoteState;
                  needsUpload = false;
                } else {
                  const merged = mergeStates(null, localSnapshot, remoteState);
                  nextState = merged.state;
                  conflicts = merged.conflicts;
                  needsUpload = true;
                }
              }
            }

            try {
              let syncedSha = remote?.sha || null;
              let syncedState = nextState;

              if (needsUpload) {
                state = nextState;
                const result = await putRemoteFile(config, remote?.sha || null);
                syncedSha = result.sha;
                syncedState = result.uploadedState;
              }

              state = migrateState(clone(syncedState));
              lastRemoteSha = syncedSha;
              pendingOptionDeletes = {};
              safeSetLocalStorage(STORAGE_KEY, JSON.stringify(state));
              saveSyncBase(config, state, syncedSha);
              render(false);
              updateSaveState("本地已保存 · GitHub 已同步");
              setSyncStatus(
                `${needsUpload ? "已双向合并并同步" : "已载入 GitHub 最新数据"}` +
                `${conflicts ? `（${conflicts} 处同时修改以本机为准）` : ""}：` +
                `${config.owner}/${config.repo}@${config.branch}/${REMOTE_DATA_PATH}`
              );
              startRemotePolling();
              return true;
            } catch (error) {
              if (error?.status === 409 && attempt < 2) continue;
              throw error;
            }
          }

          throw new Error("远端文件持续变化，请稍后再次同步。");
        } catch (error) {
          updateSaveState("本地已保存 · GitHub 同步失败");
          setSyncStatus(error?.message || "GitHub 同步失败。");
          return false;
        } finally {
          syncInFlight = false;

          if (syncQueued) {
            syncQueued = false;
            scheduleRemoteSync(200);
          }
        }
      }

      function scheduleRemoteSync(delay = 1200) {
        clearTimeout(remoteSyncTimer);

        if (!getSyncToken()) return;

        remoteSyncTimer = setTimeout(() => {
          remoteSyncTimer = null;
          syncToGitHub(false);
        }, delay);
      }

      function startRemotePolling() {
        clearInterval(remotePollTimer);
        remotePollTimer = null;
        const interval = getSyncToken() ? 15000 : 30000;

        remotePollTimer = setInterval(() => {
          if (document.visibilityState === "visible") {
            pullFromGitHubIfClean();
          }
        }, interval);
      }

      async function pullFromGitHubIfClean() {
        if (syncInFlight || remoteSyncTimer) return;

        if (!getSyncToken()) {
          try {
            // 轮询只请求同源发布文件，避免匿名 GitHub API 的速率限制。
            const publicResult = await fetchPublicContent(false);
            if (!publicResult?.state || sameState(state, publicResult.state)) return;

            state = migrateState(clone(publicResult.state));
            publicContentLoaded = true;
            safeSetLocalStorage(PUBLIC_CACHE_KEY, JSON.stringify(state));
            safeSetLocalStorage(STORAGE_KEY, JSON.stringify(state));
            render(false);
            updateSaveState("已载入公开内容 · 无需 Token");
            setSyncStatus("访客模式：已载入网站公开数据。");
          } catch {
            // 公开内容暂时不可用时保留当前显示，不阻断访问。
          }
          return;
        }

        const config = getSyncConfig();
        if (!config.owner || !config.repo) return;

        try {
          const remote = await fetchRemoteFile(config);
          if (!remote?.state || !remote.sha || remote.sha === lastRemoteSha) return;

          const syncBase = loadSyncBase(config);
          const localChanged = syncBase?.state && !sameState(state, syncBase.state);

          if (localChanged) {
            await syncToGitHub(false);
            return;
          }

          state = migrateState(clone(remote.state));
          lastRemoteSha = remote.sha;
          safeSetLocalStorage(STORAGE_KEY, JSON.stringify(state));
          saveSyncBase(config, state, remote.sha);
          render(false);
          updateSaveState("已从 GitHub 更新");
          setSyncStatus("检测到仓库更新，已载入最新数据。");
        } catch {
          // 自动拉取失败时保持当前本地数据，不打断编辑。
        }
      }

      function scheduleSave() {
        saveState.textContent = "保存中…";
        clearTimeout(saveTimer);
        markStateEdited();

        saveTimer = setTimeout(() => {
          safeSetLocalStorage(STORAGE_KEY, JSON.stringify(state));
          updateSaveState();
          scheduleRemoteSync();
        }, 180);
      }

      function makeColumnId() {
        return "col_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 7);
      }

      function isMultiColumn(col) {
        return MULTI_IDS.has(col.id) || MULTI_NAMES.has((col.name || "").trim());
      }

      function isSingleSelectColumn(col) {
        return SINGLE_SELECT_IDS.has(col.id) ||
          SINGLE_SELECT_NAMES.has((col.name || "").trim());
      }

      function isSelectColumn(col) {
        return isMultiColumn(col) || isSingleSelectColumn(col);
      }

      function getDefaultWidth(col) {
        if (col.id === "title") return 240;
        if (col.id === "year" || col.id === "rating") return 120;
        return 210;
      }

      function normalizeState() {
        state.selectOptions =
          state.selectOptions && typeof state.selectOptions === "object"
            ? state.selectOptions
            : {};

        const validIds = new Set(state.columns.map(col => col.id));

        state.columns.forEach(col => {
          const width = Number(col.width);
          col.width = Number.isFinite(width)
            ? Math.max(80, Math.round(width))
            : getDefaultWidth(col);

          if (isSelectColumn(col) && !Array.isArray(state.selectOptions[col.id])) {
            state.selectOptions[col.id] = [];
          }
        });

        state.rows.forEach(row => {
          row.cells = row.cells || {};

          state.columns.forEach(col => {
            if (!(col.id in row.cells)) {
              row.cells[col.id] = isMultiColumn(col) ? [] : "";
            }

            if (isMultiColumn(col)) {
              row.cells[col.id] = normalizeMultiValue(row.cells[col.id]);
            } else if (Array.isArray(row.cells[col.id])) {
              row.cells[col.id] = row.cells[col.id][0] ?? "";
            }
          });

          Object.keys(row.cells).forEach(id => {
            if (!validIds.has(id)) delete row.cells[id];
          });
        });

        state.sortRules = state.sortRules.filter(rule => validIds.has(rule.columnId));
      }

      function render(persist = true) {
        normalizeState();
        closeCombo();
        renderHead();
        renderBody();
        renderSortRules();
        updateSortButton();
        if (persist) scheduleSave();
      }

      function setCellWidth(el, col) {
        const width = Math.max(80, Number(col.width) || 210);
        el.style.width = width + "px";
        el.style.minWidth = width + "px";
        el.style.maxWidth = width + "px";
      }

      function updateColumnWidth(col) {
        document
          .querySelectorAll(`[data-column-id="${CSS.escape(col.id)}"]`)
          .forEach(el => setCellWidth(el, col));
      }

      function beginColumnResize(event, col, th) {
        event.preventDefault();
        event.stopPropagation();

        const startX = event.clientX;
        const startWidth = th.getBoundingClientRect().width;
        document.body.classList.add("resizing-columns");

        const onMove = moveEvent => {
          col.width = Math.max(
            80,
            Math.round(startWidth + moveEvent.clientX - startX)
          );
          updateColumnWidth(col);
        };

        const onUp = () => {
          document.body.classList.remove("resizing-columns");
          document.removeEventListener("mousemove", onMove);
          document.removeEventListener("mouseup", onUp);
          scheduleSave();
        };

        document.addEventListener("mousemove", onMove);
        document.addEventListener("mouseup", onUp);
      }

      function renderHead() {
        const tr = document.createElement("tr");

        const numberHead = document.createElement("th");
        numberHead.className = "row-number-head";
        numberHead.textContent = "#";
        tr.appendChild(numberHead);

        state.columns.forEach(col => {
          const th = document.createElement("th");
          th.dataset.columnId = col.id;
          setCellWidth(th, col);

          const wrap = document.createElement("div");
          wrap.className = "header-inner";

          const name = document.createElement("div");
          name.className = "header-name";
          name.contentEditable = "true";
          name.spellcheck = false;
          name.textContent = col.name;
          name.title = "点击编辑列名";

          name.addEventListener("paste", handlePlainTextPaste);

          name.addEventListener("input", () => {
            col.name = name.textContent.trim() || "未命名";

            if (isSelectColumn(col) && !Array.isArray(state.selectOptions[col.id])) {
              state.selectOptions[col.id] = [];
            }

            renderSortRules();
            scheduleSave();
          });

          name.addEventListener("keydown", event => {
            if (event.key === "Enter") {
              event.preventDefault();
              name.blur();
            }
          });

          name.addEventListener("blur", () => {
            if (!name.textContent.trim()) {
              name.textContent = "未命名";
              col.name = "未命名";
            }
            renderSortRules();
            scheduleSave();
          });

          const mark = document.createElement("span");
          mark.className = "sort-mark";

          const sortIndex = state.sortRules.findIndex(rule => rule.columnId === col.id);
          if (sortIndex !== -1) {
            const rule = state.sortRules[sortIndex];
            mark.textContent = rule.direction === "asc" ? "↑" : "↓";
          }

          const menu = document.createElement("button");
          menu.className = "col-menu-btn";
          menu.type = "button";
          menu.textContent = "•••";
          menu.title = "列选项";

          menu.addEventListener("click", event => {
            event.stopPropagation();
            activeColumnId = col.id;
            openColumnMenu(menu);
          });

          const resize = document.createElement("div");
          resize.className = "resize-handle";
          resize.title = "拖动调整列宽";
          resize.addEventListener("mousedown", event =>
            beginColumnResize(event, col, th)
          );

          wrap.append(name, mark, menu);
          th.append(wrap, resize);
          tr.appendChild(th);
        });

        const actionHead = document.createElement("th");
        actionHead.className = "row-actions";
        tr.appendChild(actionHead);

        tableHead.replaceChildren(tr);
      }

      function handleTabAtEnd(event, tr, editor) {
        if (event.key !== "Tab" || event.shiftKey) return false;

        const editors = Array.from(
          tr.querySelectorAll('[data-cell-editor="true"]')
        );

        if (editor !== editors[editors.length - 1]) return false;

        event.preventDefault();
        const newRow = addRow(false);
        render();

        requestAnimationFrame(() => focusFirstEditor(newRow.id));
        return true;
      }

      function focusFirstEditor(rowId) {
        const tr = document.querySelector(
          `tr[data-row-id="${CSS.escape(rowId)}"]`
        );
        const editor = tr?.querySelector('[data-cell-editor="true"]');

        if (!editor) return;

        clearNavigationMode();
        editor.focus();

        if (editor.isContentEditable) {
          placeCaretAtEnd(editor);
        }
      }

      function placeCaretAtEnd(el) {
        const range = document.createRange();
        range.selectNodeContents(el);
        range.collapse(false);

        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
      }

      function clearNavigationMode() {
        if (!navCell) return;

        if (navCell.dataset.editorKind === "text") {
          navCell.contentEditable = "true";
        }

        navCell.classList.remove("nav-cell");
        navCell = null;
      }

      function enterNavigationMode(td) {
        if (!td) return;

        closeCombo();

        if (navCell && navCell !== td) {
          clearNavigationMode();
        }

        navCell = td;
        td.classList.add("nav-cell");
        td.tabIndex = 0;

        if (td.dataset.editorKind === "text") {
          td.contentEditable = "false";
        } else {
          const input = td.querySelector(".combo-input");
          if (input && document.activeElement === input) input.blur();
        }

        td.focus({ preventScroll: true });
        td.scrollIntoView({ block: "nearest", inline: "nearest" });
      }

      function moveNavigationCell(td, key) {
        const rows = Array.from(
          tableBody.querySelectorAll("tr[data-row-id]")
        );
        const tr = td.closest("tr[data-row-id]");

        if (!tr) return;

        const rowIndex = rows.indexOf(tr);
        const colIndex = state.columns.findIndex(
          col => col.id === td.dataset.columnId
        );

        if (rowIndex < 0 || colIndex < 0) return;

        let nextRow = rowIndex;
        let nextCol = colIndex;

        if (key === "ArrowUp") nextRow--;
        if (key === "ArrowDown") nextRow++;
        if (key === "ArrowLeft") nextCol--;
        if (key === "ArrowRight") nextCol++;

        nextRow = Math.max(0, Math.min(rows.length - 1, nextRow));
        nextCol = Math.max(0, Math.min(state.columns.length - 1, nextCol));

        const nextColumnId = state.columns[nextCol].id;
        const target = rows[nextRow].querySelector(
          `td[data-column-id="${CSS.escape(nextColumnId)}"]`
        );

        if (target) enterNavigationMode(target);
      }

      function renderBody() {
        const rows = getSortedRows();
        const fragment = document.createDocumentFragment();

        rows.forEach((row, visibleIndex) => {
          const tr = document.createElement("tr");
          tr.dataset.rowId = row.id;

          const num = document.createElement("td");
          num.className = "row-number";
          num.textContent = String(visibleIndex + 1);
          tr.appendChild(num);

          state.columns.forEach(col => {
            const td = document.createElement("td");
            td.dataset.columnId = col.id;
            td.tabIndex = -1;
            setCellWidth(td, col);

            if (isMultiColumn(col)) {
              renderMultiCell(td, tr, row, col);
            } else if (isSingleSelectColumn(col)) {
              renderSingleSelectCell(td, tr, row, col);
            } else {
              renderTextCell(td, tr, row, col);
            }

            tr.appendChild(td);
          });

          const actions = document.createElement("td");
          actions.className = "row-actions";

          const del = document.createElement("button");
          del.type = "button";
          del.className = "delete-row";
          del.title = "删除本行";
          del.textContent = "×";

          del.addEventListener("click", () => {
            state.rows = state.rows.filter(item => item.id !== row.id);
            render();
          });

          actions.appendChild(del);
          tr.appendChild(actions);
          fragment.appendChild(tr);
        });

        tableBody.replaceChildren(fragment);
      }

      function renderTextCell(td, tr, row, col) {
        td.dataset.editorKind = "text";
        td.contentEditable = "true";
        td.spellcheck = false;
        td.dataset.cellEditor = "true";
        td.textContent = row.cells[col.id] ?? "";

        td.addEventListener("paste", handlePlainTextPaste);

        td.addEventListener("input", () => {
          row.cells[col.id] = td.textContent;
          scheduleSave();
        });

        td.addEventListener("keydown", event => {
          if (event.key === "Enter") {
            event.preventDefault();
            row.cells[col.id] = td.textContent;
            scheduleSave();
            enterNavigationMode(td);
            return;
          }

          handleTabAtEnd(event, tr, td);
        });

        td.addEventListener("click", () => {
          if (navCell !== td) return;

          clearNavigationMode();

          requestAnimationFrame(() => {
            td.focus();
            placeCaretAtEnd(td);
          });
        });
      }

      function createComboInput(td, tr, row, col, multi) {
        const entry = document.createElement("div");
        entry.className = multi ? "multi-entry" : "combo-wrap";

        const input = document.createElement("input");
        input.className = "combo-input";
        input.type = "text";
        input.autocomplete = "off";
        input.spellcheck = false;
        input.value = multi ? "" : String(row.cells[col.id] ?? "");
        input.dataset.cellEditor = "true";
        input.setAttribute("role", "combobox");
        input.setAttribute("aria-autocomplete", "list");
        input.setAttribute("aria-expanded", "false");

        const arrow = document.createElement("button");
        arrow.type = "button";
        arrow.className = "combo-arrow";
        arrow.tabIndex = -1;
        arrow.textContent = "▾";
        arrow.title = "显示全部选项";

        input.addEventListener("focus", () => {
          if (navCell === td) clearNavigationMode();
          openCombo(input, row, col, true, false);
        });

        input.addEventListener("paste", event => {
          event.preventDefault();

          const clipboard = event.clipboardData || window.clipboardData;
          const plainText = (clipboard?.getData("text/plain") ?? "")
            .replace(/\r\n?/g, "\n")
            .replace(/\n+/g, " ");

          const start = input.selectionStart ?? input.value.length;
          const end = input.selectionEnd ?? input.value.length;

          input.setRangeText(plainText, start, end, "end");
          input.dispatchEvent(new Event("input", { bubbles: true }));
        });

        input.addEventListener("input", () => {
          if (!multi) {
            row.cells[col.id] = input.value;
            scheduleSave();
          }

          openCombo(input, row, col, true, false);
        });

        input.addEventListener("keydown", event => {
          if (event.key === "ArrowDown") {
            event.preventDefault();

            if (!comboContext || comboContext.input !== input) {
              openCombo(input, row, col, true, false);
            } else {
              moveComboHighlight(1);
            }
            return;
          }

          if (event.key === "ArrowUp") {
            event.preventDefault();

            if (!comboContext || comboContext.input !== input) {
              openCombo(input, row, col, true, false);
            } else {
              moveComboHighlight(-1);
            }
            return;
          }

          if (event.key === "Enter") {
            event.preventDefault();

            if (multi) {
              const query = input.value.trim();

              if (!query) {
                closeCombo();
                refreshMultiCell(td, tr, row, col, false);
                enterNavigationMode(td);
                return;
              }

              if (
                comboContext &&
                comboContext.input === input &&
                comboContext.matches.length
              ) {
                selectComboOption(
                  comboContext.matches[comboContext.activeIndex],
                  false
                );
              } else {
                addMultiValue(row, col, query);
                input.value = "";
                closeCombo();
                refreshMultiCell(td, tr, row, col, true);
              }
              return;
            }

            if (
              comboContext &&
              comboContext.input === input &&
              comboContext.matches.length
            ) {
              selectComboOption(
                comboContext.matches[comboContext.activeIndex],
                true
              );
            } else {
              commitSingleValue(input, row, col);
              enterNavigationMode(td);
            }
            return;
          }

          if (event.key === "Escape") {
            closeCombo();

            if (multi) {
              input.value = "";
            } else {
              input.value = String(row.cells[col.id] ?? "");
              input.select();
            }
            return;
          }

          if (event.key === "Tab") {
            if (multi) {
              const query = input.value.trim();
              if (query) addMultiValue(row, col, query);
            } else {
              commitSingleValue(input, row, col, false);
            }

            handleTabAtEnd(event, tr, input);
          }
        });

        input.addEventListener("blur", () => {
          setTimeout(() => {
            if (multi) {
              const query = input.value.trim();
              if (query) {
                addMultiValue(row, col, query);
                input.value = "";
              }
              refreshMultiCell(td, tr, row, col, false);
            } else {
              commitSingleValue(input, row, col, false);
            }

            if (comboContext?.input === input) closeCombo();
          }, 80);
        });

        arrow.addEventListener("mousedown", event => event.preventDefault());

        arrow.addEventListener("click", event => {
          event.stopPropagation();
          input.focus();
          openCombo(input, row, col, true, true);
        });

        entry.append(input, arrow);
        return entry;
      }

      function renderSingleSelectCell(td, tr, row, col) {
        td.className = "select-cell";
        td.dataset.editorKind = "combo";
        td.appendChild(createComboInput(td, tr, row, col, false));
      }

      function renderMultiCell(td, tr, row, col) {
        td.className = "multi-select-cell";
        td.dataset.editorKind = "multi";

        const wrap = document.createElement("div");
        wrap.className = "multi-wrap";

        normalizeMultiValue(row.cells[col.id]).forEach(value => {
          const valueRow = document.createElement("div");
          valueRow.className = "multi-value-row";

          const valueText = document.createElement("div");
          valueText.className = "multi-value-text";
          valueText.textContent = value;

          valueRow.appendChild(valueText);
          wrap.appendChild(valueRow);
        });

        td.replaceChildren(wrap);

        td.onclick = event => {
          if (navCell === td) return;
          activateMultiEditor(td, tr, row, col);
        };
      }

      function activateMultiEditor(td, tr, row, col) {
        let wrap = td.querySelector(".multi-wrap");
        if (!wrap) {
          renderMultiCell(td, tr, row, col);
          wrap = td.querySelector(".multi-wrap");
        }

        let input = td.querySelector(".combo-input");
        if (input) {
          input.focus();
          return;
        }

        const entry = createComboInput(td, tr, row, col, true);
        wrap.appendChild(entry);

        input = entry.querySelector(".combo-input");
        requestAnimationFrame(() => {
          input?.focus();
        });
      }

      function refreshMultiCell(td, tr, row, col, keepEditing = false) {
        closeCombo();
        td.replaceChildren();
        renderMultiCell(td, tr, row, col);

        if (keepEditing) {
          requestAnimationFrame(() => {
            activateMultiEditor(td, tr, row, col);
          });
        }
      }

      function getOptions(col) {
        if (!Array.isArray(state.selectOptions[col.id])) {
          state.selectOptions[col.id] = [];
        }
        return state.selectOptions[col.id];
      }

      function addOption(col, value, shouldSave = true) {
        const clean = String(value ?? "").trim();
        if (!clean) return;

        const options = getOptions(col);
        const exists = options.some(option =>
          String(option).localeCompare(
            clean,
            "zh-CN",
            { sensitivity: "base" }
          ) === 0
        );

        pendingOptionDeletes[col.id] = getPendingDeletes(col.id).filter(item =>
          item.localeCompare(clean, "zh-CN", { sensitivity: "base" }) !== 0
        );

        if (!exists) {
          options.push(clean);
          options.sort((a, b) =>
            String(a).localeCompare(String(b), "zh-CN", {
              numeric: true,
              sensitivity: "base"
            })
          );

          if (shouldSave) scheduleSave();
        }
      }

      function addMultiValue(row, col, value) {
        const clean = String(value ?? "").trim();
        if (!clean) return false;

        const values = normalizeMultiValue(row.cells[col.id]);
        const exists = values.some(item =>
          item.localeCompare(clean, "zh-CN", { sensitivity: "base" }) === 0
        );

        if (!exists) {
          values.push(clean);
          row.cells[col.id] = values;
        }

        addOption(col, clean, false);
        scheduleSave();
        return !exists;
      }

      function filteredOptions(col, query, row = null) {
        const q = String(query ?? "").trim().toLocaleLowerCase();
        let options = [...getOptions(col)];

        if (!q) return options;

        return options
          .filter(option =>
            String(option).toLocaleLowerCase().includes(q)
          )
          .sort((a, b) => {
            const aa = String(a).toLocaleLowerCase();
            const bb = String(b).toLocaleLowerCase();
            const aStarts = aa.startsWith(q) ? 0 : 1;
            const bStarts = bb.startsWith(q) ? 0 : 1;

            return (
              aStarts - bStarts ||
              aa.localeCompare(bb, "zh-CN", { numeric: true })
            );
          });
      }

      function openCombo(
        input,
        row,
        col,
        showEmptyState = true,
        showAll = false
      ) {
        const matches = showAll
          ? filteredOptions(col, "", row)
          : filteredOptions(col, input.value, row);

        comboContext = {
          input,
          row,
          col,
          matches,
          activeIndex: matches.length ? 0 : -1
        };

        input.setAttribute("aria-expanded", "true");
        renderComboMenu(showEmptyState);
        positionComboMenu(input);
      }

      function renderComboMenu(showEmptyState = true) {
        comboMenu.replaceChildren();

        if (!comboContext) {
          comboMenu.classList.remove("show");
          return;
        }

        const { matches, activeIndex, col } = comboContext;

        if (!matches.length) {
          if (!showEmptyState) {
            closeCombo();
            return;
          }

          const empty = document.createElement("div");
          empty.className = "combo-empty";
          empty.textContent = isMultiColumn(col)
            ? "没有匹配项；输入新内容后按 Enter 添加"
            : "没有匹配项；按 Enter 保存为新选项";
          comboMenu.appendChild(empty);
        } else {
          matches.forEach((value, index) => {
            const optionRow = document.createElement("div");
            optionRow.className = "combo-option-row";

            const option = document.createElement("button");
            option.type = "button";
            option.className =
              "combo-option" + (index === activeIndex ? " active" : "");
            const isSelected =
              isMultiColumn(col) &&
              normalizeMultiValue(comboContext.row.cells[col.id]).some(item =>
                item.localeCompare(
                  String(value),
                  "zh-CN",
                  { sensitivity: "base" }
                ) === 0
              );

            option.textContent = isSelected ? `✓ ${value}` : value;
            option.setAttribute("role", "option");
            option.setAttribute(
              "aria-selected",
              isSelected ? "true" : "false"
            );

            option.addEventListener("mousedown", event => {
              event.preventDefault();
              selectComboOption(value, !isMultiColumn(col));
            });

            const deleteButton = document.createElement("button");
            deleteButton.type = "button";
            deleteButton.className = "combo-delete-option";
            deleteButton.textContent = "×";
            deleteButton.title = "删除该下拉选项";
            deleteButton.setAttribute("aria-label", `删除选项 ${value}`);

            deleteButton.addEventListener("mousedown", event => {
              event.preventDefault();
              event.stopPropagation();
              deleteComboOption(value);
            });

            optionRow.append(option, deleteButton);
            comboMenu.appendChild(optionRow);
          });
        }

        comboMenu.classList.add("show");
      }

      function positionComboMenu(input) {
        if (!comboContext) return;

        const rect = input.getBoundingClientRect();
        const width = Math.max(180, rect.width);
        comboMenu.style.width = width + "px";

        const maxMenuHeight = Math.min(window.innerHeight * 0.6, 520);
        const menuHeight = Math.min(
          comboMenu.scrollHeight || 220,
          maxMenuHeight
        );

        let top = rect.bottom + 4;

        if (top + menuHeight > window.innerHeight - 8) {
          top = Math.max(8, rect.top - menuHeight - 4);
        }

        comboMenu.style.left =
          Math.max(
            8,
            Math.min(rect.left, window.innerWidth - width - 8)
          ) + "px";

        comboMenu.style.top = top + "px";
      }

      function deleteComboOption(value) {
        if (!comboContext) return;

        const { col, input, row } = comboContext;

        state.selectOptions[col.id] = getOptions(col).filter(option =>
          String(option).localeCompare(
            String(value),
            "zh-CN",
            { sensitivity: "base" }
          ) !== 0
        );

        pendingOptionDeletes[col.id] = mergeUniqueStrings(
          getPendingDeletes(col.id),
          [value]
        );

        comboContext.matches = filteredOptions(
          col,
          input.value,
          row
        );

        if (!comboContext.matches.length) {
          comboContext.activeIndex = -1;
        } else {
          comboContext.activeIndex = Math.min(
            Math.max(comboContext.activeIndex, 0),
            comboContext.matches.length - 1
          );
        }

        scheduleSave();
        renderComboMenu(true);
        positionComboMenu(input);
        input.focus();
      }

      function moveComboHighlight(direction) {
        if (!comboContext?.matches.length) return;

        const length = comboContext.matches.length;
        comboContext.activeIndex =
          (comboContext.activeIndex + direction + length) % length;

        renderComboMenu(true);
        positionComboMenu(comboContext.input);

        const active = comboMenu.querySelector(".combo-option.active");
        active?.scrollIntoView({ block: "nearest" });
      }

      function selectComboOption(value, finishInput = false) {
        if (!comboContext) return;

        const { input, row, col } = comboContext;
        const td = input.closest('td[data-column-id]');

        if (isMultiColumn(col)) {
          const values = normalizeMultiValue(row.cells[col.id]);
          const selectedIndex = values.findIndex(item =>
            item.localeCompare(
              String(value),
              "zh-CN",
              { sensitivity: "base" }
            ) === 0
          );

          if (selectedIndex >= 0) {
            values.splice(selectedIndex, 1);
            row.cells[col.id] = values;
            scheduleSave();
          } else {
            addMultiValue(row, col, value);
          }

          input.value = "";
          closeCombo();
          refreshMultiCell(td, td.closest("tr"), row, col, true);
          return;
        }

        input.value = value;
        row.cells[col.id] = value;
        addOption(col, value, false);
        scheduleSave();
        closeCombo();

        if (finishInput) {
          enterNavigationMode(td);
        } else {
          input.focus();
        }
      }

      function commitSingleValue(input, row, col, close = true) {
        const value = input.value.trim();
        input.value = value;
        row.cells[col.id] = value;

        if (value) addOption(col, value, false);

        scheduleSave();
        if (close) closeCombo();
      }

      function closeCombo() {
        if (comboContext?.input) {
          comboContext.input.setAttribute("aria-expanded", "false");
        }

        comboContext = null;
