<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Music</title>
  <style>
    /* 中文字符使用宋体；英文、数字及西文符号使用 Times New Roman。 */
    @font-face {
      font-family: "MusicMixed";
      src: local("Times New Roman");
      unicode-range:
        U+0000-024F,
        U+1E00-1EFF,
        U+2000-206F,
        U+20A0-20CF;
    }
    @font-face {
      font-family: "MusicMixed";
      src: local("SimSun"), local("宋体"), local("Songti SC"), local("STSong");
      unicode-range:
        U+2E80-2EFF,
        U+2F00-2FDF,
        U+3000-303F,
        U+31C0-31EF,
        U+3400-4DBF,
        U+4E00-9FFF,
        U+F900-FAFF,
        U+FF00-FFEF;
    }
    :root {
      --bg: #fff;
      --text: #171717;
      --muted: #6b6b6b;
      --line: #e8e8e6;
      --soft: #f7f7f5;
      --blue: #0b66e4;
      --red: #c9342f;
      --shadow: 0 14px 42px rgba(0,0,0,.14);
    }
    * { box-sizing: border-box; }
    html { background: var(--bg); }
    body {
      margin: 0;
      color: var(--text);
      background: var(--bg);
      font: 15px/1.5 "MusicMixed","Times New Roman",SimSun,"宋体",serif;
    }
    button,input,select { font: inherit; }
    button { color: inherit; }
    .app { min-height: 100vh; padding: 28px 32px 96px; }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }
    h1 { margin: 0; font: 700 34px/1.15 "MusicMixed","Times New Roman",SimSun,"宋体",serif; }
    .mode {
      display: inline-flex;
      align-items: center;
      min-height: 30px;
      padding: 4px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      background: var(--soft);
      font-size: 13px;
      white-space: nowrap;
    }
    .mode.editor { color: #174d25; background: #eef8f0; border-color: #cfe6d4; }
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 7px 0;
      border-bottom: 1px solid var(--line);
    }
    .toolbar-group { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
    .btn {
      appearance: none;
      border: 1px solid transparent;
      border-radius: 7px;
      padding: 7px 10px;
      background: transparent;
      cursor: pointer;
    }
    .btn:hover { background: var(--soft); }
    .btn.primary { color: #fff; background: var(--blue); }
    .btn.primary:hover { background: #0959c8; }
    .btn.danger { color: var(--red); }
    .btn[hidden] { display: none; }
    .status { color: var(--muted); font-size: 13px; }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }
    .table-wrap { width: 100%; overflow: auto; border-bottom: 1px solid var(--line); }
    table { width: 100%; min-width: max-content; border-collapse: separate; border-spacing: 0; table-layout: fixed; }
    th,td {
      width: 190px;
      min-width: 110px;
      padding: 8px 10px;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
      background: #fff;
      overflow-wrap: anywhere;
    }
    th:first-child,td:first-child { border-left: 1px solid var(--line); }
    th {
      position: sticky;
      top: 0;
      z-index: 5;
      color: var(--muted);
      background: rgba(255,255,255,.97);
      font-size: 13px;
      font-weight: 650;
    }
    th[data-column-id],td[data-column-id] { position: relative; }
    .header-inner { display: flex; align-items: center; gap: 6px; min-width: 0; }
    .header-name { flex: 1; min-width: 40px; outline: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .header-name[contenteditable="true"] { cursor: text; }
    .header-name:focus,td.text-cell[contenteditable="true"]:focus { outline: 2px solid rgba(0,103,255,.28); outline-offset: -2px; }
    .sort-mark { min-width: 12px; color: #000; font-size: 12px; text-align: center; }
    .col-menu-btn { width: 22px; height: 22px; padding: 0; border: 0; border-radius: 5px; background: transparent; cursor: pointer; opacity: 0; }
    th:hover .col-menu-btn,.col-menu-btn:focus { opacity: 1; }
    .col-menu-btn:hover { background: var(--soft); }
    .resize-handle { position: absolute; z-index: 35; top: 0; right: -3px; width: 7px; height: 100%; cursor: col-resize; touch-action: none; }
    .resize-handle::after { content: ""; position: absolute; top: 5px; bottom: 5px; left: 3px; width: 1px; background: transparent; }
    th:hover .resize-handle::after,body.resizing-columns .resize-handle::after { background: #b7b7b3; }
    body.resizing-columns { cursor: col-resize !important; user-select: none !important; }
    .row-number { width: 54px; min-width: 54px; max-width: 54px; color: #000; text-align: center; user-select: none; }
    .row-actions { position: sticky; right: 0; z-index: 8; width: 54px; min-width: 54px; text-align: center; }
    .cell-input {
      width: 100%;
      min-height: 24px;
      padding: 0;
      border: 0;
      outline: 0;
      color: var(--text);
      background: transparent;
    }
    .cell-input:focus { box-shadow: inset 0 -2px 0 rgba(11,102,228,.35); }
    .cell-input.has-menu:focus { box-shadow: none; }
    .text-cell { cursor: text; white-space: pre-wrap; }
    .select-cell,.multi-select-cell { padding: 4px 7px; }
    .combo-wrap,.multi-entry { position: relative; display: flex; align-items: center; width: 100%; min-height: 29px; }
    .combo-arrow { position: absolute; right: 2px; top: 50%; transform: translateY(-50%); width: 22px; height: 22px; padding: 0; border: 0; border-radius: 4px; background: transparent; cursor: pointer; }
    .combo-arrow:hover { background: var(--soft); }
    .combo-wrap .cell-input,.multi-entry .cell-input { padding-right: 26px; }
    .multi-wrap { display: flex; flex-direction: column; width: 100%; min-height: 29px; }
    .multi-value-row { display: flex; align-items: center; width: 100%; min-height: 29px; }
    .multi-value-text { flex: 1; min-width: 0; padding: 4px 5px; overflow-wrap: anywhere; }
    td.nav-cell { outline: 2px solid var(--blue); outline-offset: -2px; background: #fff !important; }
    .option-menu {
      position: fixed;
      z-index: 60;
      min-width: 180px;
      max-width: min(420px,calc(100vw - 20px));
      max-height: min(320px,calc(100vh - 20px));
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 5px;
      border: 1px solid #d8d8d5;
      border-radius: 8px;
      background: #fff;
      box-shadow: var(--shadow);
      scrollbar-gutter: stable;
    }
    .option-menu[hidden] { display: none; }
    .option-item {
      display: block;
      width: 100%;
      padding: 7px 9px;
      border: 0;
      border-radius: 5px;
      color: var(--text);
      background: transparent;
      text-align: left;
      cursor: pointer;
      white-space: normal;
      overflow-wrap: anywhere;
    }
    .option-item:hover,.option-item:focus-visible,.option-item.active { background: var(--soft); outline: none; }
    .option-row { display: flex; align-items: center; gap: 4px; width: 100%; }
    .option-row .option-item { flex: 1 1 auto; min-width: 0; }
    .option-delete { flex: 0 0 28px; width: 28px; height: 28px; padding: 0; border: 0; border-radius: 5px; background: transparent; cursor: pointer; }
    .option-delete:hover { color: var(--red); background: #f3f3f1; }
    .option-empty { padding: 8px 9px; color: var(--muted); }
    .delete-row {
      width: 26px;
      height: 26px;
      border: 0;
      border-radius: 5px;
      color: #999;
      background: transparent;
      cursor: pointer;
    }
    .delete-row:hover { color: var(--red); background: #fff1f0; }
    .new-row { width: 100%; padding: 10px 12px; border: 0; border-left: 1px solid var(--line); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); color: var(--muted); background: #fff; text-align: left; cursor: pointer; }
    .new-row:hover { color: var(--text); background: var(--soft); }
    .empty { padding: 42px 16px; color: var(--muted); text-align: center; }
    .panel {
      position: fixed;
      z-index: 30;
      top: 76px;
      right: 32px;
      width: min(430px,calc(100vw - 28px));
      padding: 16px;
      border: 1px solid #d8d8d5;
      border-radius: 12px;
      background: #fff;
      box-shadow: var(--shadow);
    }
    .panel[hidden] { display: none; }
    .panel h2 { margin: 0 0 12px; font-size: 17px; }
    .field { display: grid; grid-template-columns: 82px 1fr; gap: 9px; align-items: center; margin: 9px 0; }
    .field label { font-weight: 650; }
    .field input,.field select {
      width: 100%;
      min-width: 0;
      padding: 8px 9px;
      border: 1px solid #d8d8d5;
      border-radius: 7px;
      outline: none;
      background: #fff;
    }
    .field input:focus,.field select:focus { border-color: var(--blue); }
    #tokenInput { -webkit-text-security: disc; }
    .remember { display: flex; gap: 8px; align-items: center; margin: 10px 0 0 91px; font-size: 13px; }
    .panel-actions { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
    .panel-note { margin-top: 10px; color: var(--muted); font-size: 12px; }
    .sort-panel { right: auto; left: 32px; width: min(360px,calc(100vw - 28px)); }
    .sort-rule { display: grid; grid-template-columns: 1fr 104px 32px; gap: 6px; align-items: center; margin: 6px 0; }
    .sort-rule select { min-width: 0; padding: 7px 8px; border: 1px solid #d8d8d5; border-radius: 6px; background: #fff; }
    .sort-rule button { width: 32px; height: 32px; border: 0; border-radius: 6px; background: transparent; cursor: pointer; }
    .sort-rule button:hover { background: var(--soft); }
    .column-menu { position: fixed; z-index: 70; min-width: 180px; padding: 6px; border: 1px solid #d8d8d5; border-radius: 9px; background: #fff; box-shadow: var(--shadow); }
    .column-menu[hidden] { display: none; }
    .column-menu button { display: block; width: 100%; padding: 7px 8px; border: 0; border-radius: 6px; background: transparent; text-align: left; cursor: pointer; }
    .column-menu button:hover { background: var(--soft); }
    .column-menu .danger { color: var(--red); }
    #backToTop { position: fixed; right: 22px; top: 65vh; z-index: 50; width: 30px; height: 30px; border: 0; border-radius: 50%; color: #fff; background: var(--blue); cursor: pointer; opacity: 0; pointer-events: none; transition: opacity .15s ease; }
    #backToTop.visible { opacity: 1; pointer-events: auto; }
    @media (max-width:720px) {
      .app { padding: 20px 14px 72px; }
      .topbar { align-items: flex-start; }
      h1 { font-size: 29px; }
      .panel,.sort-panel { top: 66px; left: 14px; right: 14px; width: auto; }
      .remember { margin-left: 0; }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="topbar">
      <h1>Music</h1>
      <span class="mode" id="modeBadge">访客只读</span>
    </div>

    <div class="toolbar">
      <div class="toolbar-group">
        <button class="btn" id="addRowButton" type="button" hidden>＋ 新增行</button>
        <button class="btn" id="addColumnButton" type="button" hidden>＋ 新增列</button>
        <button class="btn" id="sortButton" type="button">⇅ 排序</button>
      </div>
      <div class="toolbar-group">
        <span class="status" id="rowCount">0 行</span>
        <span class="status" id="saveStatus">正在读取已同步内容…</span>
        <button class="btn" id="syncPanelButton" type="button">GitHub</button>
        <button class="btn primary" id="publishButton" type="button" hidden>同步发布</button>
      </div>
    </div>

    <div class="sr-only" id="notice" role="status" aria-live="polite"></div>

    <div class="table-wrap">
      <table id="musicTable" aria-label="音乐数据库">
        <thead id="tableHead"></thead>
        <tbody id="tableBody"></tbody>
      </table>
      <div class="empty" id="emptyState" hidden>暂无已同步内容。</div>
      <button class="new-row" id="addRowBottom" type="button" hidden>＋ 新建</button>
    </div>
  </main>

  <section class="panel" id="syncPanel" aria-label="GitHub 设置" hidden>
    <h2>GitHub 设置</h2>
    <div class="field"><label for="ownerInput">Owner</label><input id="ownerInput" autocomplete="off"></div>
    <div class="field"><label for="repoInput">仓库</label><input id="repoInput" autocomplete="off"></div>
    <div class="field"><label for="branchInput">分支</label><input id="branchInput" value="main" autocomplete="off"></div>
    <div class="field">
      <label for="tokenInput">Token</label>
      <input id="tokenInput" type="password" autocomplete="current-password" placeholder="Contents: Read and write">
    </div>
    <label class="remember" for="rememberToken"><input id="rememberToken" type="checkbox">在此设备保存 Token</label>
    <div class="panel-actions">
      <button class="btn primary" id="enterEditorButton" type="button">进入编辑终端</button>
      <button class="btn" id="leaveEditorButton" type="button">退出编辑终端</button>
      <button class="btn" id="closeSyncPanelButton" type="button">关闭</button>
    </div>
    <div class="panel-note">Token 输入始终以黑点显示。未输入 Token 时，页面严格处于只读访客模式。</div>
  </section>

  <section class="panel sort-panel" id="sortPanel" aria-label="排序" hidden>
    <h2>排序</h2>
    <div class="panel-note">可添加多条规则，按从上到下的优先级排序。</div>
    <div id="sortRules"></div>
    <div class="panel-actions">
      <button class="btn primary" id="addSortRuleButton" type="button">＋ 添加排序</button>
      <button class="btn" id="clearSortButton" type="button">清除</button>
      <button class="btn" id="closeSortButton" type="button">关闭</button>
    </div>
  </section>

  <div class="option-menu" id="optionMenu" role="listbox" aria-label="可选内容" hidden></div>
  <div class="column-menu" id="columnMenu" hidden>
    <button type="button" id="sortAscButton">升序排列</button>
    <button type="button" id="sortDescButton">降序排列</button>
    <button type="button" id="renameColumnButton">重命名</button>
    <button type="button" id="deleteColumnButton" class="danger">删除该列</button>
  </div>
  <button id="backToTop" type="button" aria-label="回到顶部" title="回到顶部">↑</button>

  <script>
    (() => {
      "use strict";

      const DATA_PATH = "music-data.json";
      const CONFIG_KEY = "music-authoritative-config-v1";
      const DRAFT_KEY = "music-authoritative-editor-draft-v1";
      const SESSION_TOKEN_KEY = "music-authoritative-session-token-v1";
      const SAVED_TOKEN_KEY = "music-authoritative-saved-token-v1";
      const MULTI_COLUMNS = new Set(["artist", "lyricist", "composer"]);
      const SELECT_COLUMNS = new Set(["artist", "lyricist", "composer", "album"]);
      const MULTI_NAMES = new Set(["歌手", "作词", "作曲"]);
      const SINGLE_SELECT_NAMES = new Set(["专辑"]);

      const defaultColumns = [
        { id: "title", name: "曲名", width: 240 },
        { id: "artist", name: "歌手", width: 210 },
        { id: "lyricist", name: "作词", width: 210 },
        { id: "composer", name: "作曲", width: 210 },
        { id: "album", name: "专辑", width: 220 },
        { id: "year", name: "年份", width: 120 },
        { id: "rating", name: "评分", width: 120 }
      ];

      let mode = "visitor";
      let state = emptyState();
      let activeTarget = null;
      let publishing = false;
      let menuInput = null;
      let menuColumn = null;
      let menuRow = null;
      let activeOptionIndex = -1;
      let menuMatches = [];
      let activeColumnId = null;
      let navCell = null;
      let menuInteracting = false;

      const $ = id => document.getElementById(id);
      const tableHead = $("tableHead");
      const tableBody = $("tableBody");
      const emptyStateElement = $("emptyState");
      const modeBadge = $("modeBadge");
      const rowCount = $("rowCount");
      const saveStatus = $("saveStatus");
      const notice = $("notice");
      const syncPanel = $("syncPanel");
      const sortPanel = $("sortPanel");
      const ownerInput = $("ownerInput");
      const repoInput = $("repoInput");
      const branchInput = $("branchInput");
      const tokenInput = $("tokenInput");
      const rememberToken = $("rememberToken");
      const optionMenu = $("optionMenu");
      const columnMenu = $("columnMenu");
      const sortRules = $("sortRules");
      const backToTop = $("backToTop");

      function clone(value) {
        return JSON.parse(JSON.stringify(value));
      }

      function emptyState() {
        return {
          schemaVersion: 1,
          columns: clone(defaultColumns),
          rows: [],
          sortRules: [],
          selectOptions: { artist: [], lyricist: [], composer: [], album: [] },
          meta: {}
        };
      }

      function safeGet(storage, key) {
        try { return storage.getItem(key) || ""; } catch { return ""; }
      }

      function safeSet(storage, key, value) {
        try { storage.setItem(key, value); return true; } catch { return false; }
      }

      function safeRemove(storage, key) {
        try { storage.removeItem(key); } catch {}
      }

      function validState(value) {
        return Boolean(value && Array.isArray(value.columns) && Array.isArray(value.rows));
      }

      function normalizeMulti(value) {
        const values = Array.isArray(value)
          ? value
          : String(value ?? "").split(/\r?\n|、|,|，|;|；/);
        const result = [];
        values.forEach(item => {
          const clean = String(item ?? "").trim();
          if (clean && !result.some(existing => existing.localeCompare(clean,"zh-CN",{sensitivity:"base"}) === 0)) {
            result.push(clean);
          }
        });
        return result;
      }

      function isMultiColumn(column) {
        return MULTI_COLUMNS.has(column.id) || MULTI_NAMES.has(String(column.name || "").trim());
      }

      function isSingleSelectColumn(column) {
        return column.id === "album" || SINGLE_SELECT_NAMES.has(String(column.name || "").trim());
      }

      function isSelectColumn(column) {
        return isMultiColumn(column) || isSingleSelectColumn(column);
      }

      function normalizeState(input) {
        if (!validState(input)) return emptyState();
        const result = clone(input);
        result.schemaVersion = 1;
        result.columns = result.columns
          .filter(column => column && column.id)
          .map(column => ({
            id: String(column.id),
            name: String(column.name || column.id),
            width: Math.max(90,Number(column.width) || 190)
          }));
        result.rows = result.rows.map(row => {
          const cells = row && typeof row.cells === "object" ? clone(row.cells) : {};
          result.columns.forEach(column => {
            if (!(column.id in cells)) cells[column.id] = isMultiColumn(column) ? [] : "";
            if (isMultiColumn(column)) cells[column.id] = normalizeMulti(cells[column.id]);
            else if (Array.isArray(cells[column.id])) cells[column.id] = cells[column.id][0] || "";
          });
          return { id: String(row.id || crypto.randomUUID()), cells };
        });
        const validIds = new Set(result.columns.map(column => column.id));
        result.sortRules = Array.isArray(result.sortRules)
          ? result.sortRules.filter(rule => validIds.has(rule.columnId)).map(rule => ({
              id: String(rule.id || crypto.randomUUID()),
              columnId: rule.columnId,
              direction: rule.direction === "desc" ? "desc" : "asc"
            }))
          : [];
        result.selectOptions = result.selectOptions && typeof result.selectOptions === "object" ? result.selectOptions : {};
        result.columns.filter(isSelectColumn).forEach(column => {
          const fromState = Array.isArray(result.selectOptions[column.id]) ? result.selectOptions[column.id] : [];
          const fromRows = result.rows.flatMap(row => isMultiColumn(column) ? normalizeMulti(row.cells[column.id]) : [row.cells[column.id]]);
          result.selectOptions[column.id] = normalizeMulti([...fromState,...fromRows]).sort((a,b) => a.localeCompare(b,"zh-CN",{numeric:true,sensitivity:"base"}));
        });
        result.meta = result.meta && typeof result.meta === "object" ? result.meta : {};
        return result;
      }

      function inferPublicConfig() {
        const host = location.hostname;
        if (!host.endsWith(".github.io")) return null;
        const owner = host.slice(0,-".github.io".length);
        const firstPath = location.pathname.split("/").filter(Boolean)[0];
        return { owner, repo: firstPath || `${owner}.github.io`, branch: "main" };
      }

      function readConfig() {
        try {
          const saved = JSON.parse(safeGet(localStorage,CONFIG_KEY) || "{}");
          return { owner: saved.owner || "", repo: saved.repo || "", branch: saved.branch || "main" };
        } catch {
          return { owner: "", repo: "", branch: "main" };
        }
      }

      function saveConfig(config) {
        safeSet(localStorage,CONFIG_KEY,JSON.stringify(config));
      }

      function targetKey(config) {
        return `${config.owner}/${config.repo}@${config.branch || "main"}/${DATA_PATH}`.toLowerCase();
      }

      function getToken() {
        return safeGet(sessionStorage,SESSION_TOKEN_KEY) || safeGet(localStorage,SAVED_TOKEN_KEY);
      }

      function saveToken(token) {
        safeSet(sessionStorage,SESSION_TOKEN_KEY,token);
        if (rememberToken.checked) safeSet(localStorage,SAVED_TOKEN_KEY,token);
        else safeRemove(localStorage,SAVED_TOKEN_KEY);
      }

      function clearToken() {
        safeRemove(sessionStorage,SESSION_TOKEN_KEY);
        safeRemove(localStorage,SAVED_TOKEN_KEY);
      }

      function readDraft(config) {
        try {
          const envelope = JSON.parse(safeGet(localStorage,DRAFT_KEY));
          if (envelope?.target === targetKey(config) && validState(envelope.state)) return normalizeState(envelope.state);
        } catch {}
        return null;
      }

      function saveDraft() {
        if (mode !== "editor" || !activeTarget) return;
        const envelope = { target: targetKey(activeTarget), savedAt: new Date().toISOString(), state };
        if (safeSet(localStorage,DRAFT_KEY,JSON.stringify(envelope))) saveStatus.textContent = "本机草稿已保存";
        else saveStatus.textContent = "浏览器禁止保存本机草稿";
      }

      function utf8ToBase64(text) {
        const bytes = new TextEncoder().encode(text);
        let binary = "";
        bytes.forEach(byte => { binary += String.fromCharCode(byte); });
        return btoa(binary);
      }

      function base64ToUtf8(text) {
        const binary = atob(String(text || "").replace(/\n/g,""));
        return new TextDecoder().decode(Uint8Array.from(binary,char => char.charCodeAt(0)));
      }

      function contentsUrl(config) {
        const owner = encodeURIComponent(config.owner);
        const repo = encodeURIComponent(config.repo);
        return `https://api.github.com/repos/${owner}/${repo}/contents/${DATA_PATH}`;
      }

      async function githubRead(config,token = "") {
        const headers = { Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28" };
        if (token) headers.Authorization = `Bearer ${token}`;
        const url = `${contentsUrl(config)}?ref=${encodeURIComponent(config.branch || "main")}`;
        const response = await fetch(url,{ headers, cache: "no-store" });
        if (response.status === 404) return null;
        if (!response.ok) throw new Error(`GitHub 读取失败（${response.status}）`);
        const payload = await response.json();
        const parsed = payload.content ? JSON.parse(base64ToUtf8(payload.content)) : null;
        return { sha: payload.sha || null, state: validState(parsed) ? normalizeState(parsed) : null };
      }

      async function publishedRead() {
        const url = new URL(DATA_PATH,document.baseURI);
        url.searchParams.set("t",String(Date.now()));
        const response = await fetch(url,{ cache: "no-store" });
        if (!response.ok) return null;
        const parsed = await response.json();
        return validState(parsed) ? normalizeState(parsed) : null;
      }

      async function loadVisitorState() {
        const inferred = inferPublicConfig();
        if (inferred) {
          try {
            const remote = await githubRead(inferred);
            if (remote?.state) return remote.state;
          } catch {}
        }
        try { return await publishedRead(); } catch { return null; }
      }

      async function githubWrite(config,token,snapshot,sha) {
        const body = {
          message: sha ? "Publish Music database" : "Create Music database",
          content: utf8ToBase64(JSON.stringify(snapshot,null,2)),
          branch: config.branch || "main"
        };
        if (sha) body.sha = sha;
        const response = await fetch(contentsUrl(config),{
          method: "PUT",
          headers: {
            Accept: "application/vnd.github+json",
            "X-GitHub-Api-Version": "2022-11-28",
            Authorization: `Bearer ${token}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify(body)
        });
        if (!response.ok) throw new Error(`GitHub 写入失败（${response.status}）`);
        return response.json();
      }

      function setNotice(message,error = false) {
        notice.textContent = message;
        if (error) saveStatus.textContent = message;
      }

      function setMode(nextMode) {
        mode = nextMode;
        const editor = mode === "editor";
        modeBadge.textContent = editor ? "编辑终端 · 本机为准" : "访客只读";
        modeBadge.classList.toggle("editor",editor);
        $("addRowButton").hidden = !editor;
        $("addColumnButton").hidden = !editor;
        $("publishButton").hidden = !editor;
        $("addRowBottom").hidden = !editor;
        setNotice(editor
          ? "当前终端是唯一编辑源。修改只保存到本机，点击“同步发布”才会写入 GitHub。"
          : "访客只能查看已经同步发布的内容。");
      }

      function displayedRows() {
        const rows = [...state.rows];
        return rows.sort((a,b) => {
          for (const rule of state.sortRules) {
            const column = state.columns.find(item => item.id === rule.columnId);
            const av = Array.isArray(a.cells[rule.columnId]) ? a.cells[rule.columnId].join("、") : String(a.cells[rule.columnId] ?? "");
            const bv = Array.isArray(b.cells[rule.columnId]) ? b.cells[rule.columnId].join("、") : String(b.cells[rule.columnId] ?? "");
            let comparison = 0;
            if (!av && !bv) comparison = 0;
            else if (!av) comparison = 1;
            else if (!bv) comparison = -1;
            else if (rule.direction === "asc" && column && isSingleSelectColumn(column)) {
              const year = value => Number([...value.matchAll(/[（(]\s*(\d{4})\s*[）)]/g)].pop()?.[1] || Number.POSITIVE_INFINITY);
              comparison = year(av) - year(bv) || av.localeCompare(bv,"zh-CN",{numeric:true,sensitivity:"base"});
            } else {
              const an = Number(av.replace(/,/g,""));
              const bn = Number(bv.replace(/,/g,""));
              comparison = Number.isFinite(an) && Number.isFinite(bn)
                ? an - bn
                : av.localeCompare(bv,"zh-CN",{numeric:true,sensitivity:"base"});
            }
            if (comparison) return rule.direction === "desc" ? -comparison : comparison;
          }
          return 0;
        });
      }

      function positionOptionMenu() {
        if (optionMenu.hidden || !menuInput?.isConnected) return;
        const rect = menuInput.getBoundingClientRect();
        const gap = 4;
        const roomBelow = innerHeight - rect.bottom - gap - 10;
        const roomAbove = rect.top - gap - 10;
        const openAbove = roomBelow < 150 && roomAbove > roomBelow;
        optionMenu.style.width = `${Math.max(180,rect.width)}px`;
        optionMenu.style.left = `${Math.max(10,Math.min(rect.left,innerWidth - optionMenu.offsetWidth - 10))}px`;
        optionMenu.style.maxHeight = `${Math.max(96,Math.min(320,openAbove ? roomAbove : roomBelow))}px`;
        if (openAbove) optionMenu.style.top = `${Math.max(10,rect.top - optionMenu.offsetHeight - gap)}px`;
        else optionMenu.style.top = `${Math.min(innerHeight - 10,rect.bottom + gap)}px`;
      }

      function closeOptionMenu() {
        optionMenu.hidden = true;
        optionMenu.replaceChildren();
        if (menuInput) menuInput.setAttribute("aria-expanded","false");
        menuInput = null;
        menuColumn = null;
        menuRow = null;
        activeOptionIndex = -1;
        menuMatches = [];
      }

      function activeOptionText(input,column) {
        const value = String(input.value || "");
        if (!isMultiColumn(column)) return value.trim();
        return value.split(/\r?\n|、|,|，|;|；/).pop().trim();
      }

      function chooseOption(value) {
        if (!menuInput || !menuColumn) return;
        const input = menuInput;
        const row = menuRow;
        const column = menuColumn;
        if (isMultiColumn(column)) {
          const values = normalizeMulti(row?.cells[column.id]);
          const selected = values.findIndex(item => item.localeCompare(String(value),"zh-CN",{sensitivity:"base"}) === 0);
          if (selected >= 0) values.splice(selected,1);
          else values.push(value);
          if (row) row.cells[column.id] = values;
          input.value = "";
        } else {
          input.value = value;
          if (row) row.cells[column.id] = value;
        }
        commitSelectOption(row,column,value);
        input.focus({ preventScroll: true });
        if (isMultiColumn(column)) {
          const td = input.closest("td");
          closeOptionMenu();
          if (td && row) renderMultiCell(td,row,column,true);
        } else closeOptionMenu();
      }

      function openOptionMenu(input,row,column,query = "",showAll = false) {
        menuInput = input;
        menuRow = row;
        menuColumn = column;
        const allOptions = [...(state.selectOptions[column.id] || [])];
        const keyword = String(query || "").trim().toLocaleLowerCase("zh-CN");
        const options = keyword && !showAll
          ? allOptions.filter(value => String(value).toLocaleLowerCase("zh-CN").includes(keyword))
          : allOptions;
        options.sort((a,b) => {
          if (!keyword || showAll) return String(a).localeCompare(String(b),"zh-CN",{numeric:true,sensitivity:"base"});
          const as = String(a).toLocaleLowerCase("zh-CN").startsWith(keyword) ? 0 : 1;
          const bs = String(b).toLocaleLowerCase("zh-CN").startsWith(keyword) ? 0 : 1;
          return as - bs || String(a).localeCompare(String(b),"zh-CN",{numeric:true,sensitivity:"base"});
        });
        activeOptionIndex = options.length ? 0 : -1;
        menuMatches = options;
        optionMenu.replaceChildren();
        if (options.length) {
          options.forEach((value,index) => {
            const optionRow = document.createElement("div");
            optionRow.className = "option-row";
            const item = document.createElement("button");
            item.type = "button";
            item.className = "option-item";
            item.setAttribute("role","option");
            const selected = isMultiColumn(column) && normalizeMulti(row?.cells[column.id]).some(entry => entry.localeCompare(String(value),"zh-CN",{sensitivity:"base"}) === 0);
            item.textContent = selected ? `✓ ${value}` : value;
            item.classList.toggle("active",index === activeOptionIndex);
            item.addEventListener("pointerdown",event => event.preventDefault());
            item.addEventListener("click",() => chooseOption(value));
            const remove = document.createElement("button");
            remove.type = "button";
            remove.className = "option-delete";
            remove.textContent = "×";
            remove.title = "删除该下拉选项";
            remove.addEventListener("pointerdown",event => event.preventDefault());
            remove.addEventListener("click",event => {
              event.stopPropagation();
              state.selectOptions[column.id] = allOptions.filter(option => option.localeCompare(String(value),"zh-CN",{sensitivity:"base"}) !== 0);
              saveDraft();
              openOptionMenu(input,row,column,query,showAll);
            });
            optionRow.append(item,remove);
            optionMenu.appendChild(optionRow);
          });
        } else {
          const empty = document.createElement("div");
          empty.className = "option-empty";
          empty.textContent = keyword ? "没有匹配选项" : "暂无选项";
          optionMenu.appendChild(empty);
        }
        input.setAttribute("aria-expanded","true");
        optionMenu.hidden = false;
        requestAnimationFrame(positionOptionMenu);
      }

      function saveCell(row,column,value) {
        row.cells[column.id] = isMultiColumn(column) ? normalizeMulti(value) : value;
        saveDraft();
      }

      function commitSelectOption(row,column,value) {
        if (!row || !isSelectColumn(column)) return;
        state.selectOptions[column.id] = normalizeMulti([
          ...(state.selectOptions[column.id] || []),
          ...(isMultiColumn(column) ? normalizeMulti(row.cells[column.id]) : [value])
        ]).sort((a,b) => a.localeCompare(b,"zh-CN",{numeric:true,sensitivity:"base"}));
        saveDraft();
      }

      function setCellWidth(element,column) {
        const width = Math.max(80,Number(column.width) || 210);
        element.style.width = `${width}px`;
        element.style.minWidth = `${width}px`;
        element.style.maxWidth = `${width}px`;
      }

      function beginColumnResize(event,column,heading) {
        if (mode !== "editor") return;
        event.preventDefault();
        event.stopPropagation();
        const startX = event.clientX;
        const startWidth = heading.getBoundingClientRect().width;
        document.body.classList.add("resizing-columns");
        const move = moveEvent => {
          column.width = Math.max(80,Math.round(startWidth + moveEvent.clientX - startX));
          document.querySelectorAll(`[data-column-id="${CSS.escape(column.id)}"]`).forEach(element => setCellWidth(element,column));
        };
        const finish = () => {
          document.body.classList.remove("resizing-columns");
          document.removeEventListener("mousemove",move);
          document.removeEventListener("mouseup",finish);
          saveDraft();
        };
        document.addEventListener("mousemove",move);
        document.addEventListener("mouseup",finish);
      }

      function insertPlainText(event) {
        event.preventDefault();
        const text = (event.clipboardData?.getData("text/plain") || "").replace(/\r\n?/g,"\n");
        document.execCommand("insertText",false,text);
      }

      function openColumnMenu(anchor,column) {
        activeColumnId = column.id;
        const rect = anchor.getBoundingClientRect();
        columnMenu.hidden = false;
        columnMenu.style.left = `${Math.max(8,Math.min(rect.left,innerWidth - 192))}px`;
        columnMenu.style.top = `${Math.min(innerHeight - 176,rect.bottom + 5)}px`;
      }

      function renderHead() {
        const tr = document.createElement("tr");
        const numberHead = document.createElement("th");
        numberHead.className = "row-number";
        numberHead.textContent = "#";
        tr.appendChild(numberHead);
        state.columns.forEach(column => {
          const th = document.createElement("th");
          th.dataset.columnId = column.id;
          setCellWidth(th,column);
          const wrap = document.createElement("div");
          wrap.className = "header-inner";
          const name = document.createElement("div");
          name.className = "header-name";
          name.textContent = column.name;
          name.contentEditable = mode === "editor" ? "true" : "false";
          name.spellcheck = false;
          name.addEventListener("paste",insertPlainText);
          name.addEventListener("input",() => {
            column.name = name.textContent.trim() || "未命名";
            saveDraft();
            renderSortRules();
          });
          name.addEventListener("keydown",event => {
            if (event.key === "Enter") { event.preventDefault(); name.blur(); }
          });
          name.addEventListener("blur",() => {
            column.name = name.textContent.trim() || "未命名";
            name.textContent = column.name;
            state = normalizeState(state);
            saveDraft();
            render();
          });
          const mark = document.createElement("span");
          mark.className = "sort-mark";
          const sortIndex = state.sortRules.findIndex(rule => rule.columnId === column.id);
          if (sortIndex >= 0) mark.textContent = state.sortRules[sortIndex].direction === "desc" ? "↓" : "↑";
          wrap.append(name,mark);
          if (mode === "editor") {
            const menu = document.createElement("button");
            menu.type = "button";
            menu.className = "col-menu-btn";
            menu.textContent = "•••";
            menu.title = "列选项";
            menu.addEventListener("click",event => { event.stopPropagation(); openColumnMenu(menu,column); });
            const resize = document.createElement("div");
            resize.className = "resize-handle";
            resize.title = "拖动调整列宽";
            resize.addEventListener("mousedown",event => beginColumnResize(event,column,th));
            wrap.appendChild(menu);
            th.append(wrap,resize);
          } else th.appendChild(wrap);
          tr.appendChild(th);
        });
        const actionHead = document.createElement("th");
        actionHead.className = "row-actions";
        tr.appendChild(actionHead);
        tableHead.replaceChildren(tr);
      }

      function moveOptionHighlight(direction) {
        if (!menuMatches.length) return;
        activeOptionIndex = (activeOptionIndex + direction + menuMatches.length) % menuMatches.length;
        optionMenu.querySelectorAll(".option-item").forEach((item,index) => item.classList.toggle("active",index === activeOptionIndex));
        optionMenu.querySelectorAll(".option-item")[activeOptionIndex]?.scrollIntoView({block:"nearest"});
      }

      function addSelectValue(row,column,value) {
        const clean = String(value || "").trim();
        if (!clean) return;
        if (isMultiColumn(column)) row.cells[column.id] = normalizeMulti([...normalizeMulti(row.cells[column.id]),clean]);
        else row.cells[column.id] = clean;
        commitSelectOption(row,column,clean);
      }

      function handleTabAtEnd(event,editor) {
        if (event.key !== "Tab" || event.shiftKey) return false;
        const rowElement = editor.closest("tr");
        const editors = [...rowElement.querySelectorAll('input,[contenteditable="true"]')];
        if (editor !== editors[editors.length - 1]) return false;
        event.preventDefault();
        addRow();
        return true;
      }

      function createComboInput(td,row,column,multi) {
        const wrap = document.createElement("div");
        wrap.className = multi ? "multi-entry" : "combo-wrap";
        const input = document.createElement("input");
        input.className = "cell-input has-menu";
        input.value = multi ? "" : String(row.cells[column.id] ?? "");
        input.dataset.rowId = row.id;
        input.dataset.columnId = column.id;
        input.dataset.cellEditor = "true";
        input.autocomplete = "off";
        input.spellcheck = false;
        input.setAttribute("role","combobox");
        input.setAttribute("aria-controls","optionMenu");
        input.setAttribute("aria-expanded","false");
        input.addEventListener("focus",() => openOptionMenu(input,row,column,activeOptionText(input,column)));
        input.addEventListener("input",() => {
          if (!multi) saveCell(row,column,input.value);
          openOptionMenu(input,row,column,activeOptionText(input,column));
        });
        input.addEventListener("keydown",event => {
          if (event.key === "ArrowDown") { event.preventDefault(); optionMenu.hidden ? openOptionMenu(input,row,column,activeOptionText(input,column)) : moveOptionHighlight(1); }
          else if (event.key === "ArrowUp") { event.preventDefault(); optionMenu.hidden ? openOptionMenu(input,row,column,activeOptionText(input,column)) : moveOptionHighlight(-1); }
          else if (event.key === "Escape") { closeOptionMenu(); if (multi) input.value = ""; else input.value = String(row.cells[column.id] ?? ""); }
          else if (event.key === "Enter") {
            event.preventDefault();
            if (menuMatches.length && activeOptionIndex >= 0) chooseOption(menuMatches[activeOptionIndex]);
            else {
              addSelectValue(row,column,input.value);
              closeOptionMenu();
              if (multi) renderMultiCell(td,row,column,true);
            }
          } else if (event.key === "Tab") {
            if (input.value.trim()) addSelectValue(row,column,input.value);
            handleTabAtEnd(event,input);
          }
        });
        input.addEventListener("change",() => {
          if (!multi) addSelectValue(row,column,input.value);
        });
        input.addEventListener("blur",() => {
          setTimeout(() => {
            if (menuInteracting || document.activeElement === input) return;
            const value = input.value.trim();
            if (value) addSelectValue(row,column,value);
            if (multi && value) renderMultiCell(td,row,column,false);
            if (menuInput === input) closeOptionMenu();
          },80);
        });
        const arrow = document.createElement("button");
        arrow.type = "button";
        arrow.className = "combo-arrow";
        arrow.tabIndex = -1;
        arrow.textContent = "▾";
        arrow.title = "显示全部选项";
        arrow.addEventListener("pointerdown",event => event.preventDefault());
        arrow.addEventListener("click",event => { event.stopPropagation(); input.focus({preventScroll:true}); openOptionMenu(input,row,column,"",true); });
        wrap.append(input,arrow);
        return wrap;
      }

      function renderMultiCell(td,row,column,keepEditing = false) {
        td.className = "multi-select-cell";
        const wrap = document.createElement("div");
        wrap.className = "multi-wrap";
        normalizeMulti(row.cells[column.id]).forEach(value => {
          const valueRow = document.createElement("div");
          valueRow.className = "multi-value-row";
          const text = document.createElement("div");
          text.className = "multi-value-text";
          text.textContent = value;
          valueRow.appendChild(text);
          wrap.appendChild(valueRow);
        });
        if (mode === "editor" && keepEditing) wrap.appendChild(createComboInput(td,row,column,true));
        td.replaceChildren(wrap);
        if (mode === "editor") td.onclick = () => {
          if (!td.querySelector(".multi-entry")) {
            wrap.appendChild(createComboInput(td,row,column,true));
            wrap.querySelector("input")?.focus();
          }
        };
      }

      function enterNavigationMode(td) {
        if (navCell) navCell.classList.remove("nav-cell");
        navCell = td;
        td.classList.add("nav-cell");
        td.tabIndex = 0;
        td.focus({preventScroll:true});
      }

      function renderBody() {
        const fragment = document.createDocumentFragment();
        displayedRows().forEach((row,index) => {
          const tr = document.createElement("tr");
          tr.dataset.rowId = row.id;
          const number = document.createElement("td");
          number.className = "row-number";
          number.textContent = String(index + 1);
          tr.appendChild(number);
          state.columns.forEach(column => {
            const td = document.createElement("td");
            td.dataset.columnId = column.id;
            setCellWidth(td,column);
            if (isMultiColumn(column)) renderMultiCell(td,row,column,false);
            else if (isSingleSelectColumn(column)) {
              td.className = "select-cell";
              if (mode === "editor") td.appendChild(createComboInput(td,row,column,false));
              else td.textContent = String(row.cells[column.id] ?? "");
            } else {
              td.className = "text-cell";
              td.textContent = String(row.cells[column.id] ?? "");
              if (mode === "editor") {
                td.contentEditable = "true";
                td.spellcheck = false;
                td.dataset.cellEditor = "true";
                td.addEventListener("paste",insertPlainText);
                td.addEventListener("input",() => saveCell(row,column,td.textContent));
                td.addEventListener("keydown",event => {
                  if (event.key === "Enter") { event.preventDefault(); saveCell(row,column,td.textContent); enterNavigationMode(td); }
                  else handleTabAtEnd(event,td);
                });
              }
            }
            tr.appendChild(td);
          });
          const actions = document.createElement("td");
          actions.className = "row-actions";
          if (mode === "editor") {
            const remove = document.createElement("button");
            remove.type = "button";
            remove.className = "delete-row";
            remove.textContent = "×";
            remove.title = "删除本行";
            remove.addEventListener("click",() => {
              if (!confirm(`确认删除第 ${index + 1} 行？`)) return;
              state.rows = state.rows.filter(item => item.id !== row.id);
              saveDraft();
              render();
            });
            actions.appendChild(remove);
          }
          tr.appendChild(actions);
          fragment.appendChild(tr);
        });
        tableBody.replaceChildren(fragment);
      }

      function renderSortRules() {
        sortRules.replaceChildren();
        if (!state.sortRules.length) {
          const empty = document.createElement("div");
          empty.className = "panel-note";
          empty.textContent = "当前没有排序规则。";
          sortRules.appendChild(empty);
          return;
        }
        state.sortRules.forEach(rule => {
          const row = document.createElement("div");
          row.className = "sort-rule";
          const columnSelect = document.createElement("select");
          state.columns.forEach(column => {
            const option = document.createElement("option");
            option.value = column.id;
            option.textContent = column.name;
            option.selected = rule.columnId === column.id;
            columnSelect.appendChild(option);
          });
          columnSelect.addEventListener("change",() => { rule.columnId = columnSelect.value; saveDraft(); render(); });
          const direction = document.createElement("select");
          [["asc","升序"],["desc","降序"]].forEach(([value,label]) => {
            const option = document.createElement("option");
            option.value = value;
            option.textContent = label;
            option.selected = rule.direction === value;
            direction.appendChild(option);
          });
          direction.addEventListener("change",() => { rule.direction = direction.value; saveDraft(); render(); });
          const remove = document.createElement("button");
          remove.type = "button";
          remove.textContent = "×";
          remove.title = "移除此规则";
          remove.addEventListener("click",() => { state.sortRules = state.sortRules.filter(item => item.id !== rule.id); saveDraft(); render(); });
          row.append(columnSelect,direction,remove);
          sortRules.appendChild(row);
        });
      }

      function render() {
        closeOptionMenu();
        renderHead();
        renderBody();
        renderSortRules();
        $("sortButton").textContent = state.sortRules.length ? `⇅ 排序 ${state.sortRules.length}` : "⇅ 排序";
        rowCount.textContent = `${state.rows.length} 行`;
        emptyStateElement.hidden = state.rows.length > 0;
      }

      function populateSyncPanel() {
        const config = readConfig();
        ownerInput.value = config.owner;
        repoInput.value = config.repo;
        branchInput.value = config.branch;
        tokenInput.value = getToken();
        rememberToken.checked = Boolean(safeGet(localStorage,SAVED_TOKEN_KEY));
      }

      async function enterEditor() {
        const config = {
          owner: ownerInput.value.trim(),
          repo: repoInput.value.trim(),
          branch: branchInput.value.trim() || "main"
        };
        const token = tokenInput.value.trim();
        if (!config.owner || !config.repo || !token) {
          setNotice("请输入 Owner、仓库和 Token。",true);
          return;
        }

        $("enterEditorButton").disabled = true;
        setNotice("正在验证仓库并准备编辑终端…");
        try {
          const draft = readDraft(config);
          let remote = null;

          try {
            remote = await githubRead(config,token);
          } catch (error) {
            if (!draft) throw error;
          }

          activeTarget = config;
          saveConfig(config);
          saveToken(token);
          state = draft || remote?.state || emptyState();
          state = normalizeState(state);
          setMode("editor");
          saveStatus.textContent = draft ? "已载入本机草稿" : "已载入已同步内容";
          syncPanel.hidden = true;
          render();
          return true;
        } catch (error) {
          setNotice(error.message || "无法进入编辑终端。",true);
          return false;
        } finally {
          $("enterEditorButton").disabled = false;
        }
      }

      async function publish() {
        if (mode !== "editor" || !activeTarget || publishing) return;
        const token = getToken();
        if (!token) {
          setNotice("Token 已失效，请重新输入。",true);
          syncPanel.hidden = false;
          return;
        }

        publishing = true;
        $("publishButton").disabled = true;
        saveStatus.textContent = "正在同步发布…";
        try {
          const remote = await githubRead(activeTarget,token);
          const snapshot = clone(state);
          snapshot.meta = {
            ...(snapshot.meta || {}),
            updatedAt: new Date().toISOString(),
            source: "Music authoritative editor"
          };
          await githubWrite(activeTarget,token,snapshot,remote?.sha || null);
          state.meta = snapshot.meta;
          saveDraft();
          saveStatus.textContent = "已同步发布";
        } catch (error) {
          saveStatus.textContent = "同步失败，本机草稿未改变";
          setNotice(`${error.message || "同步失败"}。没有修改本机草稿。`,true);
        } finally {
          publishing = false;
          $("publishButton").disabled = false;
        }
      }

      function leaveEditor() {
        clearToken();
        activeTarget = null;
        setMode("visitor");
        syncPanel.hidden = true;
        saveStatus.textContent = "正在读取已同步内容…";
        loadVisitorState().then(remote => {
          state = remote || emptyState();
          saveStatus.textContent = remote ? "已载入已同步内容" : "未找到已同步内容";
          render();
        });
      }

      function addRow() {
        const cells = {};
        state.columns.forEach(column => { cells[column.id] = isMultiColumn(column) ? [] : ""; });
        const row = { id: crypto.randomUUID(), cells };
        state.rows.push(row);
        saveDraft();
        render();
        requestAnimationFrame(() => {
          const target = document.querySelector(`[data-row-id="${CSS.escape(row.id)}"] [contenteditable="true"], [data-row-id="${CSS.escape(row.id)}"] input`);
          target?.focus();
        });
      }

      function addColumn() {
        const id = `col_${crypto.randomUUID()}`;
        state.columns.push({ id, name: `新列 ${state.columns.length + 1}`, width: 210 });
        state.rows.forEach(row => { row.cells[id] = ""; });
        saveDraft();
        render();
        requestAnimationFrame(() => {
          const heading = document.querySelector(`th[data-column-id="${CSS.escape(id)}"] .header-name`);
          heading?.focus();
          if (heading) {
            const range = document.createRange();
            range.selectNodeContents(heading);
            const selection = getSelection();
            selection.removeAllRanges();
            selection.addRange(range);
          }
        });
      }

      function addSortRule(columnId = state.columns[0]?.id,direction = "asc") {
        if (!columnId) return;
        state.sortRules.push({ id: crypto.randomUUID(), columnId, direction });
        saveDraft();
        render();
      }

      function sortActiveColumn(direction) {
        if (!activeColumnId) return;
        state.sortRules = [{ id: crypto.randomUUID(), columnId: activeColumnId, direction }];
        columnMenu.hidden = true;
        saveDraft();
        render();
      }

      function renameActiveColumn() {
        const heading = document.querySelector(`th[data-column-id="${CSS.escape(activeColumnId || "")}"] .header-name`);
        columnMenu.hidden = true;
        heading?.focus();
        if (heading) {
          const range = document.createRange();
          range.selectNodeContents(heading);
          const selection = getSelection();
          selection.removeAllRanges();
          selection.addRange(range);
        }
      }

      function deleteActiveColumn() {
        if (!activeColumnId || state.columns.length <= 1) return;
        if (!confirm("确认删除该列？")) return;
        state.columns = state.columns.filter(column => column.id !== activeColumnId);
        state.rows.forEach(row => { delete row.cells[activeColumnId]; });
        state.sortRules = state.sortRules.filter(rule => rule.columnId !== activeColumnId);
        delete state.selectOptions[activeColumnId];
        activeColumnId = null;
        columnMenu.hidden = true;
        saveDraft();
        render();
      }

      function moveNavigationCell(key) {
        if (!navCell) return;
        const rows = [...tableBody.querySelectorAll("tr[data-row-id]")];
        const currentRow = rows.indexOf(navCell.closest("tr"));
        const currentColumn = state.columns.findIndex(column => column.id === navCell.dataset.columnId);
        if (currentRow < 0 || currentColumn < 0) return;
        const rowOffset = key === "ArrowUp" ? -1 : key === "ArrowDown" ? 1 : 0;
        const columnOffset = key === "ArrowLeft" ? -1 : key === "ArrowRight" ? 1 : 0;
        const nextRow = Math.max(0,Math.min(rows.length - 1,currentRow + rowOffset));
        const nextColumn = Math.max(0,Math.min(state.columns.length - 1,currentColumn + columnOffset));
        const target = rows[nextRow]?.querySelector(`td[data-column-id="${CSS.escape(state.columns[nextColumn].id)}"]`);
        if (target) enterNavigationMode(target);
      }

      $("addRowButton").addEventListener("click",addRow);
      $("addRowBottom").addEventListener("click",addRow);
      $("addColumnButton").addEventListener("click",addColumn);

      $("syncPanelButton").addEventListener("click",() => {
        populateSyncPanel();
        syncPanel.hidden = !syncPanel.hidden;
        sortPanel.hidden = true;
      });
      $("closeSyncPanelButton").addEventListener("click",() => { syncPanel.hidden = true; });
      $("enterEditorButton").addEventListener("click",enterEditor);
      $("leaveEditorButton").addEventListener("click",leaveEditor);
      $("publishButton").addEventListener("click",publish);

      $("sortButton").addEventListener("click",() => {
        renderSortRules();
        sortPanel.hidden = !sortPanel.hidden;
        syncPanel.hidden = true;
      });
      $("closeSortButton").addEventListener("click",() => { sortPanel.hidden = true; });
      $("addSortRuleButton").addEventListener("click",() => addSortRule());
      $("clearSortButton").addEventListener("click",() => {
        state.sortRules = [];
        if (mode === "editor") saveDraft();
        render();
      });
      $("sortAscButton").addEventListener("click",() => sortActiveColumn("asc"));
      $("sortDescButton").addEventListener("click",() => sortActiveColumn("desc"));
      $("renameColumnButton").addEventListener("click",renameActiveColumn);
      $("deleteColumnButton").addEventListener("click",deleteActiveColumn);

      document.addEventListener("click",event => {
        if (!syncPanel.hidden && !syncPanel.contains(event.target) && event.target !== $("syncPanelButton")) syncPanel.hidden = true;
        if (!sortPanel.hidden && !sortPanel.contains(event.target) && event.target !== $("sortButton")) sortPanel.hidden = true;
        if (!columnMenu.hidden && !columnMenu.contains(event.target) && !event.target.closest(".col-menu-btn")) columnMenu.hidden = true;
        if (!optionMenu.hidden && !optionMenu.contains(event.target) && event.target !== menuInput) closeOptionMenu();
      });
      document.addEventListener("keydown",event => {
        if (!navCell || document.activeElement !== navCell) return;
        if (!["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(event.key)) return;
        event.preventDefault();
        moveNavigationCell(event.key);
      });
      document.addEventListener("pointerdown",event => {
        if (navCell && !navCell.contains(event.target)) {
          navCell.classList.remove("nav-cell");
          navCell = null;
        }
      },true);
      optionMenu.addEventListener("pointerdown",() => { menuInteracting = true; });
      window.addEventListener("pointerup",() => { menuInteracting = false; });
      window.addEventListener("resize",() => { positionOptionMenu(); columnMenu.hidden = true; });
      document.querySelector(".table-wrap").addEventListener("scroll",positionOptionMenu,{ passive: true });
      window.addEventListener("scroll",() => backToTop.classList.toggle("visible",scrollY > 320),{passive:true});
      backToTop.addEventListener("click",() => scrollTo({top:0,behavior:"smooth"}));

      async function initialize() {
        setMode("visitor");
        const token = getToken();
        const config = readConfig();

        if (token && config.owner && config.repo) {
          ownerInput.value = config.owner;
          repoInput.value = config.repo;
          branchInput.value = config.branch;
          tokenInput.value = token;
          rememberToken.checked = Boolean(safeGet(localStorage,SAVED_TOKEN_KEY));
          const entered = await enterEditor();
          if (entered) return;
        }

        const remote = await loadVisitorState();
        state = remote || emptyState();
        saveStatus.textContent = remote ? "已载入已同步内容" : "未找到已同步内容";
        if (!remote) setNotice("未找到可公开读取的 music-data.json。访客模式不会显示本机草稿。",true);
        render();
      }

      initialize();
    })();
  </script>
</body>
</html>
