        comboMenu.classList.remove("show");
        comboMenu.replaceChildren();
      }

      function addRow(shouldRender = true) {
        const row = {
          id: crypto.randomUUID(),
          cells: {}
        };

        state.columns.forEach(col => {
          row.cells[col.id] = isMultiColumn(col) ? [] : "";
        });

        state.rows.push(row);

        if (shouldRender) render();
        return row;
      }

      function addColumn() {
        const id = makeColumnId();
        const index = state.columns.length + 1;

        state.columns.push({
          id,
          name: "新列 " + index,
          width: 210
        });

        state.rows.forEach(row => {
          row.cells[id] = "";
        });

        render();

        requestAnimationFrame(() => {
          const el = document.querySelector(
            `th[data-column-id="${CSS.escape(id)}"] .header-name`
          );

          if (!el) return;

          el.focus();

          const range = document.createRange();
          range.selectNodeContents(el);

          const selection = window.getSelection();
          selection.removeAllRanges();
          selection.addRange(range);
        });
      }

      function sortableText(value) {
        if (Array.isArray(value)) {
          return value.join(" / ");
        }
        return String(value ?? "");
      }

      function compareValues(a, b) {
        const av = sortableText(a).trim();
        const bv = sortableText(b).trim();

        if (av === "" && bv === "") return 0;
        if (av === "") return 1;
        if (bv === "") return -1;

        const an = Number(av.replace(/,/g, ""));
        const bn = Number(bv.replace(/,/g, ""));
        const bothNumeric = Number.isFinite(an) && Number.isFinite(bn);

        if (bothNumeric) return an - bn;

        return av.localeCompare(bv, "zh-CN", {
          numeric: true,
          sensitivity: "base"
        });
      }

      function compareAlbumAscending(a, b) {
        const av = sortableText(a).trim();
        const bv = sortableText(b).trim();

        if (av === "" && bv === "") return 0;
        if (av === "") return 1;
        if (bv === "") return -1;

        const getAlbumYear = value => {
          const matches = [...value.matchAll(/[（(]\s*(\d{4})\s*[）)]/g)];
          if (!matches.length) return Number.POSITIVE_INFINITY;
          return Number(matches[matches.length - 1][1]);
        };

        const ay = getAlbumYear(av);
        const by = getAlbumYear(bv);

        if (ay !== by) return ay - by;

        return av.localeCompare(bv, "zh-CN", {
          numeric: true,
          sensitivity: "base"
        });
      }

      function getSortedRows() {
        const rows = [...state.rows];

        if (!state.sortRules.length) return rows;

        return rows.sort((a, b) => {
          for (const rule of state.sortRules) {
            const column = state.columns.find(col => col.id === rule.columnId);
            let cmp;

            if (
              rule.direction === "asc" &&
              column &&
              (column.id === "album" || column.name === "专辑")
            ) {
              cmp = compareAlbumAscending(
                a.cells[rule.columnId],
                b.cells[rule.columnId]
              );
            } else {
              cmp = compareValues(
                a.cells[rule.columnId],
                b.cells[rule.columnId]
              );
            }

            if (cmp !== 0) {
              return rule.direction === "desc" ? -cmp : cmp;
            }
          }

          return 0;
        });
      }

      function addSortRule(
        columnId = state.columns[0]?.id,
        direction = "asc"
      ) {
        if (!columnId) return;

        state.sortRules.push({
          id: crypto.randomUUID(),
          columnId,
          direction
        });

        render();
      }

      function renderSortRules() {
        sortRules.replaceChildren();

        if (!state.sortRules.length) {
          const empty = document.createElement("div");
          empty.className = "hint";
          empty.style.padding = "8px 0 2px";
          empty.textContent = "当前没有排序规则。";
          sortRules.appendChild(empty);
          return;
        }

        state.sortRules.forEach(rule => {
          const row = document.createElement("div");
          row.className = "sort-rule";

          const colSelect = document.createElement("select");

          state.columns.forEach(col => {
            const option = document.createElement("option");
            option.value = col.id;
            option.textContent = col.name;
            option.selected = col.id === rule.columnId;
            colSelect.appendChild(option);
          });

          colSelect.addEventListener("change", () => {
            rule.columnId = colSelect.value;
            render();
          });

          const dirSelect = document.createElement("select");

          [["asc", "升序"], ["desc", "降序"]].forEach(([value, label]) => {
            const option = document.createElement("option");
            option.value = value;
            option.textContent = label;
            option.selected = value === rule.direction;
            dirSelect.appendChild(option);
          });

          dirSelect.addEventListener("change", () => {
            rule.direction = dirSelect.value;
            render();
          });

          const del = document.createElement("button");
          del.type = "button";
          del.title = "移除此规则";
          del.textContent = "×";

          del.addEventListener("click", () => {
            state.sortRules = state.sortRules.filter(
              item => item.id !== rule.id
            );
            render();
          });

          row.append(colSelect, dirSelect, del);
          sortRules.appendChild(row);
        });
      }

      function updateSortButton() {
        sortToggle.classList.toggle(
          "active",
          state.sortRules.length > 0
        );

        sortToggle.textContent = state.sortRules.length
          ? `⇅ 排序 ${state.sortRules.length}`
          : "⇅ 排序";
      }

      function openColumnMenu(anchor) {
        closeCombo();

        const rect = anchor.getBoundingClientRect();
        columnMenu.classList.add("show");

        const menuWidth = 180;
        const left = Math.min(
          rect.left,
          window.innerWidth - menuWidth - 12
        );

        let top = rect.bottom + 6;

        if (top + 170 > window.innerHeight) {
          top = Math.max(8, rect.top - 170);
        }

        columnMenu.style.left = Math.max(8, left) + "px";
        columnMenu.style.top = top + "px";
      }

      function closePopovers(except = null) {
        if (except !== "sort") sortPanel.classList.remove("show");
        if (except !== "column") columnMenu.classList.remove("show");
      }

      function sortSingleColumn(direction) {
        if (!activeColumnId) return;

        state.sortRules = [{
          id: crypto.randomUUID(),
          columnId: activeColumnId,
          direction
        }];

        closePopovers();
        render();
      }

      function renameActiveColumn() {
        if (!activeColumnId) return;

        closePopovers();

        const el = document.querySelector(
          `th[data-column-id="${CSS.escape(activeColumnId)}"] .header-name`
        );

        if (!el) return;

        el.focus();

        const range = document.createRange();
        range.selectNodeContents(el);

        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
      }

      function deleteActiveColumn() {
        if (!activeColumnId) return;

        if (state.columns.length <= 1) {
          alert("至少保留一列。");
          return;
        }

        state.columns = state.columns.filter(
          col => col.id !== activeColumnId
        );

        state.rows.forEach(row => {
          delete row.cells[activeColumnId];
        });

        state.sortRules = state.sortRules.filter(
          rule => rule.columnId !== activeColumnId
        );

        delete state.selectOptions[activeColumnId];
        activeColumnId = null;

        closePopovers();
        render();
      }

      document
        .getElementById("syncSettings")
        .addEventListener("click", event => {
          event.stopPropagation();
          populateSyncPanel();
          syncPanel.classList.toggle("show");
        });

      document
        .getElementById("connectSync")
        .addEventListener("click", async () => {
          const config = {
            owner: syncOwner.value.trim(),
            repo: syncRepo.value.trim(),
            branch: syncBranch.value.trim() || "main"
          };

          const token = syncToken.value.trim();
          saveSyncConfig(config, token);
          setSyncStatus("正在连接 GitHub…");
          await syncToGitHub(true);
        });

      document
        .getElementById("syncNow")
        .addEventListener("click", async () => {
          const config = {
            owner: syncOwner.value.trim(),
            repo: syncRepo.value.trim(),
            branch: syncBranch.value.trim() || "main"
          };

          saveSyncConfig(config, syncToken.value.trim() || getSyncToken());
          await syncToGitHub(true);
        });

      document
        .getElementById("disconnectSync")
        .addEventListener("click", () => {
          memorySyncToken = "";
          try { sessionStorage.removeItem(SYNC_TOKEN_KEY); } catch {}
          syncToken.value = "";
          clearTimeout(remoteSyncTimer);
          remoteSyncTimer = null;
          startRemotePolling();
          updateSaveState();
          setSyncStatus("已进入访客模式。仍可读取公开内容，Token 已从当前标签页移除。");
        });

      document
        .getElementById("addRowTop")
        .addEventListener("click", () => addRow());

      document
        .getElementById("addRowBottom")
        .addEventListener("click", () => addRow());

      document
        .getElementById("addColumn")
        .addEventListener("click", addColumn);

      sortToggle.addEventListener("click", event => {
        event.stopPropagation();

        const willShow = !sortPanel.classList.contains("show");

        closeCombo();
        closePopovers();

        if (willShow) sortPanel.classList.add("show");
      });

      document
        .getElementById("addSortRule")
        .addEventListener("click", () => addSortRule());

      document
        .getElementById("clearSort")
        .addEventListener("click", () => {
          state.sortRules = [];
          render();
        });

      document
        .getElementById("sortAsc")
        .addEventListener("click", () => sortSingleColumn("asc"));

      document
        .getElementById("sortDesc")
        .addEventListener("click", () => sortSingleColumn("desc"));

      document
        .getElementById("renameColumn")
        .addEventListener("click", renameActiveColumn);

      document
        .getElementById("deleteColumn")
        .addEventListener("click", deleteActiveColumn);

      document.addEventListener("keydown", event => {
        if (!navCell || document.activeElement !== navCell) return;

        if (
          !["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(
            event.key
          )
        ) {
          return;
        }

        event.preventDefault();
        moveNavigationCell(navCell, event.key);
      });

      document.addEventListener(
        "pointerdown",
        event => {
          if (!navCell) return;
          if (navCell.contains(event.target)) return;
          clearNavigationMode();
        },
        true
      );

      document.addEventListener("click", event => {
        if (
          !syncPanel.contains(event.target) &&
          event.target !== document.getElementById("syncSettings")
        ) {
          syncPanel.classList.remove("show");
        }

        if (!sortPanel.contains(event.target) && event.target !== sortToggle) {
          sortPanel.classList.remove("show");
        }

        if (
          !columnMenu.contains(event.target) &&
          !event.target.closest(".col-menu-btn")
        ) {
          columnMenu.classList.remove("show");
        }

        if (
          !comboMenu.contains(event.target) &&
          !event.target.closest(".combo-wrap") &&
          !event.target.closest(".multi-entry")
        ) {
          closeCombo();
        }
      });

      window.addEventListener("resize", () => {
        columnMenu.classList.remove("show");
        closeCombo();
      });

      window.addEventListener("focus", () => {
        pullFromGitHubIfClean();
      });

      window.addEventListener("online", () => {
        pullFromGitHubIfClean();
      });

      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") {
          pullFromGitHubIfClean();
        }
      });

      const backToTop = document.getElementById("backToTop");
      let topTimer = null;

      window.addEventListener(
        "scroll",
        () => {
          backToTop.classList.toggle(
            "visible",
            window.scrollY > 320
          );

          if (comboContext) closeCombo();
        },
        { passive: true }
      );

      backToTop.addEventListener("click", () => {
        if (topTimer) clearInterval(topTimer);

        topTimer = setInterval(() => {
          const current =
            window.scrollY ||
            document.documentElement.scrollTop;

          if (current <= 0) {
            clearInterval(topTimer);
            topTimer = null;
            window.scrollTo(0, 0);
            return;
          }

          const next = Math.max(
            0,
            current - Math.max(18, current * 0.12)
          );

          window.scrollTo(0, next);
        }, 10);
      });

      populateSyncPanel();

      loadState()
        .then(loadedState => {
          state = loadedState;
          render(false);
          startRemotePolling();

          if (getSyncToken()) {
            updateSaveState("本地已保存 · GitHub 已连接");
            scheduleRemoteSync(500);
          } else if (publicContentLoaded) {
            updateSaveState("已载入公开内容 · 无需 Token");
            setSyncStatus("访客模式：已载入网站公开数据。");
          } else {
            updateSaveState();
          }
        })
        .catch(() => {
          state = cloneDefault();
          render(false);
          updateSaveState();
        });
    })();
  </script>
</body>
</html>
