<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Music</title>
  <style>
    /* 用 unicode-range 强制：汉字/中文标点=宋体；数字/英文=Times New Roman */
    @font-face {
      font-family: "MusicMixed";
      src: local("Times New Roman");
      unicode-range:
        U+0000-024F,
        U+1E00-1EFF,
        U+2000-206F,
        U+20A0-20CF;
    }
    @font-face {
      font-family: "MusicMixed";
      src: local("SimSun"), local("宋体"), local("Songti SC"), local("STSong");
      unicode-range:
        U+2E80-2EFF,
        U+2F00-2FDF,
        U+3000-303F,
        U+31C0-31EF,
        U+3400-4DBF,
        U+4E00-9FFF,
        U+F900-FAFF,
        U+FF00-FFEF;
    }

    :root {
      --bg: #ffffff;
      --text: #000000;
      --muted: #000000;
      --line: #e9e9e7;
      --line-dark: #dadad7;
      --hover: #f7f7f5;
      --header: rgba(255, 255, 255, 0.97);
      --blue: #0067ff;
      --shadow: 0 6px 24px rgba(15, 15, 15, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: auto;
      background: var(--bg);
    }

    body {
      margin: 0;
      color: var(--text);
      background: var(--bg);
      font-family: "MusicMixed", "Times New Roman", SimSun, serif;
      font-size: 14px;
      line-height: 1.45;
    }

    button,
    input,
    select {
      font: inherit;
    }

    .page {
      width: 100%;
      min-height: 100vh;
      padding: 28px 34px 120px;
    }

    .title {
      margin: 0 0 18px;
      font-size: 34px;
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .database {
      width: 100%;
      min-width: 720px;
    }


    #musicTable *,
    #musicTable input,
    #musicTable button,
    #musicTable [contenteditable="true"] {
      font-family: "MusicMixed", "Times New Roman", SimSun, serif !important;
      font-size: inherit !important;
      font-style: normal;
    }

    .toolbar {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 42px;
      padding: 4px 0 8px;
      border-bottom: 1px solid var(--line);
    }

    .toolbar-left,
    .toolbar-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .toolbar-btn,
    .sort-btn,
    .mini-btn {
      appearance: none;
      border: 1px solid transparent;
      border-radius: 6px;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      padding: 6px 9px;
      transition: background .12s ease, border-color .12s ease;
    }

    .toolbar-btn:hover,
    .sort-btn:hover,
    .mini-btn:hover {
      background: var(--hover);
    }

    .sort-btn.active {
      background: #eef5ff;
      color: #000000;
    }

    .save-state {
      color: var(--muted);
      font-size: 12px;
      padding-right: 2px;
      white-space: nowrap;
    }

    .table-shell {
      width: 100%;
      overflow-x: auto;
      border-bottom: 1px solid var(--line);
    }

    table {
      width: 100%;
      min-width: max-content;
      border-collapse: separate;
      border-spacing: 0;
      table-layout: fixed;
    }

    th,
    td {
      font-size: 15px;
      font-family: "MusicMixed", "Times New Roman", SimSun, serif !important;
      width: 210px;
      min-width: 120px;
      max-width: 440px;
      height: 39px;
      padding: 7px 10px;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      vertical-align: top;
      text-align: left;
      background: #fff;
      overflow-wrap: anywhere;
    }

    th:first-child,
    td:first-child {
      border-left: 1px solid var(--line);
    }

    thead th {
      position: sticky;
      top: 0;
      z-index: 20;
      height: 38px;
      color: var(--muted);
      background: var(--header);
      backdrop-filter: blur(8px);
      font-weight: 700;
      box-shadow: 0 1px 0 var(--line);
    }

    th .header-inner {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      min-width: 0;
    }

    .header-name {
      flex: 1;
      min-width: 40px;
      outline: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: text;
    }

    .header-name:focus,
    td[contenteditable="true"]:focus {
      outline: 2px solid rgba(0, 103, 255, 0.28);
      outline-offset: -2px;
      background: #fff;
    }

    .sort-mark {
      color: #000000;
      font-size: 12px;
      min-width: 12px;
      text-align: center;
    }

    .col-menu-btn {
      flex: 0 0 auto;
      width: 22px;
      height: 22px;
      padding: 0;
      border-radius: 5px;
      border: 0;
      background: transparent;
      color: #000000;
      cursor: pointer;
      opacity: 0;
    }

    th:hover .col-menu-btn,
    .col-menu-btn:focus {
      opacity: 1;
    }

    .col-menu-btn:hover {
      background: var(--hover);
      color: var(--text);
    }

    tbody tr:hover td {
      background: #fbfbfa;
    }

    td {
      outline: none;
      cursor: text;
    }


    body.resizing-columns {
      cursor: col-resize !important;
      user-select: none !important;
    }

    th[data-column-id],
    td[data-column-id] {
      position: relative;
    }

    .resize-handle {
      position: absolute;
      top: 0;
      right: -3px;
      z-index: 35;
      width: 7px;
      height: 100%;
      cursor: col-resize;
      background: transparent;
      touch-action: none;
    }

    .resize-handle::after {
      content: "";
      position: absolute;
      top: 5px;
      bottom: 5px;
      left: 3px;
      width: 1px;
      background: transparent;
    }

    th:hover .resize-handle::after,
    body.resizing-columns .resize-handle::after {
      background: #b7b7b3;
    }

    .select-cell {
      padding: 4px 7px;
      cursor: text;
    }


    .multi-select-cell {
      padding: 4px 7px;
      vertical-align: top;
      cursor: text;
    }

    .multi-wrap {
      display: flex;
      flex-direction: column;
      gap: 0;
      width: 100%;
      min-height: 29px;
    }

    .multi-value-row {
      display: block;
      width: 100%;
      min-height: 29px;
      border-radius: 4px;
    }

    .multi-value-text {
      width: 100%;
      min-width: 0;
      padding: 4px 5px;
      color: #000000;
      white-space: normal;
      overflow-wrap: anywhere;
    }

    .multi-entry {
      position: relative;
      width: 100%;
      min-height: 29px;
      display: flex;
      align-items: flex-start;
    }

    td.nav-cell {
      outline: 2px solid #0067ff;
      outline-offset: -2px;
      background: #ffffff !important;
      cursor: default;
    }

    .combo-wrap {
      position: relative;
      width: 100%;
      min-height: 29px;
      display: flex;
      align-items: center;
    }

    .combo-input {
      width: 100%;
      height: 29px;
      padding: 4px 26px 4px 5px;
      border: 1px solid transparent;
      border-radius: 5px;
      outline: none;
      background: transparent;
      color: var(--text);
      font: inherit;
    }

    .combo-input:focus {
      border-color: rgba(0, 103, 255, 0.35);
      background: #fff;
      box-shadow: 0 0 0 1px rgba(0, 103, 255, 0.12);
    }

    .combo-arrow {
      position: absolute;
      right: 3px;
      top: 50%;
      transform: translateY(-50%);
      width: 21px;
      height: 21px;
      padding: 0;
      border: 0;
      border-radius: 4px;
      background: transparent;
      color: #000000;
      cursor: pointer;
      line-height: 21px;
      text-align: center;
    }

    .combo-arrow:hover {
      background: var(--hover);
      color: var(--text);
    }

    .combo-menu {
      position: fixed;
      z-index: 140;
      display: none;
      max-height: min(60vh, 520px);
      overflow-y: auto;
      padding: 5px;
      border: 1px solid var(--line-dark);
      border-radius: 9px;
      background: #fff;
      box-shadow: var(--shadow);
    }

    .combo-menu.show {
      display: block;
    }

    .combo-option-row {
      display: flex;
      align-items: center;
      gap: 4px;
      width: 100%;
      border-radius: 5px;
    }

    .combo-option {
      flex: 1 1 auto;
      min-width: 0;
      min-height: 31px;
      padding: 6px 8px;
      border: 0;
      border-radius: 5px;
      background: transparent;
      color: var(--text);
      text-align: left;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .combo-option:hover,
    .combo-option.active {
      background: var(--hover);
    }

    .combo-delete-option {
      flex: 0 0 28px;
      width: 28px;
      height: 28px;
      padding: 0;
      border: 0;
      border-radius: 5px;
      background: transparent;
      color: #000000;
      cursor: pointer;
      font-size: 17px;
      line-height: 28px;
      text-align: center;
    }

    .combo-delete-option:hover {
      background: #f3f3f1;
    }

    .combo-empty {
      padding: 7px 8px;
      color: var(--muted);
      font-size: 12px;
    }

    .row-number,
    .row-number-head {
      width: 54px !important;
      min-width: 54px !important;
      max-width: 54px !important;
      text-align: center;
      color: #000000;
      user-select: none;
    }

    .row-number {
      cursor: default;
      font-variant-numeric: tabular-nums;
    }

    .row-actions {
      position: sticky;
      right: 0;
      z-index: 8;
      width: 48px !important;
      min-width: 48px !important;
      max-width: 48px !important;
      text-align: center;
      padding: 0;
      background: #fff;
    }

    thead .row-actions {
      z-index: 25;
      background: var(--header);
    }

    tbody tr:hover .row-actions {
      background: #fbfbfa;
    }

    .delete-row {
      border: 0;
      background: transparent;
      color: #000000;
      cursor: pointer;
      width: 28px;
      height: 28px;
      border-radius: 5px;
      font-size: 17px;
      line-height: 1;
    }

    .delete-row:hover {
      color: #c73737;
      background: #fff0f0;
    }

    .new-row {
      width: 100%;
      border: 0;
      border-left: 1px solid var(--line);
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      background: #fff;
      color: var(--muted);
      text-align: left;
      padding: 10px 12px;
      cursor: pointer;
    }

    .new-row:hover {
      background: var(--hover);
      color: var(--text);
    }


    .sync-panel {
      position: fixed;
      z-index: 180;
      top: 74px;
      right: 34px;
      width: min(420px, calc(100vw - 28px));
      padding: 14px;
      border: 1px solid var(--line-dark);
      border-radius: 10px;
      background: #ffffff;
      box-shadow: var(--shadow);
      display: none;
    }

    .sync-panel.show {
      display: block;
    }

    .sync-panel-title {
      margin: 0 0 10px;
      font-weight: 700;
      font-size: 15px;
    }

    .sync-field {
      display: grid;
      grid-template-columns: 78px 1fr;
      gap: 8px;
      align-items: center;
      margin: 8px 0;
    }

    .sync-field label {
      font-weight: 700;
    }

    .sync-field input {
      width: 100%;
      min-width: 0;
      padding: 7px 8px;
      border: 1px solid var(--line-dark);
      border-radius: 6px;
      background: #ffffff;
      color: #000000;
      outline: none;
    }

    .sync-field input:focus {
      border-color: #0067ff;
    }

    #syncToken {
      -webkit-text-security: disc;
    }

    .sync-remember {
      display: flex;
      align-items: center;
      gap: 7px;
      margin: 7px 0 0 86px;
      font-size: 13px;
      user-select: none;
    }

    .sync-remember input {
      width: 15px;
      height: 15px;
      margin: 0;
    }

    .sync-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--line);
    }

    .sync-actions button {
      border: 0;
      border-radius: 6px;
      background: var(--hover);
      color: #000000;
      cursor: pointer;
      padding: 7px 10px;
    }

    .sync-actions button:hover {
      background: #eeeeeb;
    }

    .sync-status {
      margin-top: 9px;
      font-size: 12px;
      line-height: 1.5;
      color: #000000;
    }

    .sync-note {
      margin-top: 8px;
      font-size: 12px;
      line-height: 1.5;
      color: #000000;
    }

    @media (max-width: 760px) {
      .sync-panel {
        top: 68px;
        right: 14px;
        left: 14px;
        width: auto;
      }
    }

    .sort-panel,
    .column-menu {
      position: fixed;
      z-index: 100;
      min-width: 330px;
      padding: 10px;
      border: 1px solid var(--line-dark);
      border-radius: 10px;
      background: #fff;
      box-shadow: var(--shadow);
      display: none;
    }

    .sort-panel.show,
    .column-menu.show {
      display: block;
    }

    .sort-panel {
      top: 78px;
      right: 34px;
    }

    .sort-title {
      font-weight: 600;
      margin-bottom: 8px;
    }

    .sort-rule {
      display: grid;
      grid-template-columns: 1fr 104px 32px;
      gap: 6px;
      margin: 6px 0;
      align-items: center;
    }

    .sort-rule select {
      min-width: 0;
      border: 1px solid var(--line-dark);
      border-radius: 6px;
      background: #fff;
      padding: 6px 8px;
      color: var(--text);
      outline: none;
    }

    .sort-rule button,
    .sort-footer button,
    .column-menu button {
      border: 0;
      border-radius: 6px;
      background: transparent;
      cursor: pointer;
      color: var(--text);
      padding: 7px 8px;
    }

    .sort-rule button:hover,
    .sort-footer button:hover,
    .column-menu button:hover {
      background: var(--hover);
    }

    .sort-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid var(--line);
    }

    .column-menu {
      min-width: 180px;
      padding: 6px;
    }

    .column-menu button {
      width: 100%;
      text-align: left;
    }

    .danger {
      color: #c73737 !important;
    }

    #backToTop {
      position: fixed;
      right: 22px;
      top: 65vh;
      z-index: 90;
      width: 28px;
      height: 28px;
      border: 0;
      border-radius: 50%;
      background: #0067ff;
      color: transparent;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 103, 255, .28);
      opacity: 0;
      pointer-events: none;
      transition: opacity .15s ease, transform .15s ease;
    }

    #backToTop::before,
    #backToTop::after {
      content: "";
      position: absolute;
      top: 10px;
      width: 8px;
      height: 2px;
      background: #fff;
      border-radius: 2px;
    }

    #backToTop::before {
      left: 7px;
      transform: rotate(-45deg);
    }

    #backToTop::after {
      right: 7px;
      transform: rotate(45deg);
    }

    #backToTop.visible {
      opacity: 1;
      pointer-events: auto;
    }

    #backToTop:hover {
      transform: scale(1.08);
    }

    .hint {
      color: var(--muted);
      font-size: 12px;
    }

    @media (max-width: 760px) {
      .page {
        padding: 20px 14px 100px;
      }

      .title {
        font-size: 30px;
      }

      .sort-panel {
        top: 72px;
        right: 14px;
        left: 14px;
        min-width: auto;
      }

      #backToTop {
        right: 12px;
      }
    }


    /* 只修复交互缺陷，不改变原表格布局。 */
    .multi-wrap { position: relative; }
    .multi-entry {
      position: absolute;
      top: 0;
      right: 0;
      left: 0;
      z-index: 3;
      background: #fff;
    }
    .combo-arrow {
      opacity: 0;
      pointer-events: none;
      transition: opacity 100ms ease;
    }
    .select-cell:hover .combo-arrow,
    .multi-select-cell:hover .combo-arrow,
    .combo-wrap:focus-within .combo-arrow,
    .multi-entry:focus-within .combo-arrow {
      opacity: 1;
      pointer-events: auto;
    }
    body.visitor #addRowTop,
    body.visitor #addRowBottom,
    body.visitor #addColumn,
    body.visitor .delete-row,
    body.visitor .col-menu-btn,
    body.visitor .resize-handle {
      display: none !important;
    }
    body.visitor .combo-input { pointer-events: none; }

  </style>
</head>
<body>
  <main class="page">
    <h1 class="title">Music</h1>

    <section class="database" aria-label="Music database">
      <div class="toolbar">
        <div class="toolbar-left">
          <button class="toolbar-btn" id="addRowTop" type="button">＋ 新增行</button>
          <button class="toolbar-btn" id="addColumn" type="button">＋ 新增列</button>
          <button class="sort-btn" id="sortToggle" type="button">⇅ 排序</button>
        </div>
        <div class="toolbar-right">
          <button class="toolbar-btn" id="syncSettings" type="button">GitHub 同步</button>
          <span class="save-state" id="saveState">本地已保存 · GitHub 未连接</span>
        </div>
      </div>

      <div class="table-shell">
        <table id="musicTable">
          <thead id="tableHead"></thead>
          <tbody id="tableBody"></tbody>
        </table>
        <button class="new-row" id="addRowBottom" type="button">＋ 新建</button>
      </div>
    </section>
  </main>


  <div class="sync-panel" id="syncPanel" role="dialog" aria-label="GitHub 同步设置">
    <div class="sync-panel-title">GitHub 同步</div>

    <div class="sync-field">
      <label for="syncOwner">Owner</label>
      <input id="syncOwner" type="text" autocomplete="off" spellcheck="false" />
    </div>

    <div class="sync-field">
      <label for="syncRepo">仓库</label>
      <input id="syncRepo" type="text" autocomplete="off" spellcheck="false" />
    </div>

    <div class="sync-field">
      <label for="syncBranch">分支</label>
      <input id="syncBranch" type="text" value="main" autocomplete="off" spellcheck="false" />
    </div>

    <div class="sync-field">
      <label for="syncToken">Token</label>
      <input id="syncToken" type="password" autocomplete="current-password" spellcheck="false"
             placeholder="Fine-grained token（Contents: Read and write）" />
    </div>

    <label class="sync-remember" for="rememberSyncToken">
      <input id="rememberSyncToken" type="checkbox" />
      <span>在此设备保存 Token（始终以黑点显示）</span>
    </label>

    <div class="sync-actions">
      <button type="button" id="connectSync">进入编辑终端</button>
      <button type="button" id="syncNow">手动发布</button>
      <button type="button" id="disconnectSync">断开</button>
    </div>

    <div class="sync-status" id="syncStatus">尚未连接。</div>
    <div class="sync-note">
      访客无需 Token，只读取已发布的 music-data.json。
      编辑终端的内容只保存在本机，不会自动刷新、合并或被远端覆盖。
      只有点击“手动发布”才会把当前完整内容发布到 GitHub。
      Token 输入框始终以黑点显示，Token 不会写入网页数据。
    </div>
  </div>

  <div class="sort-panel" id="sortPanel" role="dialog" aria-label="排序设置">
    <div class="sort-title">排序标准</div>
    <div class="hint">可添加多条规则，按从上到下的优先级排序。</div>
    <div id="sortRules"></div>
    <div class="sort-footer">
      <button type="button" id="addSortRule">＋ 添加排序</button>
      <button type="button" id="clearSort">清除排序</button>
    </div>
  </div>

  <div class="combo-menu" id="comboMenu" role="listbox" aria-label="下拉选项"></div>

  <div class="column-menu" id="columnMenu">
    <button type="button" id="sortAsc">升序排列</button>
    <button type="button" id="sortDesc">降序排列</button>
    <button type="button" id="renameColumn">重命名</button>
    <button type="button" id="deleteColumn" class="danger">删除该列</button>
  </div>

  <button id="backToTop" type="button" aria-label="回到顶部" title="回到顶部"></button>

  <script>
    (() => {
      "use strict";

      const STORAGE_KEY = "music-authoritative-draft-v1";
      const LEGACY_STORAGE_KEY = "music-notion-database-v1";
      const SYNC_CONFIG_KEY = "music-github-sync-config-v1";
      const SYNC_TOKEN_KEY = "music-github-sync-token-v1";
      const SYNC_PERSISTED_TOKEN_KEY = "music-github-sync-token-persisted-v1";
      const REMOTE_DATA_PATH = "music-data.json";
      const MULTI_IDS = new Set(["artist", "lyricist", "composer"]);
      const MULTI_NAMES = new Set(["歌手", "作词", "作曲"]);
      const SINGLE_SELECT_IDS = new Set(["album"]);
      const SINGLE_SELECT_NAMES = new Set(["专辑"]);

      const emptyState = {
        columns: [
          { id: "title", name: "曲名", width: 240 },
          { id: "artist", name: "歌手", width: 210 },
          { id: "lyricist", name: "作词", width: 210 },
          { id: "composer", name: "作曲", width: 210 },
          { id: "album", name: "专辑", width: 220 },
          { id: "year", name: "年份", width: 120 },
          { id: "rating", name: "评分", width: 120 }
        ],
        rows: [],
        sortRules: [],
        selectOptions: { artist: [], lyricist: [], composer: [], album: [] }
      };

      const tableHead = document.getElementById("tableHead");
      const tableBody = document.getElementById("tableBody");
      const saveState = document.getElementById("saveState");
      const sortToggle = document.getElementById("sortToggle");
      const sortPanel = document.getElementById("sortPanel");
      const comboMenu = document.getElementById("comboMenu");
      const columnMenu = document.getElementById("columnMenu");
      const syncPanel = document.getElementById("syncPanel");
      const syncOwner = document.getElementById("syncOwner");
      const syncRepo = document.getElementById("syncRepo");
      const syncBranch = document.getElementById("syncBranch");
      const syncToken = document.getElementById("syncToken");
      const rememberSyncToken = document.getElementById("rememberSyncToken");
      const syncStatus = document.getElementById("syncStatus");

      let state = structuredClone(emptyState);
      let mode = "visitor";
      let activeColumnId = null;
      let comboContext = null;
      let navCell = null;
      let memorySyncToken = "";
      let publishing = false;

      function uuid() {
        return crypto.randomUUID ? crypto.randomUUID() : "row_" + Date.now() + "_" + Math.random().toString(36).slice(2);
      }

      function safeJson(raw) {
        try { return raw ? JSON.parse(raw) : null; } catch { return null; }
      }

      function normalizeMultiValue(value) {
        const source = Array.isArray(value) ? value : String(value ?? "").split(/\n|、|，|,/);
        return uniqueValues(source.map(item => String(item).trim()).filter(Boolean));
      }

      function uniqueValues(values) {
        const seen = new Set();
        return values.filter(value => {
          const key = String(value).toLocaleLowerCase();
          if (seen.has(key)) return false;
          seen.add(key);
          return true;
        });
      }

      function normalizeIncoming(raw) {
        const source = raw && typeof raw === "object" && raw.state ? raw.state : raw;
        const base = source && typeof source === "object" ? source : {};
        const columns = Array.isArray(base.columns) && base.columns.length
          ? base.columns.map((col, index) => ({
              id: String(col?.id || "col_" + index),
              name: String(col?.name || "未命名"),
              width: Math.max(80, Number(col?.width) || 210)
            }))
          : structuredClone(emptyState.columns);
        const ids = new Set(columns.map(col => col.id));
        const rows = Array.isArray(base.rows) ? base.rows.map((row, index) => {
          const cells = {};
          const incoming = row?.cells && typeof row.cells === "object" ? row.cells : {};
          columns.forEach(col => {
            const value = incoming[col.id];
            cells[col.id] = MULTI_IDS.has(col.id) || MULTI_NAMES.has(col.name)
              ? normalizeMultiValue(value)
              : Array.isArray(value) ? String(value[0] ?? "") : String(value ?? "");
          });
          return { id: String(row?.id || "row_" + index + "_" + uuid()), cells };
        }) : [];
        const sortRules = Array.isArray(base.sortRules)
          ? base.sortRules.filter(rule => ids.has(rule?.columnId)).map(rule => ({
              id: String(rule.id || uuid()), columnId: String(rule.columnId), direction: rule.direction === "desc" ? "desc" : "asc"
            }))
          : [];
        const selectOptions = {};
        const incomingOptions = base.selectOptions && typeof base.selectOptions === "object" ? base.selectOptions : {};
        columns.forEach(col => {
          if (MULTI_IDS.has(col.id) || MULTI_NAMES.has(col.name) || SINGLE_SELECT_IDS.has(col.id) || SINGLE_SELECT_NAMES.has(col.name)) {
            selectOptions[col.id] = uniqueValues(Array.isArray(incomingOptions[col.id]) ? incomingOptions[col.id].map(String) : []);
          }
        });
        return { columns, rows, sortRules, selectOptions };
      }

      function insertPlainTextAtCursor(text) {
        const selection = window.getSelection();
        if (!selection?.rangeCount) return;
        selection.deleteFromDocument();
        const range = selection.getRangeAt(0);
        const node = document.createTextNode(text);
        range.insertNode(node);
        range.setStartAfter(node);
        range.collapse(true);
        selection.removeAllRanges();
        selection.addRange(range);
      }

      function handlePlainTextPaste(event) {
        event.preventDefault();
        const text = (event.clipboardData?.getData("text/plain") || "").replace(/\r\n?/g, "\n");
        insertPlainTextAtCursor(text);
        event.currentTarget.dispatchEvent(new Event("input", { bubbles: true }));
      }

      function setSyncStatus(message) { syncStatus.textContent = message; }

      function readConfig() {
        const value = safeJson(localStorage.getItem(SYNC_CONFIG_KEY));
        return value && value.owner && value.repo
          ? { owner: String(value.owner), repo: String(value.repo), branch: String(value.branch || "main") }
          : null;
      }

      function currentFormConfig() {
        return { owner: syncOwner.value.trim(), repo: syncRepo.value.trim(), branch: syncBranch.value.trim() || "main" };
      }

      function saveConfig(config) { localStorage.setItem(SYNC_CONFIG_KEY, JSON.stringify(config)); }

      function getSyncToken() {
        if (memorySyncToken) return memorySyncToken;
        try { memorySyncToken = sessionStorage.getItem(SYNC_TOKEN_KEY) || localStorage.getItem(SYNC_PERSISTED_TOKEN_KEY) || ""; } catch {}
        return memorySyncToken;
      }

      function storeToken(token) {
        memorySyncToken = token;
        try {
          sessionStorage.setItem(SYNC_TOKEN_KEY, token);
          if (rememberSyncToken.checked) localStorage.setItem(SYNC_PERSISTED_TOKEN_KEY, token);
          else localStorage.removeItem(SYNC_PERSISTED_TOKEN_KEY);
        } catch {}
      }

      function clearToken() {
        memorySyncToken = "";
        try { sessionStorage.removeItem(SYNC_TOKEN_KEY); localStorage.removeItem(SYNC_PERSISTED_TOKEN_KEY); } catch {}
      }

      function populateSyncPanel() {
        const config = readConfig();
        if (config) { syncOwner.value = config.owner; syncRepo.value = config.repo; syncBranch.value = config.branch; }
        syncToken.value = getSyncToken();
        rememberSyncToken.checked = Boolean(localStorage.getItem(SYNC_PERSISTED_TOKEN_KEY));
      }

      function inferPublicConfig() {
        const saved = readConfig();
        if (saved) return saved;
        const parts = location.pathname.split("/").filter(Boolean);
        if (location.hostname.endsWith(".github.io") && parts[0]) {
          return { owner: location.hostname.split(".")[0], repo: parts[0], branch: "main" };
        }
        return null;
      }

      function apiUrl(config) {
        const path = REMOTE_DATA_PATH.split("/").map(encodeURIComponent).join("/");
        return `https://api.github.com/repos/${encodeURIComponent(config.owner)}/${encodeURIComponent(config.repo)}/contents/${path}?ref=${encodeURIComponent(config.branch)}`;
      }

      function decodeBase64(value) {
        const binary = atob(String(value).replace(/\s/g, ""));
        const bytes = Uint8Array.from(binary, char => char.charCodeAt(0));
        return new TextDecoder().decode(bytes);
      }

      function encodeBase64(value) {
        const bytes = new TextEncoder().encode(value);
        let binary = "";
        for (let offset = 0; offset < bytes.length; offset += 0x8000) {
          binary += String.fromCharCode(...bytes.subarray(offset, offset + 0x8000));
        }
        return btoa(binary);
      }

      async function readRemote(config, token = "") {
        const headers = { Accept: "application/vnd.github+json" };
        if (token) headers.Authorization = `Bearer ${token}`;
        const response = await fetch(apiUrl(config), { headers, cache: "no-store" });
        if (response.status === 404) return null;
        if (!response.ok) throw new Error(`GitHub 返回 ${response.status}`);
        const file = await response.json();
        return { sha: file.sha, state: normalizeIncoming(safeJson(decodeBase64(file.content))) };
      }

      function loadDraft() {
        const current = safeJson(localStorage.getItem(STORAGE_KEY));
        if (current) return normalizeIncoming(current);
        const legacy = safeJson(localStorage.getItem(LEGACY_STORAGE_KEY));
        return legacy ? normalizeIncoming(legacy) : null;
      }

      function scheduleSave() {
        if (mode !== "editor") return;
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
          saveState.textContent = `本机草稿已保存 · ${state.rows.length} 行 · 未发布`;
        } catch {
          saveState.textContent = "本机草稿保存失败";
        }
      }

      function applyModeRestrictions() {
        document.body.classList.toggle("visitor", mode !== "editor");
        document.querySelectorAll("[contenteditable]").forEach(el => {
          if (mode !== "editor") el.contentEditable = "false";
        });
        document.querySelectorAll(".combo-input").forEach(input => { input.readOnly = mode !== "editor"; });
      }

      async function loadVisitorState() {
        mode = "visitor";
        let published = null;
        try {
          const response = await fetch(REMOTE_DATA_PATH, { cache: "no-store" });
          if (response.ok) published = normalizeIncoming(await response.json());
        } catch {}
        if (!published) {
          const config = inferPublicConfig();
          if (config) {
            try { published = (await readRemote(config))?.state || null; } catch {}
          }
        }
        state = published || structuredClone(emptyState);
        render(false);
        saveState.textContent = published ? `公开内容 · ${state.rows.length} 行` : "暂无已发布内容";
        setSyncStatus("访客模式：只读已发布内容。" );
      }

      async function enterEditor(config, token) {
        if (!config.owner || !config.repo || !token) throw new Error("请填写 Owner、仓库和 Token。" );
        const remote = await readRemote(config, token);
        saveConfig(config);
        storeToken(token);
        mode = "editor";
        state = loadDraft() || remote?.state || structuredClone(emptyState);
        render(false);
        scheduleSave();
        setSyncStatus("已进入编辑终端。远端内容不会自动覆盖本机草稿。" );
      }

      async function publishSnapshot() {
        if (publishing) return;
        const config = currentFormConfig();
        const token = syncToken.value.trim() || getSyncToken();
        if (!config.owner || !config.repo || !token) { setSyncStatus("请先填写 Owner、仓库和 Token。" ); return; }
        publishing = true;
        setSyncStatus("正在发布当前完整内容…");
        try {
          saveConfig(config);
          storeToken(token);
          const latest = await readRemote(config, token);
          const snapshot = normalizeIncoming(structuredClone(state));
          const payload = { version: 1, publishedAt: new Date().toISOString(), state: snapshot };
          const body = { message: `Publish music data (${snapshot.rows.length} rows)`, content: encodeBase64(JSON.stringify(payload, null, 2)), branch: config.branch };
          if (latest?.sha) body.sha = latest.sha;
          const response = await fetch(apiUrl(config).replace(/\?ref=.*$/, ""), {
            method: "PUT",
            headers: { Accept: "application/vnd.github+json", Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
            body: JSON.stringify(body)
          });
          if (!response.ok) throw new Error(`GitHub 返回 ${response.status}`);
          saveState.textContent = `本机草稿已保存 · ${snapshot.rows.length} 行 · 已发布`;
          setSyncStatus(`发布成功：${snapshot.rows.length} 行。`);
        } catch (error) {
          setSyncStatus(`发布失败：${error.message}。本机草稿未被修改。`);
        } finally { publishing = false; }
      }
      function makeColumnId() {
        return "col_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 7);
      }

      function isMultiColumn(col) {
        return MULTI_IDS.has(col.id) || MULTI_NAMES.has((col.name || "").trim());
      }

      function isSingleSelectColumn(col) {
        return SINGLE_SELECT_IDS.has(col.id) ||
          SINGLE_SELECT_NAMES.has((col.name || "").trim());
      }

      function isSelectColumn(col) {
        return isMultiColumn(col) || isSingleSelectColumn(col);
      }

      function getDefaultWidth(col) {
        if (col.id === "title") return 240;
        if (col.id === "year" || col.id === "rating") return 120;
        return 210;
      }

      function normalizeState() {
        state.selectOptions =
          state.selectOptions && typeof state.selectOptions === "object"
            ? state.selectOptions
            : {};

        const validIds = new Set(state.columns.map(col => col.id));

        state.columns.forEach(col => {
          const width = Number(col.width);
          col.width = Number.isFinite(width)
            ? Math.max(80, Math.round(width))
            : getDefaultWidth(col);

          if (isSelectColumn(col) && !Array.isArray(state.selectOptions[col.id])) {
            state.selectOptions[col.id] = [];
          }
        });

        state.rows.forEach(row => {
          row.cells = row.cells || {};

          state.columns.forEach(col => {
            if (!(col.id in row.cells)) {
              row.cells[col.id] = isMultiColumn(col) ? [] : "";
            }

            if (isMultiColumn(col)) {
              row.cells[col.id] = normalizeMultiValue(row.cells[col.id]);
            } else if (Array.isArray(row.cells[col.id])) {
              row.cells[col.id] = row.cells[col.id][0] ?? "";
            }
          });

          Object.keys(row.cells).forEach(id => {
            if (!validIds.has(id)) delete row.cells[id];
          });
        });

        state.sortRules = state.sortRules.filter(rule => validIds.has(rule.columnId));
      }

      function render(persist = true) {
        normalizeState();
        closeCombo();
        renderHead();
        renderBody();
        renderSortRules();
        updateSortButton();
        applyModeRestrictions();
        if (persist) scheduleSave();
      }

      function setCellWidth(el, col) {
        const width = Math.max(80, Number(col.width) || 210);
        el.style.width = width + "px";
        el.style.minWidth = width + "px";
        el.style.maxWidth = width + "px";
      }

      function updateColumnWidth(col) {
        document
          .querySelectorAll(`[data-column-id="${CSS.escape(col.id)}"]`)
          .forEach(el => setCellWidth(el, col));
      }

      function beginColumnResize(event, col, th) {
        event.preventDefault();
        event.stopPropagation();

        const startX = event.clientX;
        const startWidth = th.getBoundingClientRect().width;
        document.body.classList.add("resizing-columns");

        const onMove = moveEvent => {
          col.width = Math.max(
            80,
            Math.round(startWidth + moveEvent.clientX - startX)
          );
          updateColumnWidth(col);
        };

        const onUp = () => {
          document.body.classList.remove("resizing-columns");
          document.removeEventListener("mousemove", onMove);
          document.removeEventListener("mouseup", onUp);
          scheduleSave();
        };

        document.addEventListener("mousemove", onMove);
        document.addEventListener("mouseup", onUp);
      }

      function renderHead() {
        const tr = document.createElement("tr");

        const numberHead = document.createElement("th");
        numberHead.className = "row-number-head";
        numberHead.textContent = "#";
        tr.appendChild(numberHead);

        state.columns.forEach(col => {
          const th = document.createElement("th");
          th.dataset.columnId = col.id;
          setCellWidth(th, col);

          const wrap = document.createElement("div");
          wrap.className = "header-inner";

          const name = document.createElement("div");
          name.className = "header-name";
          name.contentEditable = "true";
          name.spellcheck = false;
          name.textContent = col.name;
          name.title = "点击编辑列名";

          name.addEventListener("paste", handlePlainTextPaste);

          name.addEventListener("input", () => {
            col.name = name.textContent.trim() || "未命名";

            if (isSelectColumn(col) && !Array.isArray(state.selectOptions[col.id])) {
              state.selectOptions[col.id] = [];
            }

            renderSortRules();
            scheduleSave();
          });

          name.addEventListener("keydown", event => {
            if (event.key === "Enter") {
              event.preventDefault();
              name.blur();
            }
          });

          name.addEventListener("blur", () => {
            if (!name.textContent.trim()) {
              name.textContent = "未命名";
              col.name = "未命名";
            }
            renderSortRules();
            scheduleSave();
          });

          const mark = document.createElement("span");
          mark.className = "sort-mark";

          const sortIndex = state.sortRules.findIndex(rule => rule.columnId === col.id);
          if (sortIndex !== -1) {
            const rule = state.sortRules[sortIndex];
            mark.textContent = rule.direction === "asc" ? "↑" : "↓";
          }

          const menu = document.createElement("button");
          menu.className = "col-menu-btn";
          menu.type = "button";
          menu.textContent = "•••";
          menu.title = "列选项";

          menu.addEventListener("click", event => {
            event.stopPropagation();
            activeColumnId = col.id;
            openColumnMenu(menu);
          });

          const resize = document.createElement("div");
          resize.className = "resize-handle";
          resize.title = "拖动调整列宽";
          resize.addEventListener("mousedown", event =>
            beginColumnResize(event, col, th)
          );

          wrap.append(name, mark, menu);
          th.append(wrap, resize);
          tr.appendChild(th);
        });

        const actionHead = document.createElement("th");
        actionHead.className = "row-actions";
        tr.appendChild(actionHead);

        tableHead.replaceChildren(tr);
      }

      function handleTabAtEnd(event, tr, editor) {
        if (event.key !== "Tab" || event.shiftKey) return false;

        const editors = Array.from(
          tr.querySelectorAll('[data-cell-editor="true"]')
        );

        if (editor !== editors[editors.length - 1]) return false;

        event.preventDefault();
        const newRow = addRow(false);
        render();

        requestAnimationFrame(() => focusFirstEditor(newRow.id));
        return true;
      }

      function focusFirstEditor(rowId) {
        const tr = document.querySelector(
          `tr[data-row-id="${CSS.escape(rowId)}"]`
        );
        const editor = tr?.querySelector('[data-cell-editor="true"]');

        if (!editor) return;

        clearNavigationMode();
        editor.focus();

        if (editor.isContentEditable) {
          placeCaretAtEnd(editor);
        }
      }

      function placeCaretAtEnd(el) {
        const range = document.createRange();
        range.selectNodeContents(el);
        range.collapse(false);

        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
      }

      function clearNavigationMode() {
        if (!navCell) return;

        if (navCell.dataset.editorKind === "text") {
          navCell.contentEditable = "true";
        }

        navCell.classList.remove("nav-cell");
        navCell = null;
      }

      function enterNavigationMode(td) {
        if (!td) return;

        closeCombo();

        if (navCell && navCell !== td) {
          clearNavigationMode();
        }

        navCell = td;
        td.classList.add("nav-cell");
        td.tabIndex = 0;

        if (td.dataset.editorKind === "text") {
          td.contentEditable = "false";
        } else {
          const input = td.querySelector(".combo-input");
          if (input && document.activeElement === input) input.blur();
        }

        td.focus({ preventScroll: true });
        td.scrollIntoView({ block: "nearest", inline: "nearest" });
      }

      function moveNavigationCell(td, key) {
        const rows = Array.from(
          tableBody.querySelectorAll("tr[data-row-id]")
        );
        const tr = td.closest("tr[data-row-id]");

        if (!tr) return;

        const rowIndex = rows.indexOf(tr);
        const colIndex = state.columns.findIndex(
          col => col.id === td.dataset.columnId
        );

        if (rowIndex < 0 || colIndex < 0) return;

        let nextRow = rowIndex;
        let nextCol = colIndex;

        if (key === "ArrowUp") nextRow--;
        if (key === "ArrowDown") nextRow++;
        if (key === "ArrowLeft") nextCol--;
        if (key === "ArrowRight") nextCol++;

        nextRow = Math.max(0, Math.min(rows.length - 1, nextRow));
        nextCol = Math.max(0, Math.min(state.columns.length - 1, nextCol));

        const nextColumnId = state.columns[nextCol].id;
        const target = rows[nextRow].querySelector(
          `td[data-column-id="${CSS.escape(nextColumnId)}"]`
        );

        if (target) enterNavigationMode(target);
      }

      function renderBody() {
        const rows = getSortedRows();
        const fragment = document.createDocumentFragment();

        rows.forEach((row, visibleIndex) => {
          const tr = document.createElement("tr");
          tr.dataset.rowId = row.id;

          const num = document.createElement("td");
          num.className = "row-number";
          num.textContent = String(visibleIndex + 1);
          tr.appendChild(num);

          state.columns.forEach(col => {
            const td = document.createElement("td");
            td.dataset.columnId = col.id;
            td.tabIndex = -1;
            setCellWidth(td, col);

            if (isMultiColumn(col)) {
              renderMultiCell(td, tr, row, col);
            } else if (isSingleSelectColumn(col)) {
              renderSingleSelectCell(td, tr, row, col);
            } else {
              renderTextCell(td, tr, row, col);
            }

            tr.appendChild(td);
          });

          const actions = document.createElement("td");
          actions.className = "row-actions";

          const del = document.createElement("button");
          del.type = "button";
          del.className = "delete-row";
          del.title = "删除本行";
          del.textContent = "×";

          del.addEventListener("click", () => {
            state.rows = state.rows.filter(item => item.id !== row.id);
            scheduleSave();
            render(false);
          });

          actions.appendChild(del);
          tr.appendChild(actions);
          fragment.appendChild(tr);
        });

        tableBody.replaceChildren(fragment);
      }

      function renderTextCell(td, tr, row, col) {
        td.dataset.editorKind = "text";
        td.contentEditable = "true";
        td.spellcheck = false;
        td.dataset.cellEditor = "true";
        td.textContent = row.cells[col.id] ?? "";

        td.addEventListener("paste", handlePlainTextPaste);

        td.addEventListener("input", () => {
          row.cells[col.id] = td.textContent;
          scheduleSave();
        });

        td.addEventListener("keydown", event => {
          if (event.key === "Enter") {
            event.preventDefault();
            row.cells[col.id] = td.textContent;
            scheduleSave();
            enterNavigationMode(td);
            return;
          }

          handleTabAtEnd(event, tr, td);
        });

        td.addEventListener("click", () => {
          if (navCell !== td) return;

          clearNavigationMode();

          requestAnimationFrame(() => {
            td.focus();
            placeCaretAtEnd(td);
          });
        });
      }

      function createComboInput(td, tr, row, col, multi) {
        const entry = document.createElement("div");
        entry.className = multi ? "multi-entry" : "combo-wrap";

        const input = document.createElement("input");
        input.className = "combo-input";
        input.type = "text";
        input.autocomplete = "off";
        input.spellcheck = false;
        input.value = multi ? "" : String(row.cells[col.id] ?? "");
        input.dataset.cellEditor = "true";
        input.setAttribute("role", "combobox");
        input.setAttribute("aria-autocomplete", "list");
        input.setAttribute("aria-expanded", "false");

        const arrow = document.createElement("button");
        arrow.type = "button";
        arrow.className = "combo-arrow";
        arrow.tabIndex = -1;
        arrow.textContent = "▾";
        arrow.title = "显示全部选项";

        input.addEventListener("focus", () => {
          if (navCell === td) clearNavigationMode();
          openCombo(input, row, col, true, false);
        });

        input.addEventListener("paste", event => {
          event.preventDefault();

          const clipboard = event.clipboardData || window.clipboardData;
          const plainText = (clipboard?.getData("text/plain") ?? "")
            .replace(/\r\n?/g, "\n")
            .replace(/\n+/g, " ");

          const start = input.selectionStart ?? input.value.length;
          const end = input.selectionEnd ?? input.value.length;

          input.setRangeText(plainText, start, end, "end");
          input.dispatchEvent(new Event("input", { bubbles: true }));
        });

        input.addEventListener("input", () => {
          if (!multi) {
            row.cells[col.id] = input.value;
            scheduleSave();
          }

          openCombo(input, row, col, true, false);
        });

        input.addEventListener("keydown", event => {
          if (event.key === "ArrowDown") {
            event.preventDefault();

            if (!comboContext || comboContext.input !== input) {
              openCombo(input, row, col, true, false);
            } else {
              moveComboHighlight(1);
            }
            return;
          }

          if (event.key === "ArrowUp") {
            event.preventDefault();

            if (!comboContext || comboContext.input !== input) {
              openCombo(input, row, col, true, false);
            } else {
              moveComboHighlight(-1);
            }
            return;
          }

          if (event.key === "Enter") {
            event.preventDefault();

            if (multi) {
              const query = input.value.trim();

              if (!query) {
                closeCombo();
                refreshMultiCell(td, tr, row, col, false);
                enterNavigationMode(td);
                return;
              }

              if (
                comboContext &&
                comboContext.input === input &&
                comboContext.matches.length
              ) {
                selectComboOption(
                  comboContext.matches[comboContext.activeIndex],
                  false
                );
              } else {
                addMultiValue(row, col, query);
                input.value = "";
                closeCombo();
                refreshMultiCell(td, tr, row, col, true);
              }
              return;
            }

            if (
              comboContext &&
              comboContext.input === input &&
              comboContext.matches.length
            ) {
              selectComboOption(
                comboContext.matches[comboContext.activeIndex],
                true
              );
            } else {
              commitSingleValue(input, row, col);
              enterNavigationMode(td);
            }
            return;
          }

          if (event.key === "Escape") {
            closeCombo();

            if (multi) {
              input.value = "";
            } else {
              input.value = String(row.cells[col.id] ?? "");
              input.select();
            }
            return;
          }

          if (event.key === "Tab") {
            if (multi) {
              const query = input.value.trim();
              if (query) addMultiValue(row, col, query);
            } else {
              commitSingleValue(input, row, col, false);
            }

            handleTabAtEnd(event, tr, input);
          }
        });

        input.addEventListener("blur", () => {
          setTimeout(() => {
            if (multi) {
              const query = input.value.trim();
              if (query) {
                addMultiValue(row, col, query);
                input.value = "";
              }
              refreshMultiCell(td, tr, row, col, false);
            } else {
              commitSingleValue(input, row, col, false);
            }

            if (comboContext?.input === input) closeCombo();
          }, 80);
        });

        arrow.addEventListener("mousedown", event => event.preventDefault());

        arrow.addEventListener("click", event => {
          event.stopPropagation();
          input.focus();
          openCombo(input, row, col, true, true);
        });

        entry.append(input, arrow);
        return entry;
      }

      function renderSingleSelectCell(td, tr, row, col) {
        td.className = "select-cell";
        td.dataset.editorKind = "combo";
        td.appendChild(createComboInput(td, tr, row, col, false));
      }

      function renderMultiCell(td, tr, row, col) {
        td.className = "multi-select-cell";
        td.dataset.editorKind = "multi";

        const wrap = document.createElement("div");
        wrap.className = "multi-wrap";

        normalizeMultiValue(row.cells[col.id]).forEach(value => {
          const valueRow = document.createElement("div");
          valueRow.className = "multi-value-row";

          const valueText = document.createElement("div");
          valueText.className = "multi-value-text";
          valueText.textContent = value;

          valueRow.appendChild(valueText);
          wrap.appendChild(valueRow);
        });

        td.replaceChildren(wrap);

        td.onclick = event => {
          if (navCell === td) return;
          activateMultiEditor(td, tr, row, col);
        };
      }

      function activateMultiEditor(td, tr, row, col) {
        if (mode !== "editor") return;
        let wrap = td.querySelector(".multi-wrap");
        if (!wrap) {
          renderMultiCell(td, tr, row, col);
          wrap = td.querySelector(".multi-wrap");
        }

        let input = td.querySelector(".combo-input");
        if (input) {
          input.focus();
          return;
        }

        const entry = createComboInput(td, tr, row, col, true);
        wrap.appendChild(entry);

        input = entry.querySelector(".combo-input");
        requestAnimationFrame(() => {
          input?.focus();
        });
      }

      function refreshMultiCell(td, tr, row, col, keepEditing = false) {
        closeCombo();
        td.replaceChildren();
        renderMultiCell(td, tr, row, col);

        if (keepEditing) {
          requestAnimationFrame(() => {
            activateMultiEditor(td, tr, row, col);
          });
        }
      }

      function getOptions(col) {
        if (!Array.isArray(state.selectOptions[col.id])) {
          state.selectOptions[col.id] = [];
        }
        return state.selectOptions[col.id];
      }

      function addOption(col, value, shouldSave = true) {
        const clean = String(value ?? "").trim();
        if (!clean) return;

        const options = getOptions(col);
        const exists = options.some(option =>
          String(option).localeCompare(
            clean,
            "zh-CN",
            { sensitivity: "base" }
          ) === 0
        );

        if (!exists) {
          options.push(clean);
          options.sort((a, b) =>
            String(a).localeCompare(String(b), "zh-CN", {
              numeric: true,
              sensitivity: "base"
            })
          );

          if (shouldSave) scheduleSave();
        }
      }

      function addMultiValue(row, col, value) {
        const clean = String(value ?? "").trim();
        if (!clean) return false;

        const values = normalizeMultiValue(row.cells[col.id]);
        const exists = values.some(item =>
          item.localeCompare(clean, "zh-CN", { sensitivity: "base" }) === 0
        );

        if (!exists) {
          values.push(clean);
          row.cells[col.id] = values;
        }

        addOption(col, clean, false);
        scheduleSave();
        return !exists;
      }

      function filteredOptions(col, query, row = null) {
        const q = String(query ?? "").trim().toLocaleLowerCase();
        let options = [...getOptions(col)];

        if (!q) return options;

        return options
          .filter(option =>
            String(option).toLocaleLowerCase().includes(q)
          )
          .sort((a, b) => {
            const aa = String(a).toLocaleLowerCase();
            const bb = String(b).toLocaleLowerCase();
            const aStarts = aa.startsWith(q) ? 0 : 1;
            const bStarts = bb.startsWith(q) ? 0 : 1;

            return (
              aStarts - bStarts ||
              aa.localeCompare(bb, "zh-CN", { numeric: true })
            );
          });
      }

      function openCombo(
        input,
        row,
        col,
        showEmptyState = true,
        showAll = false
      ) {
        const matches = showAll
          ? filteredOptions(col, "", row)
          : filteredOptions(col, input.value, row);

        comboContext = {
          input,
          row,
          col,
          matches,
          activeIndex: matches.length ? 0 : -1
        };

        input.setAttribute("aria-expanded", "true");
        renderComboMenu(showEmptyState);
        positionComboMenu(input);
      }

      function renderComboMenu(showEmptyState = true) {
        comboMenu.replaceChildren();

        if (!comboContext) {
          comboMenu.classList.remove("show");
          return;
        }

        const { matches, activeIndex, col } = comboContext;

        if (!matches.length) {
          if (!showEmptyState) {
            closeCombo();
            return;
          }

          const empty = document.createElement("div");
          empty.className = "combo-empty";
          empty.textContent = isMultiColumn(col)
            ? "没有匹配项；输入新内容后按 Enter 添加"
            : "没有匹配项；按 Enter 保存为新选项";
          comboMenu.appendChild(empty);
        } else {
          matches.forEach((value, index) => {
            const optionRow = document.createElement("div");
            optionRow.className = "combo-option-row";

            const option = document.createElement("button");
            option.type = "button";
            option.className =
              "combo-option" + (index === activeIndex ? " active" : "");
            const isSelected =
              isMultiColumn(col) &&
              normalizeMultiValue(comboContext.row.cells[col.id]).some(item =>
                item.localeCompare(
                  String(value),
                  "zh-CN",
                  { sensitivity: "base" }
                ) === 0
              );

            option.textContent = isSelected ? `✓ ${value}` : value;
            option.setAttribute("role", "option");
            option.setAttribute(
              "aria-selected",
              isSelected ? "true" : "false"
            );

            option.addEventListener("mousedown", event => {
              event.preventDefault();
              selectComboOption(value, !isMultiColumn(col));
            });

            const deleteButton = document.createElement("button");
            deleteButton.type = "button";
            deleteButton.className = "combo-delete-option";
            deleteButton.textContent = "×";
            deleteButton.title = "删除该下拉选项";
            deleteButton.setAttribute("aria-label", `删除选项 ${value}`);

            deleteButton.addEventListener("mousedown", event => {
              event.preventDefault();
              event.stopPropagation();
              deleteComboOption(value);
            });

            optionRow.append(option, deleteButton);
            comboMenu.appendChild(optionRow);
          });
        }

        comboMenu.classList.add("show");
      }

      function positionComboMenu(input) {
        if (!comboContext) return;

        const rect = input.getBoundingClientRect();
        const width = Math.max(180, rect.width);
        comboMenu.style.width = width + "px";

        const maxMenuHeight = Math.min(window.innerHeight * 0.6, 520);
        const menuHeight = Math.min(
          comboMenu.scrollHeight || 220,
          maxMenuHeight
        );

        let top = rect.bottom + 4;

        if (top + menuHeight > window.innerHeight - 8) {
          top = Math.max(8, rect.top - menuHeight - 4);
        }

        comboMenu.style.left =
          Math.max(
            8,
            Math.min(rect.left, window.innerWidth - width - 8)
          ) + "px";

        comboMenu.style.top = top + "px";
      }

      function deleteComboOption(value) {
        if (!comboContext) return;

        const { col, input, row } = comboContext;

        state.selectOptions[col.id] = getOptions(col).filter(option =>
          String(option).localeCompare(
            String(value),
            "zh-CN",
            { sensitivity: "base" }
          ) !== 0
        );

        comboContext.matches = filteredOptions(
          col,
          input.value,
          row
        );

        if (!comboContext.matches.length) {
          comboContext.activeIndex = -1;
        } else {
          comboContext.activeIndex = Math.min(
            Math.max(comboContext.activeIndex, 0),
            comboContext.matches.length - 1
          );
        }

        scheduleSave();
        renderComboMenu(true);
        positionComboMenu(input);
        input.focus();
      }

      function moveComboHighlight(direction) {
        if (!comboContext?.matches.length) return;

        const length = comboContext.matches.length;
        comboContext.activeIndex =
          (comboContext.activeIndex + direction + length) % length;

        renderComboMenu(true);
        positionComboMenu(comboContext.input);

        const active = comboMenu.querySelector(".combo-option.active");
        active?.scrollIntoView({ block: "nearest" });
      }

      function selectComboOption(value, finishInput = false) {
        if (!comboContext) return;

        const { input, row, col } = comboContext;
        const td = input.closest('td[data-column-id]');

        if (isMultiColumn(col)) {
          const values = normalizeMultiValue(row.cells[col.id]);
          const selectedIndex = values.findIndex(item =>
            item.localeCompare(
              String(value),
              "zh-CN",
              { sensitivity: "base" }
            ) === 0
          );

          if (selectedIndex >= 0) {
            values.splice(selectedIndex, 1);
            row.cells[col.id] = values;
            scheduleSave();
          } else {
            addMultiValue(row, col, value);
          }

          input.value = "";
          closeCombo();
          refreshMultiCell(td, td.closest("tr"), row, col, true);
          return;
        }

        input.value = value;
        row.cells[col.id] = value;
        addOption(col, value, false);
        scheduleSave();
        closeCombo();

        if (finishInput) {
          enterNavigationMode(td);
        } else {
          input.focus();
        }
      }

      function commitSingleValue(input, row, col, close = true) {
        const value = input.value.trim();
        input.value = value;
        row.cells[col.id] = value;

        if (value) addOption(col, value, false);

        scheduleSave();
        if (close) closeCombo();
      }

      function closeCombo() {
        if (comboContext?.input) {
          comboContext.input.setAttribute("aria-expanded", "false");
        }

        comboContext = null;
        comboMenu.classList.remove("show");
        comboMenu.replaceChildren();
      }

      function addRow(shouldRender = true) {
        const row = {
          id: crypto.randomUUID(),
          cells: {}
        };

        state.columns.forEach(col => {
          row.cells[col.id] = isMultiColumn(col) ? [] : "";
        });

        state.rows.push(row);

        if (shouldRender) render();
        return row;
      }

      function addColumn() {
        const id = makeColumnId();
        const index = state.columns.length + 1;

        state.columns.push({
          id,
          name: "新列 " + index,
          width: 210
        });

        state.rows.forEach(row => {
          row.cells[id] = "";
        });

        render();

        requestAnimationFrame(() => {
          const el = document.querySelector(
            `th[data-column-id="${CSS.escape(id)}"] .header-name`
          );

          if (!el) return;

          el.focus();

          const range = document.createRange();
          range.selectNodeContents(el);

          const selection = window.getSelection();
          selection.removeAllRanges();
          selection.addRange(range);
        });
      }

      function sortableText(value) {
        if (Array.isArray(value)) {
          return value.join(" / ");
        }
        return String(value ?? "");
      }

      function compareValues(a, b) {
        const av = sortableText(a).trim();
        const bv = sortableText(b).trim();

        if (av === "" && bv === "") return 0;
        if (av === "") return 1;
        if (bv === "") return -1;

        const an = Number(av.replace(/,/g, ""));
        const bn = Number(bv.replace(/,/g, ""));
        const bothNumeric = Number.isFinite(an) && Number.isFinite(bn);

        if (bothNumeric) return an - bn;

        return av.localeCompare(bv, "zh-CN", {
          numeric: true,
          sensitivity: "base"
        });
      }

      function compareAlbumAscending(a, b) {
        const av = sortableText(a).trim();
        const bv = sortableText(b).trim();

        if (av === "" && bv === "") return 0;
        if (av === "") return 1;
        if (bv === "") return -1;

        const getAlbumYear = value => {
          const matches = [...value.matchAll(/[（(]\s*(\d{4})\s*[）)]/g)];
          if (!matches.length) return Number.POSITIVE_INFINITY;
          return Number(matches[matches.length - 1][1]);
        };

        const ay = getAlbumYear(av);
        const by = getAlbumYear(bv);

        if (ay !== by) return ay - by;

        return av.localeCompare(bv, "zh-CN", {
          numeric: true,
          sensitivity: "base"
        });
      }

      function getSortedRows() {
        const rows = [...state.rows];

        if (!state.sortRules.length) return rows;

        return rows.sort((a, b) => {
          for (const rule of state.sortRules) {
            const column = state.columns.find(col => col.id === rule.columnId);
            let cmp;

            if (
              rule.direction === "asc" &&
              column &&
              (column.id === "album" || column.name === "专辑")
            ) {
              cmp = compareAlbumAscending(
                a.cells[rule.columnId],
                b.cells[rule.columnId]
              );
            } else {
              cmp = compareValues(
                a.cells[rule.columnId],
                b.cells[rule.columnId]
              );
            }

            if (cmp !== 0) {
              return rule.direction === "desc" ? -cmp : cmp;
            }
          }

          return 0;
        });
      }

      function addSortRule(
        columnId = state.columns[0]?.id,
        direction = "asc"
      ) {
        if (!columnId) return;

        state.sortRules.push({
          id: crypto.randomUUID(),
          columnId,
          direction
        });

        render();
      }

      function renderSortRules() {
        sortRules.replaceChildren();

        if (!state.sortRules.length) {
          const empty = document.createElement("div");
          empty.className = "hint";
          empty.style.padding = "8px 0 2px";
          empty.textContent = "当前没有排序规则。";
          sortRules.appendChild(empty);
          return;
        }

        state.sortRules.forEach(rule => {
          const row = document.createElement("div");
          row.className = "sort-rule";

          const colSelect = document.createElement("select");

          state.columns.forEach(col => {
            const option = document.createElement("option");
            option.value = col.id;
            option.textContent = col.name;
            option.selected = col.id === rule.columnId;
            colSelect.appendChild(option);
          });

          colSelect.addEventListener("change", () => {
            rule.columnId = colSelect.value;
            render();
          });

          const dirSelect = document.createElement("select");

          [["asc", "升序"], ["desc", "降序"]].forEach(([value, label]) => {
            const option = document.createElement("option");
            option.value = value;
            option.textContent = label;
            option.selected = value === rule.direction;
            dirSelect.appendChild(option);
          });

          dirSelect.addEventListener("change", () => {
            rule.direction = dirSelect.value;
            render();
          });

          const del = document.createElement("button");
          del.type = "button";
          del.title = "移除此规则";
          del.textContent = "×";

          del.addEventListener("click", () => {
            state.sortRules = state.sortRules.filter(
              item => item.id !== rule.id
            );
            render();
          });

          row.append(colSelect, dirSelect, del);
          sortRules.appendChild(row);
        });
      }

      function updateSortButton() {
        sortToggle.classList.toggle(
          "active",
          state.sortRules.length > 0
        );

        sortToggle.textContent = state.sortRules.length
          ? `⇅ 排序 ${state.sortRules.length}`
          : "⇅ 排序";
      }

      function openColumnMenu(anchor) {
        closeCombo();

        const rect = anchor.getBoundingClientRect();
        columnMenu.classList.add("show");

        const menuWidth = 180;
        const left = Math.min(
          rect.left,
          window.innerWidth - menuWidth - 12
        );

        let top = rect.bottom + 6;

        if (top + 170 > window.innerHeight) {
          top = Math.max(8, rect.top - 170);
        }

        columnMenu.style.left = Math.max(8, left) + "px";
        columnMenu.style.top = top + "px";
      }

      function closePopovers(except = null) {
        if (except !== "sort") sortPanel.classList.remove("show");
        if (except !== "column") columnMenu.classList.remove("show");
      }

      function sortSingleColumn(direction) {
        if (!activeColumnId) return;

        state.sortRules = [{
          id: crypto.randomUUID(),
          columnId: activeColumnId,
          direction
        }];

        closePopovers();
        render();
      }

      function renameActiveColumn() {
        if (!activeColumnId) return;

        closePopovers();

        const el = document.querySelector(
          `th[data-column-id="${CSS.escape(activeColumnId)}"] .header-name`
        );

        if (!el) return;

        el.focus();

        const range = document.createRange();
        range.selectNodeContents(el);

        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
      }

      function deleteActiveColumn() {
        if (!activeColumnId) return;

        if (state.columns.length <= 1) {
          alert("至少保留一列。");
          return;
        }

        state.columns = state.columns.filter(
          col => col.id !== activeColumnId
        );

        state.rows.forEach(row => {
          delete row.cells[activeColumnId];
        });

        state.sortRules = state.sortRules.filter(
          rule => rule.columnId !== activeColumnId
        );

        delete state.selectOptions[activeColumnId];
        activeColumnId = null;

        closePopovers();
        render();
      }


      document.getElementById("syncSettings").addEventListener("click", event => {
        event.stopPropagation(); populateSyncPanel(); syncPanel.classList.toggle("show");
      });
      document.getElementById("connectSync").addEventListener("click", async () => {
        setSyncStatus("正在验证并进入编辑终端…");
        try { await enterEditor(currentFormConfig(), syncToken.value.trim()); }
        catch (error) { setSyncStatus(`无法进入编辑终端：${error.message}`); }
      });
      document.getElementById("syncNow").addEventListener("click", publishSnapshot);
      document.getElementById("disconnectSync").addEventListener("click", async () => {
        clearToken(); syncToken.value = ""; rememberSyncToken.checked = false; await loadVisitorState();
      });
      document.getElementById("addRowTop").addEventListener("click", () => { if (mode === "editor") addRow(); });
      document.getElementById("addRowBottom").addEventListener("click", () => { if (mode === "editor") addRow(); });
      document.getElementById("addColumn").addEventListener("click", () => { if (mode === "editor") addColumn(); });
      sortToggle.addEventListener("click", event => {
        event.stopPropagation(); const show = !sortPanel.classList.contains("show"); closeCombo(); closePopovers(); if (show) sortPanel.classList.add("show");
      });
      document.getElementById("addSortRule").addEventListener("click", () => addSortRule());
      document.getElementById("clearSort").addEventListener("click", () => { state.sortRules = []; render(); });
      document.getElementById("sortAsc").addEventListener("click", () => sortSingleColumn("asc"));
      document.getElementById("sortDesc").addEventListener("click", () => sortSingleColumn("desc"));
      document.getElementById("renameColumn").addEventListener("click", renameActiveColumn);
      document.getElementById("deleteColumn").addEventListener("click", deleteActiveColumn);

      document.addEventListener("keydown", event => {
        if (!navCell || document.activeElement !== navCell) return;
        if (!["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(event.key)) return;
        event.preventDefault(); moveNavigationCell(navCell, event.key);
      });
      document.addEventListener("pointerdown", event => {
        if (!navCell || navCell.contains(event.target)) return; clearNavigationMode();
      }, true);
      document.addEventListener("click", event => {
        if (!syncPanel.contains(event.target) && event.target !== document.getElementById("syncSettings")) syncPanel.classList.remove("show");
        if (!sortPanel.contains(event.target) && event.target !== sortToggle) sortPanel.classList.remove("show");
        if (!columnMenu.contains(event.target) && !event.target.closest(".col-menu-btn")) columnMenu.classList.remove("show");
        if (!comboMenu.contains(event.target) && !event.target.closest(".combo-wrap") && !event.target.closest(".multi-entry")) closeCombo();
      });
      window.addEventListener("resize", () => { columnMenu.classList.remove("show"); closeCombo(); });

      const backToTop = document.getElementById("backToTop");
      let topTimer = null;
      window.addEventListener("scroll", event => {
        const pageScroll = event.target === document || event.target === document.documentElement || event.target === window;
        if (!pageScroll) return;
        backToTop.classList.toggle("visible", window.scrollY > 320);
        if (comboContext) closeCombo();
      }, { passive: true });
      backToTop.addEventListener("click", () => {
        if (topTimer) clearInterval(topTimer);
        topTimer = setInterval(() => {
          const current = window.scrollY || document.documentElement.scrollTop;
          if (current <= 0) { clearInterval(topTimer); topTimer = null; window.scrollTo(0, 0); return; }
          window.scrollTo(0, Math.max(0, current - Math.max(18, current * 0.12)));
        }, 10);
      });

      populateSyncPanel();
      const initialConfig = readConfig();
      const initialToken = getSyncToken();
      if (initialConfig && initialToken) {
        enterEditor(initialConfig, initialToken).catch(() => {
          mode = "editor";
          state = loadDraft() || structuredClone(emptyState);
          render(false);
          scheduleSave();
          setSyncStatus("编辑终端已从本机草稿启动；GitHub 暂时不可用。" );
        });
      } else {
        loadVisitorState();
      }
    })();
  </script>
</body>
